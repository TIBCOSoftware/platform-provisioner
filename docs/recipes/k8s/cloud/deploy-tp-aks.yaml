            protocol: nfs
          mountOptions:
            - soft
            - timeo=300
            - actimeo=1
            - retrans=2
            - _netdev
      ingress-nginx:
        enabled: false
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: dp-config-aks-storage-ems
  namespace: storage-system
  flags:
