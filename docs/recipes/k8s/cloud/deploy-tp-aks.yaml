# Recipe for installing TIBCO Platform AKS
apiVersion: v1
kind: helm-install
meta:
  globalEnvVariable:
    # piepline env
    REPLACE_RECIPE: true
    PIPELINE_LOG_DEBUG: false
    PIPELINE_CHECK_DOCKER_STATUS: false
    # chart repo
    GITHUB_TOKEN: ${GUI_GITHUB_TOKEN}
    TP_CHART_REPO: ${GUI_TP_CHART_REPO:-"https://tibcosoftware.github.io/tp-helm-charts"}
    TP_CHART_REPO_USER_NAME: ${GUI_TP_CHART_REPO_USER_NAME}
    TP_CHART_REPO_TOKEN: ${GUI_TP_CHART_REPO_TOKEN}
    PLATFORM_PROVISIONER_REPO: ${GUI_PLATFORM_PROVISIONER_REPO:-github.com/TIBCOSoftware/platform-provisioner}

    # container registry
    TP_CONTAINER_REGISTRY_URL: ${GUI_TP_CONTAINER_REGISTRY_URL:-"csgprduswrepoedge.jfrog.io"}
    TP_CONTAINER_REGISTRY_REPOSITORY: ${GUI_TP_CONTAINER_REGISTRY_REPOSITORY:-"tibco-platform-docker-prod"}
    TP_CONTAINER_REGISTRY_USER: ${GUI_TP_CONTAINER_REGISTRY_USER}
    TP_CONTAINER_REGISTRY_PASSWORD: ${GUI_TP_CONTAINER_REGISTRY_PASSWORD}

    # Azure env
    ACCOUNT: ${ACCOUNT:-"azure-"} # Azure account prefix to trigger authenticating with Azure
    TP_RESOURCE_GROUP: ${GUI_TP_RESOURCE_GROUP} # Azure resource group name
    AZURE_RESOURCE_GROUP: ${TP_RESOURCE_GROUP} # provisioner pipeline assume role needed
    TP_AZURE_REGION: ${GUI_TP_AZURE_REGION:-"westus2"} # the default region for the azure account

    # cluster
    TP_CLUSTER_NAME: ${GUI_TP_CLUSTER_NAME}
    TP_CLUSTER_VERSION: ${GUI_TP_CLUSTER_VERSION:-1.33}
    TP_AUTHORIZED_IP: ${GUI_TP_AUTHORIZED_IP} # your ip x.x.x.x/32
    TP_VNET_CIDR: ${GUI_TP_VNET_CIDR:-"10.4.0.0/16"}
    TP_AKS_SUBNET_CIDR: ${GUI_TP_AKS_SUBNET_CIDR:-"10.4.0.0/20"}
    TP_ADDON_ENABLE_APPLICATION_GW: ${GUI_TP_ADDON_ENABLE_APPLICATION_GW:-"false"}
    TP_APPLICATION_GW_SUBNET_CIDR: ${GUI_TP_APPLICATION_GW_SUBNET_CIDR:-"10.4.17.0/24"}
    TP_NAT_GW_SUBNET_CIDR: ${GUI_TP_NAT_GW_SUBNET_CIDR:-"10.4.18.0/27"}
    TP_APISERVER_SUBNET_CIDR: ${GUI_TP_APISERVER_SUBNET_CIDR:-"10.4.19.0/28"}
    TP_SERVICE_CIDR: ${GUI_TP_CLUSTER_SERVICE_CIDR:-"10.0.0.0/16"}
    TP_SERVICE_DNS_IP: ${GUI_TP_SERVICE_DNS_IP:-"10.0.0.10"}

    # domain
    TP_TOP_LEVEL_DOMAIN: ${GUI_TP_TOP_LEVEL_DOMAIN} # the top level domain for the main ingress
    TP_SANDBOX: ${GUI_TP_SANDBOX} # the sandbox for the main ingress
    TP_MAIN_INGRESS_SANDBOX_SUBDOMAIN: ${GUI_TP_MAIN_INGRESS_SANDBOX_SUBDOMAIN}
    TP_DOMAIN: ${TP_MAIN_INGRESS_SANDBOX_SUBDOMAIN}.${TP_SANDBOX}.${TP_TOP_LEVEL_DOMAIN} # the actual domain for the TIBCO platform. Sample format: <cp/dp-env>.${SANDBOX}.${TP_TOP_LEVEL_DOMAIN}
    TP_SECONDARY_INGRESS_SANDBOX_SUBDOMAIN: ${GUI_TP_SECONDARY_INGRESS_SANDBOX_SUBDOMAIN}
    TP_SECONDARY_DOMAIN: ${TP_SECONDARY_INGRESS_SANDBOX_SUBDOMAIN}.${TP_SANDBOX}.${TP_TOP_LEVEL_DOMAIN} # the star domain for the secondary ingress <cp/dp-env>-apps.${SANDBOX}.${TP_TOP_LEVEL_DOMAIN}

    # ingress
    TP_GENERATE_CLUSTER_ISSUER: ${GUI_TP_GENERATE_CLUSTER_ISSUER:-true}
    TP_CERTIFICATE_CLUSTER_ISSUER: ${GUI_TP_CERTIFICATE_CLUSTER_ISSUER:-"cic-cert-subscription-scope-production-main"} # the cluster issuer
    TP_MAIN_INGRESS_CLASS_NAME: "azure-application-gateway" # name of azure application gateway ingress controller
    TP_DNS_RESOURCE_GROUP: ${GUI_TP_DNS_RESOURCE_GROUP} # must provide
    TP_INGRESS_CLASS: ${GUI_TP_INGRESS_CLASS:-"nginx"} # name of main ingress class used by capabilities
    TP_SECONDARY_INGRESS_CLASS: ${GUI_TP_SECONDARY_INGRESS_CLASS}
    TP_INGRESS_NAMESPACE: ${GUI_TP_INGRESS_NAMESPACE:-"ingress-system"} # namespace for the ingress controller
    TP_INGRESS_RELEASE_NAME: dp-config-aks-ingress
    TP_SECONDARY_INGRESS_RELEASE_NAME: dp-config-aks-secondary-ingress

    # network policy
    TP_CLUSTER_ENABLE_NETWORK_POLICY: ${GUI_TP_CLUSTER_ENABLE_NETWORK_POLICY:-false}

    # storage
    TP_DISK_ENABLED: "true" # name of azure disk storage class
    TP_DISK_STORAGE_CLASS: "azure-disk-sc" # name of azure disk storage class
    TP_FILE_ENABLED: "true" # to enable azure files storage class
    TP_FILE_STORAGE_CLASS: "azure-files-sc" # name of azure files storage class
    TP_STORAGE_CLASS: "${TP_DISK_STORAGE_CLASS}" # name of azure disk storage class

    # TP versions
    TP_CHART_VERSION_DP_CONFIG_AKS: ${GUI_TP_CHART_VERSION_DP_CONFIG_AKS:-"^1.0.0"}
    TP_CHART_VERSION_DP_CONFIG_ES: ${GUI_TP_CHART_VERSION_DP_CONFIG_ES:-"^1.0.0"}

    # o11y
    TP_ES_RELEASE_NAME: "dp-config-es" # name of dp-config-es release name

    # elasticsearch
    TP_DEPLOY_ES: "true" # set to true to deploy elasticsearch
    TP_CONFIG_ES_VERSION: "8.17.3" # version of elasticsearch
    TP_CONFIG_ES_KIBANA_COUNT: "0" # number of kibana instances
    TP_DEPLOY_ES_INGRESS: "true" # set to true to deploy elasticsearch ingress
    TP_DEPLOY_KIBANA: "true" # set to true to deploy kibana
    TP_DEPLOY_KIBANA_INGRESS: "true" # set to true to deploy kibana ingress

    # apm
    TP_DEPLOY_APM: "true" # set to true to deploy apm
    TP_DEPLOY_APM_INGRESS: "true" # set to true to deploy apm ingress

    # grafana
    TP_GRAFANA_ADMIN_PASSWORD: "${GUI_TP_GRAFANA_ADMIN_PASSWORD:-$(openssl rand -base64 16)}" # set grafana admin password

    # flow control
    TP_INSTALL_K8S: ${GUI_TP_INSTALL_K8S:-true} # change to true to install k8s
    TP_INSTALL_RESOURCE_FOLDER: "/workspace/resources"
    TP_INSTALL_CHART_VALUES_FILE: "/workspace/resources/global-values.yaml"
    TP_INSTALL_STORAGE: ${GUI_TP_INSTALL_STORAGE:-true}
    TP_INSTALL_STORAGE_EMS: ${GUI_TP_INSTALL_STORAGE_EMS:-false} # set to true to install storage for TIBCO Enterprise Message Service™ (EMS) recommended production
    TP_SCRIPT_BRANCH: ${GUI_TP_SCRIPT_BRANCH:-main}
    TP_INSTALL_CERT_MANAGER: ${GUI_TP_INSTALL_CERT_MANAGER:-true}
    TP_INSTALL_EXTERNAL_DNS: ${GUI_TP_INSTALL_EXTERNAL_DNS:-true}
    TP_INSTALL_POSTGRES: ${GUI_TP_INSTALL_POSTGRES:-true}
    TP_INSTALL_O11Y: ${GUI_TP_INSTALL_O11Y:-false}
    # Do not change, variables to configure nginx/kong/traefik/istio related resources based on ingressclass / gatewayclass passed
    TP_ENABLE_NGINX: $([[ "$TP_INGRESS_CLASS" == "nginx" ]] && echo "true" || echo "false")
    TP_ENABLE_TRAEFIK: $([[ "$TP_INGRESS_CLASS" == "traefik" ]] && echo "true" || echo "false")
    TP_ENABLE_NGINX_GATEWAY_FABRIC: $([[ "$TP_INGRESS_CLASS" == "nginx-gateway-fabric" ]] && echo "true" || echo "false")
    TP_ENABLE_INGRESS_CONTROLLER: $([[ "$TP_INGRESS_CLASS" == "nginx" || "$TP_INGRESS_CLASS" == "traefik" || "$TP_INGRESS_CLASS" == "haproxy" || "$TP_INGRESS_CLASS" == "nginx-gateway-fabric" ]] && echo "true" || echo "false")
    TP_ENABLE_HAPROXY: $([[ "$TP_INGRESS_CLASS" == "haproxy" ]] && echo "true" || echo "false")
    TP_ENABLE_ISTIO_GATEWAY: $([[ "$TP_INGRESS_CLASS" == "istio-gateway" ]] && echo "true" || echo "false")
    TP_ENABLE_SECONDARY_KONG: $([[ "$TP_SECONDARY_INGRESS_CLASS" == "kong" ]] && echo "true" || echo "false")
    TP_DEPLOY_SECONDARY_INGRESS: $([[ "$TP_ENABLE_SECONDARY_KONG" == "true" ]] && echo "true" || echo "false")
    TP_SKIP_GENERATE_MAIN_INGRESS_CERTIFICATE: false
    TP_SKIP_GENERATE_SECONDARY_INGRESS_CERTIFICATE: false
  tools:
    yq: "4.40"
preTasks:
- condition: ${TP_INSTALL_K8S}
  repo:
    git:
      github:
        repo: ${PLATFORM_PROVISIONER_REPO}
        path: docs/recipes/k8s/cloud/scripts/aks
        branch: ${TP_SCRIPT_BRANCH}
  script:
    ignoreErrors: false
    fileName: pre-aks-cluster-script.sh
- condition: ${TP_INSTALL_K8S}
  repo:
    git:
      github:
        repo: ${PLATFORM_PROVISIONER_REPO}
        path: docs/recipes/k8s/cloud/scripts/aks
        branch: ${TP_SCRIPT_BRANCH}
  script:
    ignoreErrors: false
    fileName: script.sh
    content: |
      #!/bin/bash
      # This script is used to create aks cluster
      echo "listing az extensions"
      az extension list
      echo "installing az extensions aks-preview"
      # Pin aks-preview to the version compatible with the image's azure-cli core
      # (see docker/Dockerfile AKS_PREVIEW_VERSION / AZURE_CLI_VERSION). Do NOT
      # `az extension update`: it pulls the latest aks-preview, and if it outpaces the
      # base core `az aks create` fails with "too many values to unpack".
      az extension add --name aks-preview --version "${AKS_PREVIEW_VERSION:-21.0.0b10}" --upgrade
      chmod +x create-aks.sh
      ./create-aks.sh
- condition: ${TP_INSTALL_K8S}
  repo:
    git:
      github:
        repo: ${PLATFORM_PROVISIONER_REPO}
        path: docs/recipes/k8s/cloud/scripts/aks
        branch: ${TP_SCRIPT_BRANCH}
  script:
    ignoreErrors: false
    fileName: post-aks-cluster-script.sh
helmCharts:
- name: cert-manager
  condition: ${TP_INSTALL_CERT_MANAGER}
  version: v1.17.1 # release: https://github.com/cert-manager/cert-manager/releases
  repo:
    helm:
      url: https://charts.jetstack.io
  values:
    keepPrevious: true
    content: |
      installCRDs: true
      podLabels:
        azure.workload.identity/use: "true"
      serviceAccount:
        labels:
          azure.workload.identity/use: "true"
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: cert-manager
  namespace: cert-manager
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=0"
- name: external-dns
  condition: ${TP_INSTALL_EXTERNAL_DNS}
  version: 1.15.2 # release: https://github.com/kubernetes-sigs/external-dns/releases
  repo:
    helm:
      url: https://kubernetes-sigs.github.io/external-dns/
  values:
    keepPrevious: true
    content: |
      provider: azure
      domainFilters:
        - ${TP_SANDBOX}.${TP_TOP_LEVEL_DOMAIN}   # must be the sandbox domain as we create DNS zone for this
      extraVolumes: # for azure.json
      - name: azure-config-file
        secret:
          secretName: azure-config-file
      extraVolumeMounts:
      - name: azure-config-file
        mountPath: /etc/kubernetes
        readOnly: true
      extraArgs:
        # only register DNS for these ingress classes
        - --ingress-class=${TP_INGRESS_CLASS}
        - --txt-wildcard-replacement=wildcard    # issue for Azure dns zone: https://github.com/kubernetes-sigs/external-dns/issues/2922
        - --gateway-namespace=${TP_INGRESS_NAMESPACE}
      gatewayNamespace: ${TP_INGRESS_NAMESPACE}
      sources:
      - ingress
      - service
      - gateway-httproute
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: external-dns
  namespace: external-dns-system
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=0"
- name: dp-config-aks # this is used to deploy cluster issuer
  condition: ${TP_GENERATE_CLUSTER_ISSUER}
  version: "${TP_CHART_VERSION_DP_CONFIG_AKS}"
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: true
    content: |
      global:
        dnsSandboxSubdomain: "${TP_SANDBOX}"          # must be the sandbox domain as we create DNS zone for this
        dnsGlobalTopDomain: "${TP_TOP_LEVEL_DOMAIN}"  # must be the top level domain
        azureSubscriptionDnsResourceGroup: "${TP_DNS_RESOURCE_GROUP}"
      httpIngress:
        enabled: false
        name: main # this is part of cluster issuer name. 
      ingress-nginx:
        enabled: false
      kong:
        enabled: false
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: ${TP_INGRESS_RELEASE_NAME}-certificate
  namespace: ${TP_INGRESS_NAMESPACE}
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    extra: "--values ${TP_INSTALL_CHART_VALUES_FILE}"
    labels: "layer=1"
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # this is used to provide Azure information to ingress
        mkdir -p "${TP_INSTALL_RESOURCE_FOLDER}"
        touch "${TP_INSTALL_CHART_VALUES_FILE}"
        export client_id=$(az aks show --resource-group "${TP_RESOURCE_GROUP}" --name "${TP_CLUSTER_NAME}" --query "identityProfile.kubeletidentity.clientId" --output tsv)
        export subscription_id=$(az account show --query id -o tsv)
        yq eval '.global += {"azureAwiAsoDnsClientId": env(client_id), "azureSubscriptionId": env(subscription_id)}' "${TP_INSTALL_CHART_VALUES_FILE}" -i
        echo "injected values:"
        cat "${TP_INSTALL_CHART_VALUES_FILE}"
- name: dp-config-aks
  condition: ${TP_ENABLE_INGRESS_CONTROLLER}
  version: "${TP_CHART_VERSION_DP_CONFIG_AKS}"
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: true
    content: |
      clusterIssuer:
        create: false
      httpIngress:
        enabled: false
      ingress-nginx:
        enabled: ${TP_ENABLE_NGINX}
        controller:
          service:
            type: LoadBalancer # use NLB for nginx, set to ClusterIP when using ALB
            annotations:
              external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
            enableHttp: false # disable http 80 port on service and NLB
          config:
            # required by apps swagger
            use-forwarded-headers: 'true'          # PDP-945
          extraArgs:
            default-ssl-certificate: ${TP_INGRESS_NAMESPACE}/tp-certificate-main-ingress
      traefik:
        enabled: ${TP_ENABLE_TRAEFIK}
        service:
          type: LoadBalancer # use NLB for Traefik, set to ClusterIP when using ALB
          annotations:
            external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
            service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
        ingressRoute: # for dashboard
          dashboard:
            enabled: true
            matchRule: Host(`traefik-alb-apps.${TP_DOMAIN}`) && PathPrefix(`/dashboard`) || Host(`traefik-alb-apps.${TP_DOMAIN}`) && PathPrefix(`/api`)
            entryPoints:
              - traefik
              - web
              - websecure
        providers:  # for external service
          kubernetesIngress:
            allowExternalNameServices: true
        additionalArguments:
          - '--entryPoints.websecure.forwardedHeaders.insecure'
          - '--serversTransport.insecureSkipVerify=true'
          - '--providers.kubernetesingress.ingressendpoint.publishedservice=${TP_INGRESS_NAMESPACE}/${TP_INGRESS_RELEASE_NAME}-traefik'
        tlsStore:
          default:
            defaultCertificate:
              secretName: tp-certificate-main-ingress
      nginx-gateway-fabric:
        enabled: ${TP_ENABLE_NGINX_GATEWAY_FABRIC}
        nginxGateway:
          gatewayClassName: nginx
          gatewayControllerName: gateway.nginx.org/nginx-gateway-controller
          config:
            logging:
              level: info
        nginx:
          service:
            type: LoadBalancer
      haproxy:
        enabled: ${TP_ENABLE_HAPROXY}
        controller:
          service:
            type: LoadBalancer # use NLB for nginx, set to ClusterIP when using ALB
            annotations:
              external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
            enableHttp: false # disable http 80 port on service and NLB
          config:
            # This replaces the 'haproxy.org/frontend-config-snippet' annotation
            # It injects these lines into the main HAProxy frontend section
            frontend-config-snippet: |
              # 1. Standard Forwarded Headers
              http-request set-header X-Forwarded-Proto https if { ssl_fc }
              http-request set-header X-Forwarded-Port 443 if { ssl_fc }
              
              # 2. THE FIX: Strip Port 80 from Host headers
              # This takes the Host, finds the ":" and keeps only the first part (the domain)
              http-request set-header Host %[hdr(host),field(1,:)]
              http-request set-header X-Forwarded-Host %[hdr(host),field(1,:)]
          ingressClass: haproxy
          replicaCount: 1
          defaultTLSSecret:
            enabled: true
            secretNamespace: ${TP_INGRESS_NAMESPACE}
            secret: tp-certificate-main-ingress     
      kong:
        enabled: false
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: ${TP_INGRESS_RELEASE_NAME}
  namespace: ${TP_INGRESS_NAMESPACE}
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=1"
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: ${TP_SKIP_GENERATE_MAIN_INGRESS_CERTIFICATE}
      content: |
        # create a namespace for the main ingress
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${TP_INGRESS_NAMESPACE}
          labels:
            networking.platform.tibco.com/non-cp-ns: enable
        EOF
        
        # install gateway api crd (only needed for nginx-gateway-fabric's Gateway object;
        # other ingress classes use plain Ingress resources and do not require these CRDs)
        if [[ "${TP_ENABLE_NGINX_GATEWAY_FABRIC}" == "true" ]]; then
          kubectl kustomize "https://github.com/nginx/nginx-gateway-fabric/config/crd/gateway-api/standard?ref=v2.3.0" | kubectl apply -f -
        fi

        # create a certificate for the main ingress
        kubectl apply -f - << EOF
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: tp-certificate-main-ingress
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          secretName: tp-certificate-main-ingress
          issuerRef:
            name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
            kind: ClusterIssuer
          dnsNames:
            - '*.${TP_DOMAIN}'
        EOF
    postDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # The Gateway and ClientSettingsPolicy below are nginx-gateway-fabric specific.
        # The ClientSettingsPolicy CRD (gateway.nginx.org/v1alpha1) only ships with
        # nginx-gateway-fabric, so only apply these when it is the selected ingress class.
        # Otherwise (nginx, traefik, haproxy, ...) skip them to avoid a "no matches for
        # kind ClientSettingsPolicy" failure.
        if [[ "${TP_ENABLE_NGINX_GATEWAY_FABRIC}" == "true" ]]; then

        # Create Gateway object for nginx-gateway-fabric
        kubectl apply -f - <<EOF
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: nginx-gateway
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          gatewayClassName: nginx
          infrastructure:
            annotations:
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
              external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
          listeners:
          - allowedRoutes:
              namespaces:
                from: All
            name: https
            port: 443
            protocol: HTTPS
            tls:
              certificateRefs:
              - group: ""
                kind: Secret
                name: tp-certificate-main-ingress
              mode: Terminate
        EOF

        # Create clientSettingsPolicy for nginx-gateway-fabric to increase file upload size
        kubectl apply -f - <<EOF
        apiVersion: gateway.nginx.org/v1alpha1
        kind: ClientSettingsPolicy
        metadata:
          name: gateway-client-settings
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          targetRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: nginx-gateway
          body:
            maxSize: "200m"
        EOF

        else
          echo "Ingress class '${TP_INGRESS_CLASS}' is not nginx-gateway-fabric; skipping Gateway and ClientSettingsPolicy creation."
        fi
# Istio installation: istio-base and istiod MUST be in istio-system namespace due to hardcoded references in CRDs, webhooks, and RBAC
# Gateway resource (data plane) is deployed to ingress-system via postDeploy hook
- condition: ${TP_ENABLE_ISTIO_GATEWAY}
  name: dp-config-aks
  namespace: istio-system
  version: "${TP_CHART_VERSION_DP_CONFIG_AKS}"
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: true
    content: |
      clusterIssuer:
        create: false
      httpIngress:
        enabled: false
      istio-base:
        enabled: true
      istiod:
        enabled: true
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: istio
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=1"
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # Create ingress namespace
        kubectl create ns ${TP_INGRESS_NAMESPACE}
        kubectl label namespace ${TP_INGRESS_NAMESPACE} networking.platform.tibco.com/non-dp-ns=enable --overwrite
        kubectl label namespace ${TP_INGRESS_NAMESPACE} networking.platform.tibco.com/non-cp-ns=enable --overwrite
        # Install Gateway API CRDs for HTTPRoute support (only if not already present)
        kubectl get crd gateways.gateway.networking.k8s.io &> /dev/null || \
          { kubectl kustomize "github.com/kubernetes-sigs/gateway-api/config/crd?ref=v1.4.0" | kubectl apply -f -; }
        # create a certificate for the main ingress
        kubectl apply -f - << EOF
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: tp-certificate-main-ingress
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          secretName: tp-certificate-main-ingress
          issuerRef:
            name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
            kind: ClusterIssuer
          dnsNames:
            - '*.${TP_DOMAIN}'
        EOF
    postDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # Create Gateway using Kubernetes Gateway API for HTTPRoute compatibility
        # Note: Gateway resource auto-provisions deployment and service (no gateway helm chart needed)
        # GatewayClass 'istio' is automatically created by istiod
        kubectl apply -f - <<EOF
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: istio-gateway
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          gatewayClassName: istio
          infrastructure:
            annotations:
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
              external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
          listeners:
          - name: https
            hostname: "*.${TP_DOMAIN}"
            port: 443
            protocol: HTTPS
            tls:
              mode: Terminate
              certificateRefs:
              - kind: Secret
                name: tp-certificate-main-ingress
            allowedRoutes:
              namespaces:
                from: All
        EOF
        # Create EnvoyFilter to fix host headers and set X-Forwarded headers for proper HTTPS handling
        kubectl apply -f - <<EOF
        apiVersion: networking.istio.io/v1alpha3
        kind: EnvoyFilter
        metadata:
          name: fix-host-headers
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          workloadSelector:
            labels:
              gateway.networking.k8s.io/gateway-name: istio-gateway
          configPatches:
          - applyTo: HTTP_FILTER
            match:
              context: GATEWAY
              listener:
                filterChain:
                  filter:
                    name: "envoy.filters.network.http_connection_manager"
            patch:
              operation: INSERT_BEFORE
              value:
                name: envoy.lua
                typed_config:
                  "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
                  inlineCode: |
                    function envoy_on_request(request_handle)
                      local headers = request_handle:headers()
                      headers:replace("X-Forwarded-Proto", "https")
                      headers:replace("X-Forwarded-Port", "443")
                      local authority = headers:get(":authority")
                      if not authority then authority = headers:get("Host") end
                      if authority then
                        local s, e = string.find(authority, ":")
                        if s then
                          local clean_host = string.sub(authority, 1, s-1)
                          headers:replace(":authority", clean_host)
                          headers:replace("Host", clean_host)
                          headers:replace("X-Forwarded-Host", clean_host)
                        end
                      end
                    end
        EOF
        # Wait for Gateway to be programmed
        kubectl wait --timeout=5m -n ${TP_INGRESS_NAMESPACE} gateway/istio-gateway --for=condition=Programmed
- name: dp-config-aks
  condition: ${TP_DEPLOY_SECONDARY_INGRESS}
  version: "${TP_CHART_VERSION_DP_CONFIG_AKS}"
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: true
    content: |
      clusterIssuer:
        create: false
      httpIngress:
        enabled: false
      ingress-nginx:
        enabled: false
      kong:
        enabled: ${TP_ENABLE_SECONDARY_KONG}
        secretVolumes:
        - tp-certificate-secondary-ingress
        env:
          ssl_cert: /etc/secrets/tp-certificate-secondary-ingress/tls.crt
          ssl_cert_key: /etc/secrets/tp-certificate-secondary-ingress/tls.key
        proxy:
          type: LoadBalancer
          annotations:
            external-dns.alpha.kubernetes.io/hostname: "*.${TP_SECONDARY_DOMAIN}"
            service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
          tls:
            enabled: true
          http:
            enabled: false
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: ${TP_SECONDARY_INGRESS_RELEASE_NAME}
  namespace: ${TP_INGRESS_NAMESPACE}
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=1"
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: ${TP_SKIP_GENERATE_SECONDARY_INGRESS_CERTIFICATE}
      content: |
        # create a namespace for the main ingress
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${TP_INGRESS_NAMESPACE}
          labels:
            networking.platform.tibco.com/non-cp-ns: enable
        EOF
        
        # create a certificate for the main ingress
        kubectl apply -f - << EOF
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: tp-certificate-secondary-ingress
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          secretName: tp-certificate-secondary-ingress
          issuerRef:
            name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
            kind: ClusterIssuer
          dnsNames:
            - '*.${TP_SECONDARY_DOMAIN}'
        EOF
- name: dp-config-aks
  condition: ${TP_INSTALL_STORAGE}
  version: "${TP_CHART_VERSION_DP_CONFIG_AKS}"
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: true
    base64Encoded: false
    content: |
      httpIngress:
        enabled: false
      clusterIssuer:
        create: false
      storageClass:
        azuredisk:
          enabled: ${TP_DISK_ENABLED}
          name: ${TP_DISK_STORAGE_CLASS}
          volumeBindingMode: Immediate
        azurefile: # this is used for standard CP/DP storage
          enabled: ${TP_FILE_ENABLED}
          name: ${TP_FILE_STORAGE_CLASS}
          volumeBindingMode: Immediate # must be set to Immediate for CP
          parameters:
            skuName: Premium_LRS
            allowBlobPublicAccess: "false"
            networkEndpointType: privateEndpoint
          mountOptions:
            - mfsymlinks
            - cache=strict
            - nosharesock
      ingress-nginx:
        enabled: false
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: dp-config-aks-storage
  namespace: storage-system
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=1"
- name: dp-config-aks
  version: "${TP_CHART_VERSION_DP_CONFIG_AKS}"
