# Recipe for installing TIBCO Platform EKS
apiVersion: v1
kind: helm-install
meta:
  globalEnvVariable:
    # piepline env
    REPLACE_RECIPE: true
    PIPELINE_LOG_DEBUG: false
    PIPELINE_CHECK_DOCKER_STATUS: false
    # chart repo
    GITHUB_TOKEN: ${GUI_GITHUB_TOKEN}
    TP_CHART_REPO: ${GUI_TP_CHART_REPO:-"https://tibcosoftware.github.io/tp-helm-charts"}
    TP_CHART_REPO_USER_NAME: ${GUI_TP_CHART_REPO_USER_NAME}
    TP_CHART_REPO_TOKEN: ${GUI_TP_CHART_REPO_TOKEN}
    PLATFORM_PROVISIONER_REPO: ${GUI_PLATFORM_PROVISIONER_REPO:-"github.com/TIBCOSoftware/platform-provisioner"}
    # container registry
    TP_CONTAINER_REGISTRY_URL: ${GUI_TP_CONTAINER_REGISTRY_URL:-"csgprduswrepoedge.jfrog.io"}
    TP_CONTAINER_REGISTRY_REPOSITORY: ${GUI_TP_CONTAINER_REGISTRY_REPOSITORY:-"tibco-platform-docker-prod"}
    TP_CONTAINER_REGISTRY_USER: ${GUI_TP_CONTAINER_REGISTRY_USER}
    TP_CONTAINER_REGISTRY_PASSWORD: ${GUI_TP_CONTAINER_REGISTRY_PASSWORD}
    # cluster
    TP_CLUSTER_NAME: ${GUI_TP_CLUSTER_NAME}
    TP_CLUSTER_VERSION: ${GUI_TP_CLUSTER_VERSION:-1.31}
    TP_CLUSTER_REGION: ${AWS_REGION:-us-west-2}
    TP_CLUSTER_INSTANCE_TYPE: ${GUI_TP_CLUSTER_INSTANCE_TYPE:-"m5a.xlarge"}
    # domain
    TP_DOMAIN: ${GUI_TP_DOMAIN} # the star domain for the main ingress <cp/dp-env>.${SANDBOX}.dataplanes.pro
    TP_CLUSTER_VPC_CIDR: ${GUI_TP_CLUSTER_CIDR:-"10.180.0.0/16"}
    # ingress
    TP_INGRESS_CLASS: ${GUI_TP_INGRESS_CLASS:-"nginx"}
    TP_SECONDARY_INGRESS_CLASS: ${GUI_TP_SECONDARY_INGRESS_CLASS}
    TP_SECONDARY_DOMAIN: ${GUI_TP_SECONDARY_DOMAIN} # the star domain for the secondary ingress <cp/dp-env>-apps.${SANDBOX}.dataplanes.pro
    TP_INGRESS_RELEASE_NAME: dp-config-aws-ingress
    TP_SECONDARY_INGRESS_RELEASE_NAME: dp-config-aws-secondary-ingress
    TP_INGRESS_NAMESPACE: ${GUI_TP_INGRESS_NAMESPACE:-"ingress-system"}
    TP_CERTIFICATE_CLUSTER_ISSUER: ${GUI_TP_CERTIFICATE_CLUSTER_ISSUER:-"tp-prod"} # the cluster issuer for tp-certificate
    # network policy
    TP_CLUSTER_ENABLE_NETWORK_POLICY: ${GUI_TP_CLUSTER_ENABLE_NETWORK_POLICY:-true}
    # storage
    TP_EBS_ENABLED: true
    TP_EFS_ENABLED: true
    TP_STORAGE_CLASS: ebs-gp3
    TP_STORAGE_CLASS_EFS: efs-sc
    TP_INSTALL_RESOURCE_FOLDER: "/workspace/resources"
    TP_INSTALL_EFS_VALUES_FILE: "${TP_INSTALL_RESOURCE_FOLDER}/efs_values.yaml"
    TP_EFS_KMS_KEY_ID: ${GUI_TP_EFS_KMS_KEY_ID:-""} # Optional: Custom KMS key ID for EFS encryption. Empty by default, uses default AWS EFS KMS key
    # TP versions
    TP_CHART_VERSION_DP_CONFIG_AWS: ${GUI_TP_CHART_VERSION_DP_CONFIG_AWS:-"^1.0.0"}
    TP_CHART_VERSION_DP_CONFIG_ES: ${GUI_TP_CHART_VERSION_DP_CONFIG_ES:-"^1.0.0"}
    # o11y
    TP_ES_RELEASE_NAME: "dp-config-es" # name of dp-config-es release name
    # elasticsearch
    TP_DEPLOY_ES: "true" # set to true to deploy elasticsearch
    TP_CONFIG_ES_VERSION: "8.17.3" # version of elasticsearch
    TP_CONFIG_ES_KIBANA_COUNT: "0" # number of kibana instances
    TP_DEPLOY_KIBANA: "true" # set to true to deploy kibana
    # apm
    TP_DEPLOY_APM: "true" # set to true to deploy apm
    # grafana
    TP_GRAFANA_ADMIN_PASSWORD: "${GUI_TP_GRAFANA_ADMIN_PASSWORD:-$(openssl rand -base64 16)}" # set grafana admin password
    # flow control
    TP_INSTALL_K8S: ${GUI_TP_INSTALL_K8S:-true} # change to true to install k8s
    TP_INSTALL_EFS: ${GUI_TP_INSTALL_EFS:-true} # change to true to install efs
    TP_INSTALL_STORAGE: ${GUI_TP_INSTALL_STORAGE:-true} # change to false to skip storage installation
    TP_SCRIPT_BRANCH: ${GUI_TP_SCRIPT_BRANCH:-main}
    TP_SCRIPT_NAME_SH_EKS: create-eks.sh # the script that DP will run
    TP_SCRIPT_NAME_SH_EFS: create-efs.sh # the script that DP will run
    TP_INSTALL_POSTGRES: ${GUI_TP_INSTALL_POSTGRES:-true}
    # Do not change, variables to configure nginx/kong related resources based on ingressclass passed
    TP_ENABLE_NGINX: $([[ "$TP_INGRESS_CLASS" == "nginx" ]] && echo "true" || echo "false")
    TP_ENABLE_TRAEFIK: $([[ "$TP_INGRESS_CLASS" == "traefik" ]] && echo "true" || echo "false")
    TP_ENABLE_NGINX_GATEWAY_FABRIC: $([[ "$TP_INGRESS_CLASS" == "nginx-gateway-fabric" ]] && echo "true" || echo "false")
    TP_ENABLE_HAPROXY: $([[ "$TP_INGRESS_CLASS" == "haproxy" ]] && echo "true" || echo "false")
    TP_ENABLE_INGRESS_CONTROLLER: $([[ "$TP_INGRESS_CLASS" == "nginx" || "$TP_INGRESS_CLASS" == "traefik" || "$TP_INGRESS_CLASS" == "haproxy" || "$TP_INGRESS_CLASS" == "nginx-gateway-fabric" ]] && echo "true" || echo "false")
    TP_ENABLE_ISTIO_GATEWAY: $([[ "$TP_INGRESS_CLASS" == "istio-gateway" ]] && echo "true" || echo "false")
    TP_ENABLE_TRAEFIK_GATEWAY: $([[ "$TP_INGRESS_CLASS" == "traefik-gateway" ]] && echo "true" || echo "false")
    # computed: ingress vs gateway API routing
    TP_ENABLE_INGRESS: $([[ "$TP_INGRESS_CLASS" == "nginx" || "$TP_INGRESS_CLASS" == "traefik" || "$TP_INGRESS_CLASS" == "haproxy" ]] && echo "true" || echo "false")
    TP_ENABLE_HTTP_ROUTE: $([[ "$TP_INGRESS_CLASS" == "nginx-gateway-fabric" || "$TP_INGRESS_CLASS" == "istio-gateway" || "$TP_INGRESS_CLASS" == "traefik-gateway" ]] && echo "true" || echo "false")
    TP_ENABLE_SECONDARY_KONG: $([[ "$TP_SECONDARY_INGRESS_CLASS" == "kong" ]] && echo "true" || echo "false")
    TP_DEPLOY_SECONDARY_INGRESS: $([[ "$TP_ENABLE_SECONDARY_KONG" == "true" ]] && echo "true" || echo "false")
    TP_HTTP_INGRESS_BACKEND_SERVICE: ${TP_INGRESS_RELEASE_NAME}-$( ( [[  "$TP_INGRESS_CLASS" == "nginx" ]] && echo "ingress-nginx-controller" ) || ( [[ "$TP_INGRESS_CLASS" == "kong" ]] && echo "kong-proxy" ) )
    TP_INSTALL_CERT_MANAGER: ${GUI_TP_INSTALL_CERT_MANAGER:-true}
    TP_INSTALL_EXTERNAL_DNS: ${GUI_TP_INSTALL_EXTERNAL_DNS:-true}
    TP_INSTALL_METRICS_SERVER: ${GUI_TP_INSTALL_METRICS_SERVER:-true} # instLL metrics-server using helm chart, set to true
    TP_ADDON_METRICS_SERVER_ENABLE: $([[ "$TP_INSTALL_METRICS_SERVER" == "true" ]] && echo "false" || echo "true") # to install metrics-server using add-on, set to true
    TP_INSTALL_O11Y: ${GUI_TP_INSTALL_O11Y:-false}
    TP_SKIP_GENERATE_CLUSTER_ISSUER: false
  tools:
    yq: "4.40"
preTasks:
- condition: ${TP_INSTALL_K8S}
  repo:
    git:
      github:
        repo: ${PLATFORM_PROVISIONER_REPO}
        path: docs/recipes/k8s/cloud/scripts/eks
        branch: ${TP_SCRIPT_BRANCH}
  script:
    ignoreErrors: false
    fileName: ${TP_SCRIPT_NAME_SH_EKS}
- condition: ${TP_INSTALL_EFS}
  clusters:
    - name: ${TP_CLUSTER_NAME}
  repo:
    git:
      github:
        repo: ${PLATFORM_PROVISIONER_REPO}
        path: docs/recipes/k8s/cloud/scripts/eks
        branch: ${TP_SCRIPT_BRANCH}
  script:
    ignoreErrors: false
    fileName: ${TP_SCRIPT_NAME_SH_EFS}
helmCharts:
- name: cert-manager
  condition: ${TP_INSTALL_CERT_MANAGER}
  version: v1.17.1 # release: https://github.com/cert-manager/cert-manager/releases
  repo:
    helm:
      url: https://charts.jetstack.io
  values:
    keepPrevious: true
    content: |
      installCRDs: true
      serviceAccount:
        create: false
        name: cert-manager
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: cert-manager
  namespace: cert-manager
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=0"
  hooks:
    postDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: ${TP_SKIP_GENERATE_CLUSTER_ISSUER}
      content: |
        kubectl apply -f - <<EOF
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
        spec:
          acme:
            email: cloud@tibco.com
            server: https://acme-v02.api.letsencrypt.org/directory
            privateKeySecretRef:
              name: "${TP_CERTIFICATE_CLUSTER_ISSUER}"
            solvers:
              - dns01:
                  route53:
                    region: ${TP_CLUSTER_REGION}
        EOF
- name: external-dns
  condition: ${TP_INSTALL_EXTERNAL_DNS}
  version: 1.15.2 # release: https://github.com/kubernetes-sigs/external-dns/releases
  repo:
    helm:
      url: https://kubernetes-sigs.github.io/external-dns/
  values:
    keepPrevious: true
    content: |
      serviceAccount:
        create: false
        name: external-dns 
      extraArgs:
        # only register DNS for these ingress classes
        - --ingress-class=${TP_INGRESS_CLASS}
        - --gateway-namespace=${TP_INGRESS_NAMESPACE}
      gatewayNamespace: ${TP_INGRESS_NAMESPACE}
      sources:
      - ingress
      - service
      - gateway-httproute
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: external-dns
  namespace: external-dns-system
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=0"
- name: aws-load-balancer-controller
  version: 1.8.3 # release: https://github.com/aws/eks-charts/releases 1.9.1 has issue: https://github.com/eksctl-io/eksctl/issues/7987
  repo:
    helm:
      url: https://aws.github.io/eks-charts
  values:
    keepPrevious: true
    content: |
      clusterName: ${TP_CLUSTER_NAME}
      serviceAccount:
        create: false
        name: aws-load-balancer-controller
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: aws-load-balancer-controller
  namespace: kube-system
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=0"
- name: metrics-server
  condition: ${TP_INSTALL_METRICS_SERVER}
  version: "3.12.2" # release: https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/Chart.yaml
  repo:
    helm:
      url: https://kubernetes-sigs.github.io/metrics-server/
  values:
    keepPrevious: true
    content: |
      clusterName: ${TP_CLUSTER_NAME}
      serviceAccount:
        create: true
        name: metrics-server
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: metrics-server
  namespace: kube-system
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=0"
- name: dp-config-aws
  condition: ${TP_ENABLE_INGRESS_CONTROLLER}
  version: "${TP_CHART_VERSION_DP_CONFIG_AWS}"
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: false
    content: |
      dns:
        domain: "${TP_DOMAIN}"
      httpIngress:
        enabled: false # set to true to use ALB
        name: ${TP_INGRESS_CLASS}
        backend:
          serviceName: ${TP_HTTP_INGRESS_BACKEND_SERVICE}
        annotations:
          alb.ingress.kubernetes.io/group.name: "${TP_DOMAIN}"
          external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
          # this will be used for external-dns annotation filter
          kubernetes.io/ingress.class: alb
      ingress-nginx:
        enabled: ${TP_ENABLE_NGINX}
        controller:
          service:
            type: LoadBalancer # use NLB for nginx, set to ClusterIP when using ALB
            loadBalancerClass: service.k8s.aws/nlb # 
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip # by default it is instance which will route traffic to instance nodePort
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing # used for aws-load-balancer-controller to create public NLB
              external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
            enableHttp: false # disable http 80 port on service and NLB
          config:
            use-forwarded-headers: 'true'          # PDP-945
          extraArgs:
            default-ssl-certificate: ${TP_INGRESS_NAMESPACE}/tp-certificate-main-ingress
      traefik:
        enabled: ${TP_ENABLE_TRAEFIK}
        service:
          type: LoadBalancer # use NLB for traefik, set to ClusterIP when using ALB
          loadBalancerClass: service.k8s.aws/nlb # 
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip # by default it is instance which will route traffic to instance nodePort
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing # used for aws-load-balancer-controller to create public NLB
            external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
        ingressRoute: # for dashboard
          dashboard:
            enabled: true
            matchRule: Host(`traefik-alb-apps.${TP_DOMAIN}`) && PathPrefix(`/dashboard`) || Host(`traefik-alb-apps.${TP_DOMAIN}`) && PathPrefix(`/api`)
            entryPoints:
              - traefik
              - web
              - websecure
        providers:  # for external service
          kubernetesIngress:
            allowExternalNameServices: true
        additionalArguments:
          - '--entryPoints.websecure.forwardedHeaders.insecure'
          - '--serversTransport.insecureSkipVerify=true'
          - '--providers.kubernetesingress.ingressendpoint.publishedservice=${TP_INGRESS_NAMESPACE}/${TP_INGRESS_RELEASE_NAME}-traefik'
        tlsStore:
          default:
            defaultCertificate:
              secretName: tp-certificate-main-ingress
      haproxy:
        enabled: ${TP_ENABLE_HAPROXY}
        controller:
          service:
            type: LoadBalancer # use NLB for haproxy, set to ClusterIP when using ALB
            loadBalancerClass: service.k8s.aws/nlb
            externalTrafficPolicy: Local
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
              external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
          config:
            # This replaces the 'haproxy.org/frontend-config-snippet' annotation
            # It injects these lines into the main HAProxy frontend section
            frontend-config-snippet: |
              # 1. Standard Forwarded Headers
              http-request set-header X-Forwarded-Proto https if { ssl_fc }
              http-request set-header X-Forwarded-Port 443 if { ssl_fc }
              
              # 2. THE FIX: Strip Port 80 from Host headers
              # This takes the Host, finds the ":" and keeps only the first part (the domain)
              http-request set-header Host %[hdr(host),field(1,:)]
              http-request set-header X-Forwarded-Host %[hdr(host),field(1,:)]
          ingressClass: haproxy
          replicaCount: 1
          defaultTLSSecret:
            enabled: true
            secretNamespace: ${TP_INGRESS_NAMESPACE}
            secret: tp-certificate-main-ingress    
      kong:
        enabled: false
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: ${TP_INGRESS_RELEASE_NAME}
  namespace: ${TP_INGRESS_NAMESPACE}
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=1"
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: ${TP_SKIP_GENERATE_CLUSTER_ISSUER}
      content: |
        # create a namespace for the main ingress
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${TP_INGRESS_NAMESPACE}
          labels:
            networking.platform.tibco.com/non-cp-ns: enable
        EOF
        
        # create a certificate for the main ingress
        kubectl apply -f - << EOF
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: tp-certificate-main-ingress
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          secretName: tp-certificate-main-ingress
          issuerRef:
            name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
            kind: ClusterIssuer
          dnsNames:
            - '*.${TP_DOMAIN}'
        EOF
# nginx-gateway-fabric installation with Gateway API resources
- condition: ${TP_ENABLE_NGINX_GATEWAY_FABRIC}
  name: dp-config-aws
  namespace: ${TP_INGRESS_NAMESPACE}
  version: "${TP_CHART_VERSION_DP_CONFIG_AWS}"
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: true
    content: |
      clusterIssuer:
        create: false
      httpIngress:
        enabled: false
      nginx-gateway-fabric:
        enabled: true
        nginxGateway:
          gatewayClassName: nginx
          gatewayControllerName: gateway.nginx.org/nginx-gateway-controller
          config:
            logging:
              level: info
        nginx:
          service:
            type: LoadBalancer # use NLB for nginx-gateway-fabric, set to ClusterIP when using ALB
            loadBalancerClass: service.k8s.aws/nlb
            externalTrafficPolicy: Local
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: dp-config-aws-nginx-gateway
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=1"
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # create a namespace for the main ingress
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${TP_INGRESS_NAMESPACE}
          labels:
            networking.platform.tibco.com/non-cp-ns: enable
        EOF

        # Install Gateway API CRDs for nginx-gateway-fabric
        kubectl kustomize "https://github.com/nginx/nginx-gateway-fabric/config/crd/gateway-api/standard?ref=v2.3.0" | kubectl apply -f -
        
        # create a certificate for the main ingress
        kubectl apply -f - << EOF
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: tp-certificate-main-ingress
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          secretName: tp-certificate-main-ingress
          issuerRef:
            name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
            kind: ClusterIssuer
          dnsNames:
            - '*.${TP_DOMAIN}'
        EOF
    postDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # Create Gateway object for nginx-gateway-fabric
        kubectl apply -f - <<EOF
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: nginx-gateway
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          gatewayClassName: nginx
          infrastructure:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
              service.beta.kubernetes.io/aws-load-balancer-type: "external"
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
              external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
          listeners:
          - allowedRoutes:
              namespaces:
                from: All
            name: https
            port: 443
            protocol: HTTPS
            tls:
              certificateRefs:
              - group: ""
                kind: Secret
                name: tp-certificate-main-ingress
              mode: Terminate
        EOF
        
        # Create clientSettingsPolicy for nginx-gateway-fabric to increase file upload size
        kubectl apply -f - <<EOF
        apiVersion: gateway.nginx.org/v1alpha1
        kind: ClientSettingsPolicy
        metadata:
          name: gateway-client-settings
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          targetRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: nginx-gateway
          body:
            maxSize: "200m"
        EOF
  # Istio installation: istio-base and istiod MUST be in istio-system namespace due to hardcoded references in CRDs, webhooks, and RBAC
  # Gateway resource (data plane) is deployed to ingress-system via postDeploy hook
# istio gateway
- condition: ${TP_ENABLE_ISTIO_GATEWAY}
  name: dp-config-aws
  namespace: istio-system
  version: "${TP_CHART_VERSION_DP_CONFIG_AWS}"
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: true
    content: |
      clusterIssuer:
        create: false
      httpIngress:
        enabled: false
      istio-base:
        enabled: true
      istiod:
        enabled: true
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: istio
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=1"
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # Create ingress namespace
        kubectl create ns ${TP_INGRESS_NAMESPACE}
        # Add label for tibtunnel to connect to the ingress controller
        kubectl label namespace ${TP_INGRESS_NAMESPACE} networking.platform.tibco.com/non-dp-ns=enable --overwrite
        kubectl label namespace ${TP_INGRESS_NAMESPACE} networking.platform.tibco.com/non-cp-ns=enable --overwrite
        # Install Gateway API CRDs for HTTPRoute support (only if not already present)
        kubectl get crd gateways.gateway.networking.k8s.io &> /dev/null || \
          { kubectl kustomize "github.com/kubernetes-sigs/gateway-api/config/crd?ref=v1.4.0" | kubectl apply -f -; }
        # create a certificate for the main ingress
        kubectl apply -f - << EOF
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: tp-certificate-main-ingress
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          secretName: tp-certificate-main-ingress
          issuerRef:
            name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
            kind: ClusterIssuer
          dnsNames:
            - '*.${TP_DOMAIN}'
        EOF
    postDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # Create Gateway using Kubernetes Gateway API for HTTPRoute compatibility
        # Note: Gateway resource auto-provisions deployment and service (no gateway helm chart needed)
        # GatewayClass 'istio' is automatically created by istiod
        kubectl apply -f - <<EOF
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: istio-gateway
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          gatewayClassName: istio
          infrastructure:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
              service.beta.kubernetes.io/aws-load-balancer-type: "external"
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
              external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
          listeners:
          - name: https
            hostname: "*.${TP_DOMAIN}"
            port: 443
            protocol: HTTPS
            tls:
              mode: Terminate
              certificateRefs:
              - kind: Secret
                name: tp-certificate-main-ingress
            allowedRoutes:
              namespaces:
                from: All
        EOF
        # Create EnvoyFilter to fix host headers and set X-Forwarded headers for proper HTTPS handling
        kubectl apply -f - <<EOF
        apiVersion: networking.istio.io/v1alpha3
        kind: EnvoyFilter
        metadata:
          name: fix-host-headers
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          workloadSelector:
            labels:
              gateway.networking.k8s.io/gateway-name: istio-gateway
          configPatches:
          - applyTo: HTTP_FILTER
            match:
              context: GATEWAY
              listener:
                filterChain:
                  filter:
                    name: "envoy.filters.network.http_connection_manager"
            patch:
              operation: INSERT_BEFORE
              value:
                name: envoy.lua
                typed_config:
                  "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
                  inlineCode: |
                    function envoy_on_request(request_handle)
                      local headers = request_handle:headers()
                      headers:replace("X-Forwarded-Proto", "https")
                      headers:replace("X-Forwarded-Port", "443")
                      local authority = headers:get(":authority")
                      if not authority then authority = headers:get("Host") end
                      if authority then
                        local s, e = string.find(authority, ":")
                        if s then
                          local clean_host = string.sub(authority, 1, s-1)
                          headers:replace(":authority", clean_host)
                          headers:replace("Host", clean_host)
                          headers:replace("X-Forwarded-Host", clean_host)
                        end
                      end
                    end
        EOF
        # Wait for Gateway to be programmed
        kubectl wait --timeout=5m -n ${TP_INGRESS_NAMESPACE} gateway/istio-gateway --for=condition=Programmed
# traefik gateway
- name: dp-config-aws
  condition: ${TP_ENABLE_TRAEFIK_GATEWAY}
  version: "${TP_CHART_VERSION_DP_CONFIG_AWS}"
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: false
    content: |
      dns:
        domain: "${TP_DOMAIN}"
      traefik:
        enabled: true
        additionalArguments:
          - '--entryPoints.websecure.forwardedHeaders.insecure'
          - '--serversTransport.insecureSkipVerify=true'
          - '--providers.kubernetesingress.ingressendpoint.publishedservice=${TP_INGRESS_NAMESPACE}/${TP_INGRESS_RELEASE_NAME}-traefik'
        ingressRoute:
          dashboard:
            enabled: false
        ingressClass:
          enabled: false
        providers:
          kubernetesIngress:
            enabled: false
          kubernetesGateway:
            enabled: true
        gateway:
          enabled: false
        ports:
          traefik:
            port: 9000
            expose:
              default: false
          web:
            port: 8080
            expose:
              default: true
            exposedPort: 80
          websecure:
            port: 8443
            expose:
              default: true
            exposedPort: 443
        tlsStore:
          default:
            defaultCertificate:
              secretName: tp-certificate-main-ingress
        service:
          type: LoadBalancer # use NLB for traefik, set to ClusterIP when using ALB
          loadBalancerClass: service.k8s.aws/nlb # used for aws-load-balancer-controller to create NLB
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: "external"
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
            service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
            external-dns.alpha.kubernetes.io/hostname: "*.${TP_DOMAIN}"
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: ${TP_INGRESS_RELEASE_NAME}
  namespace: ${TP_INGRESS_NAMESPACE}
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
    labels: "layer=1"
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: ${TP_SKIP_GENERATE_CLUSTER_ISSUER}
      content: |
        # create a namespace for the main ingress
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${TP_INGRESS_NAMESPACE}
          labels:
            networking.platform.tibco.com/non-cp-ns: enable
        EOF
        
        # create a certificate for the main ingress
        kubectl apply -f - << EOF
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: tp-certificate-main-ingress
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          secretName: tp-certificate-main-ingress
          issuerRef:
            name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
            kind: ClusterIssuer
          dnsNames:
            - '*.${TP_DOMAIN}'
        EOF
    postDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # Create Gateway object for nginx-gateway-fabric
        kubectl apply -f - <<EOF
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: traefik-gateway
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          gatewayClassName: traefik
          listeners:
          - name: http
            port: 8080
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: All
        EOF
- name: dp-config-aws
  version: "${TP_CHART_VERSION_DP_CONFIG_AWS}"
  condition: ${TP_DEPLOY_SECONDARY_INGRESS}
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: false
    content: |
      dns:
        domain: "${TP_SECONDARY_DOMAIN}"
      httpIngress:
        enabled: false # set to true to use ALB
      ingress-nginx:
        enabled: false
      kong:
        enabled: ${TP_ENABLE_SECONDARY_KONG}
        secretVolumes:
        - tp-certificate-secondary-ingress
        env:
          ssl_cert: /etc/secrets/tp-certificate-secondary-ingress/tls.crt
          ssl_cert_key: /etc/secrets/tp-certificate-secondary-ingress/tls.key
        proxy:
          type: LoadBalancer
          loadBalancerClass: service.k8s.aws/nlb # 
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip # by default it is instance which will route traffic to instance nodePort
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing # used for aws-load-balancer-controller to create public NLB
            external-dns.alpha.kubernetes.io/hostname: "*.${TP_SECONDARY_DOMAIN}"
          tls:
            enabled: true
          http:
            enabled: false
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: ${TP_SECONDARY_INGRESS_RELEASE_NAME}
  namespace: ${TP_INGRESS_NAMESPACE}
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: ${TP_SKIP_GENERATE_CLUSTER_ISSUER}
      content: |
        # create a namespace for the main ingress
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${TP_INGRESS_NAMESPACE}
          labels:
            networking.platform.tibco.com/non-cp-ns: enable
        EOF
        
        # create a certificate for the kong apps ingress
        kubectl apply -f - << EOF
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: tp-certificate-secondary-ingress
          namespace: ${TP_INGRESS_NAMESPACE}
        spec:
          secretName: tp-certificate-secondary-ingress
          issuerRef:
            name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
            kind: ClusterIssuer
          dnsNames:
            - '*.${TP_SECONDARY_DOMAIN}'
        EOF
