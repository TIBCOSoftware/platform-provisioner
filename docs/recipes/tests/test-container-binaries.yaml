# This recipe is used to test the container binaries
# It dynamically discovers and displays all available versions
#
# Example output:
#
# === Cloud Provider CLIs ===
# Binary                              Version
# ------                              -------
# aws                                 aws-cli/2.32.31 Python/3.12.11
# az                                  2.81.0
# gcloud                              Google Cloud SDK 551.0.0
# eksctl                              0.221.0
# docker-credential-ecr-login         0.11.0
#
# === Utility Tools ===
# Binary                              Version
# ------                              -------
# cue                                 cue version v0.15.3
# yq                                  yq (https://github.com/mikefarah/yq/) version v4.50.1
# vcluster                            vcluster version 0.30.4
# oc                                  Client Version: 4.18.20
#
# === Helm Versions ===
# Binary                              Version
# ------                              -------
# helm (default -> helm-3.19)         v3.19.4
# helm-3.19                           v3.19.4
# helm-4.0                            v4.0.4
#
# === Kubectl Versions ===
# Binary                              Version
# ------                              -------
# kubectl (default -> kubectl-1.33)   v1.33.7
# kubectl-1.33                        v1.33.7
# kubectl-1.34                        v1.34.3
apiVersion: v1
kind: generic-runner
meta:
  globalEnvVariable:
    REPLACE_RECIPE: true
    PIPELINE_LOG_DEBUG: false
    PIPELINE_INITIAL_ASSUME_ROLE: true
    PIPELINE_CHECK_DOCKER_STATUS: false
    RUN1: true
  tools:
    yq: "4.40"
    #kubectl: "1.33" # comment out to show the default version
    #helm: "3.19" # comment out to show the default version
tasks:
  - condition: ${RUN1}
    script:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      fileName: script.sh
      content: |
        # Define a function to get the version of a command
        get_version() {
          local cmd="$1"
          case "$cmd" in
            aws) aws --version 2>&1 | awk '{print $1 " " $2}' ;;
            az) az version 2>&1 | sed -n 's/.*"azure-cli": "\(.*\)",/\1/p' ;;
            gcloud) gcloud --version 2>&1 | head -n 1 ;;
            eksctl) eksctl version 2>&1 ;;
            docker-credential-ecr-login) docker-credential-ecr-login -v 2>&1 ;;
            cue) cue version 2>&1 | head -n 1 ;;
            yq) yq --version 2>&1 ;;
            vcluster) vcluster version 2>&1 ;;
            oc) oc version --client=true 2>&1 | head -n 1 ;;
            helm|helm-*) $cmd version --short 2>&1 ;;
            kubectl|kubectl-*) $cmd version --client 2>&1 | head -n 1 ;;
            *) echo "Unknown command" ;;
          esac
        }
        
        echo "=== Cloud Provider CLIs ==="
        printf "%-35s %-50s\n" "Binary" "Version"
        printf "%-35s %-50s\n" "------" "-------"
        for binary in aws az gcloud eksctl docker-credential-ecr-login; do
          version=$(get_version "$binary")
          printf "%-35s %-50s\n" "$binary" "$version"
        done
        
        echo ""
        echo "=== Utility Tools ==="
        printf "%-35s %-50s\n" "Binary" "Version"
        printf "%-35s %-50s\n" "------" "-------"
        for binary in cue yq vcluster oc; do
          version=$(get_version "$binary")
          printf "%-35s %-50s\n" "$binary" "$version"
        done
        
        echo ""
        echo "=== Helm Versions ==="
        printf "%-35s %-50s\n" "Binary" "Version"
        printf "%-35s %-50s\n" "------" "-------"
        # Show default helm first
        if command -v helm &> /dev/null; then
          default_target=$(readlink -f $(which helm) 2>/dev/null | xargs basename 2>/dev/null || echo "helm")
          version=$(get_version "helm")
          printf "%-35s %-50s\n" "helm (default -> $default_target)" "$version"
        fi
        # Dynamically find all helm-* binaries
        for binary in $(ls /usr/local/bin/helm-* 2>/dev/null | xargs -n1 basename | sort -V); do
          version=$(get_version "$binary")
          printf "%-35s %-50s\n" "$binary" "$version"
        done
        
        echo ""
        echo "=== Kubectl Versions ==="
        printf "%-35s %-50s\n" "Binary" "Version"
        printf "%-35s %-50s\n" "------" "-------"
        # Show default kubectl first
        if command -v kubectl &> /dev/null; then
          default_target=$(readlink -f $(which kubectl) 2>/dev/null | xargs basename 2>/dev/null || echo "kubectl")
          version=$(get_version "kubectl")
          printf "%-35s %-50s\n" "kubectl (default -> $default_target)" "$version"
        fi
        # Dynamically find all kubectl-* binaries
        for binary in $(ls /usr/local/bin/kubectl-* 2>/dev/null | xargs -n1 basename | sort -V); do
          version=$(get_version "$binary")
          printf "%-35s %-50s\n" "$binary" "$version"
        done