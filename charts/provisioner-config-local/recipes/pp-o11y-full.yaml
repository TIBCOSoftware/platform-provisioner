apiVersion: v1
kind: helm-install
meta:
  guiEnv:
    note: "deploy-o11y-stack"

    # github
    GUI_TP_CHART_REPO: "https://tibcosoftware.github.io/tp-helm-charts"
    GUI_TP_CHART_REPO_USER_NAME: ""
    GUI_TP_CHART_REPO_TOKEN: ""

    # ingress
    GUI_TP_O11Y_INGRESS_GATEWAY_SELECTION: "ingress"
    GUI_TP_INGRESS_CLASS: "traefik"
    GUI_TP_GATEWAY_NAME: "nginx-gateway"
    GUI_TP_INGRESS_GATEWAY_NAMESPACE: "ingress-system"
    GUI_TP_DOMAIN: "localhost.dataplanes.pro"

    # storage
    GUI_TP_STORAGE_CLASS: "hostpath"

    # elasticsearch
    GUI_TP_CONFIG_ES_NAMESPACE: "elastic-system"
    GUI_TP_ES_RELEASE_NAME: "dp-config-es"
    GUI_TP_ECK_VERSION: "2.16.1"
    GUI_TP_CONFIG_ES_VERSION: "8.17.3"
    GUI_TP_CONFIG_CHART_VERSION: "^1.0.0"
    GUI_TP_CONFIG_ES_KIBANA_COUNT: 0
    GUI_TP_DEPLOY_ES: "true"
    GUI_TP_DEPLOY_ES_INGRESS: "true"
    GUI_TP_DEPLOY_KIBANA: "true"
    GUI_TP_DEPLOY_KIBANA_INGRESS: "true"
    GUI_TP_DEPLOY_APM: "true"
    GUI_TP_DEPLOY_APM_INGRESS: "true"
    GUI_TP_ES_MEMORY_REQUEST: "3Gi"
    GUI_TP_ES_CPU_REQUEST: "250m"
    GUI_TP_ES_MEMORY_LIMIT: "4Gi"
    GUI_TP_ES_CPU_LIMIT: "1"
    GUI_TP_KIBANA_MEMORY_REQUEST: "1Gi"
    GUI_TP_KIBANA_CPU_REQUEST: "150m"
    GUI_TP_KIBANA_MEMORY_LIMIT: "2Gi"
    GUI_TP_KIBANA_CPU_LIMIT: "1"
    GUI_TP_APM_MEMORY_REQUEST: "128Mi"
    GUI_TP_APM_CPU_REQUEST: "50m"
    GUI_TP_APM_MEMORY_LIMIT: "512Mi"
    GUI_TP_APM_CPU_LIMIT: "250m"

    # prometheus
    GUI_TP_PROMETHEUS_NAMESPACE: "prometheus-system"
    GUI_TP_KUBE_PROMETHEUS_STACK_VERSION: "80.13.3"
    GUI_TP_KUBE_PROMETHEUS_STACK_ENABLE_GRAFANA: false

    # grafana
    GUI_TP_GRAFANA_ADMIN_PASSWORD: ""

    # opensearch
    GUI_TP_OPENSEARCH_NAMESPACE: "opensearch-system"
    GUI_TP_CONFIG_OPENSEARCH_CHART_VERSION: "^1.16.0"
    GUI_TP_DEPLOY_OPENSEARCH_INGRESS: "true"
    GUI_TP_OPENSEARCH_MEMORY_REQUEST: "2Gi"
    GUI_TP_OPENSEARCH_CPU_REQUEST: "500m"
    GUI_TP_OPENSEARCH_MEMORY_LIMIT: "4Gi"
    GUI_TP_OPENSEARCH_CPU_LIMIT: "1"
    GUI_TP_OPENSEARCH_DASHBOARDS_MEMORY_REQUEST: "512Mi"
    GUI_TP_OPENSEARCH_DASHBOARDS_CPU_REQUEST: "200m"
    GUI_TP_OPENSEARCH_DASHBOARDS_MEMORY_LIMIT: "1Gi"
    GUI_TP_OPENSEARCH_DASHBOARDS_CPU_LIMIT: "500m"
    GUI_TP_OPENSEARCH_REPLICAS: 1
    GUI_TP_OPENSEARCH_SINGLE_NODE: true
    GUI_TP_OPENSEARCH_STORAGE_SIZE: "30Gi"
    GUI_TP_OPENSEARCH_ADMIN_PASSWORD: ""

    # flow control
    GUI_TP_DEPLOY_ECK: true
    GUI_TP_DEPLOY_PROMETHEUS_STACK: true
    GUI_TP_DEPLOY_OPEN_TELEMETRY_COLLECTOR: true
    GUI_TP_DEPLOY_OPENSEARCH: false
    GUI_PIPELINE_LOG_DEBUG: false
  globalEnvVariable:
    REPLACE_RECIPE: true
    PIPELINE_LOG_DEBUG: ${GUI_PIPELINE_LOG_DEBUG:-false}
    PIPELINE_CHECK_DOCKER_STATUS: false

    # github
    TP_CHART_REPO: ${GUI_TP_CHART_REPO:-https://tibcosoftware.github.io/tp-helm-charts}
    TP_CHART_REPO_USER_NAME: "${GUI_TP_CHART_REPO_USER_NAME}"
    TP_CHART_REPO_TOKEN: "${GUI_TP_CHART_REPO_TOKEN}"

    # ingress
    TP_O11Y_INGRESS_GATEWAY_SELECTION: ${GUI_TP_O11Y_INGRESS_GATEWAY_SELECTION:-ingress}
    TP_DOMAIN: ${GUI_TP_DOMAIN}
    TP_INGRESS_CLASS: ${GUI_TP_INGRESS_CLASS} # nginx, traefik
    TP_GATEWAY_NAME: ${GUI_TP_GATEWAY_NAME:-nginx-gateway} # Gateway resource name (for HTTPRoute parentRefs)
    TP_INGRESS_GATEWAY_NAMESPACE: ${GUI_TP_INGRESS_GATEWAY_NAMESPACE:-ingress-system}

    # storage
    TP_STORAGE_CLASS: ${GUI_TP_STORAGE_CLASS} # hostpath for docker desktop, standard for minikube

    # elasticsearch
    TP_ES_RELEASE_NAME: ${GUI_TP_ES_RELEASE_NAME:-dp-config-es}
    TP_CONFIG_CHART_VERSION: "${GUI_TP_CONFIG_CHART_VERSION}"
    TP_CONFIG_ES_VERSION: "${GUI_TP_CONFIG_ES_VERSION}" # https://www.elastic.co/guide/en/elasticsearch/reference/current/es-release-notes.html
    TP_CONFIG_ES_NAMESPACE: "${GUI_TP_CONFIG_ES_NAMESPACE}"
    TP_CONFIG_ES_KIBANA_COUNT: ${GUI_TP_CONFIG_ES_KIBANA_COUNT:-0}
    TP_DEPLOY_ES: ${GUI_TP_DEPLOY_ES}
    TP_DEPLOY_ES_INGRESS: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "ingress" ]]; then echo true; else echo false; fi)
    TP_DEPLOY_ES_HTTP_ROUTE: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "gateway" ]]; then echo true; else echo false; fi)
    TP_DEPLOY_KIBANA: ${GUI_TP_DEPLOY_KIBANA}
    TP_DEPLOY_KIBANA_INGRESS: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "ingress" ]]; then echo true; else echo false; fi)
    TP_DEPLOY_KIBANA_HTTP_ROUTE: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "gateway" ]]; then echo true; else echo false; fi)
    TP_DEPLOY_APM: ${GUI_TP_DEPLOY_APM}
    TP_DEPLOY_APM_INGRESS: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "ingress" ]]; then echo true; else echo false; fi)
    TP_DEPLOY_APM_HTTP_ROUTE: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "gateway" ]]; then echo true; else echo false; fi)
    TP_ECK_VERSION: "${GUI_TP_ECK_VERSION}" # helm search repo elastic/eck-operator https://www.elastic.co/guide/en/cloud-on-k8s/master/eck-release-notes.html
    TP_KIBANA_CPU_LIMIT: "${GUI_TP_KIBANA_CPU_LIMIT}"
    TP_KIBANA_MEMORY_LIMIT: "${GUI_TP_KIBANA_MEMORY_LIMIT}"
    TP_APM_CPU_LIMIT: "${GUI_TP_APM_CPU_LIMIT}"
    TP_APM_MEMORY_LIMIT: "${GUI_TP_APM_MEMORY_LIMIT}"
    TP_ES_CPU_LIMIT: "${GUI_TP_ES_CPU_LIMIT}"
    TP_ES_MEMORY_LIMIT: "${GUI_TP_ES_MEMORY_LIMIT}"
    TP_ES_CPU_REQUEST: "${GUI_TP_ES_CPU_REQUEST}"
    TP_ES_MEMORY_REQUEST: "${GUI_TP_ES_MEMORY_REQUEST}"
    TP_KIBANA_CPU_REQUEST: "${GUI_TP_KIBANA_CPU_REQUEST}"
    TP_KIBANA_MEMORY_REQUEST: "${GUI_TP_KIBANA_MEMORY_REQUEST}"
    TP_APM_CPU_REQUEST: "${GUI_TP_APM_CPU_REQUEST}"
    TP_APM_MEMORY_REQUEST: "${GUI_TP_APM_MEMORY_REQUEST}"

    # prometheus
    TP_PROMETHEUS_NAMESPACE: "${GUI_TP_PROMETHEUS_NAMESPACE:-prometheus-system}"
    TP_KUBE_PROMETHEUS_STACK_VERSION: "${GUI_TP_KUBE_PROMETHEUS_STACK_VERSION}" # https://github.com/prometheus-community/helm-charts/releases?q=kube-prometheus-stack&expanded=true
    TP_KUBE_PROMETHEUS_STACK_ENABLE_GRAFANA: ${GUI_TP_KUBE_PROMETHEUS_STACK_ENABLE_GRAFANA:-false}
    TP_DEPLOY_GRAFANA_INGRESS: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "ingress" ]]; then echo true; else echo false; fi)
    TP_DEPLOY_GRAFANA_HTTP_ROUTE: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "gateway" ]]; then echo true; else echo false; fi)

    # grafana
    TP_GRAFANA_ADMIN_PASSWORD: "${GUI_TP_GRAFANA_ADMIN_PASSWORD:-$(openssl rand -base64 16)}" # set grafana admin password

    # opensearch
    TP_OPENSEARCH_NAMESPACE: "${GUI_TP_OPENSEARCH_NAMESPACE}"
    TP_CONFIG_OPENSEARCH_CHART_VERSION: "${GUI_TP_CONFIG_OPENSEARCH_CHART_VERSION}"
    TP_DEPLOY_OPENSEARCH_INGRESS: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "ingress" ]]; then echo true; else echo false; fi)
    TP_DEPLOY_OPENSEARCH_HTTP_ROUTE: $(if [[ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" == "gateway" ]]; then echo true; else echo false; fi)
    TP_OPENSEARCH_MEMORY_REQUEST: "${GUI_TP_OPENSEARCH_MEMORY_REQUEST}"
    TP_OPENSEARCH_CPU_REQUEST: "${GUI_TP_OPENSEARCH_CPU_REQUEST}"
    TP_OPENSEARCH_MEMORY_LIMIT: "${GUI_TP_OPENSEARCH_MEMORY_LIMIT}"
    TP_OPENSEARCH_CPU_LIMIT: "${GUI_TP_OPENSEARCH_CPU_LIMIT}"
    TP_OPENSEARCH_DASHBOARDS_MEMORY_REQUEST: "${GUI_TP_OPENSEARCH_DASHBOARDS_MEMORY_REQUEST}"
    TP_OPENSEARCH_DASHBOARDS_CPU_REQUEST: "${GUI_TP_OPENSEARCH_DASHBOARDS_CPU_REQUEST}"
    TP_OPENSEARCH_DASHBOARDS_MEMORY_LIMIT: "${GUI_TP_OPENSEARCH_DASHBOARDS_MEMORY_LIMIT}"
    TP_OPENSEARCH_DASHBOARDS_CPU_LIMIT: "${GUI_TP_OPENSEARCH_DASHBOARDS_CPU_LIMIT}"
    TP_OPENSEARCH_REPLICAS: ${GUI_TP_OPENSEARCH_REPLICAS:-1}
    TP_OPENSEARCH_SINGLE_NODE: ${GUI_TP_OPENSEARCH_SINGLE_NODE:-true}
    TP_OPENSEARCH_STORAGE_SIZE: "${GUI_TP_OPENSEARCH_STORAGE_SIZE}"
    TP_OPENSEARCH_ADMIN_PASSWORD: "${GUI_TP_OPENSEARCH_ADMIN_PASSWORD}"

    # flow control
    TP_DEPLOY_ECK: ${GUI_TP_DEPLOY_ECK:-true}
    TP_DEPLOY_PROMETHEUS_STACK: ${GUI_TP_DEPLOY_PROMETHEUS_STACK:-true}
    TP_DEPLOY_OPEN_TELEMETRY_COLLECTOR: ${GUI_TP_DEPLOY_OPEN_TELEMETRY_COLLECTOR:-true}
    TP_DEPLOY_OPENSEARCH: ${GUI_TP_DEPLOY_OPENSEARCH:-false}
  tools:
    yq: "4.40"
helmCharts:
- name: eck-operator
  version: ${TP_ECK_VERSION}
  condition: ${TP_DEPLOY_ECK}
  namespace: ${TP_CONFIG_ES_NAMESPACE}
  releaseName: eck-operator
  repo:
    helm:
      url: https://helm.elastic.co
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
- name: dp-config-es
  version: ${TP_CONFIG_CHART_VERSION}
  condition: ${TP_DEPLOY_ECK}
  namespace: ${TP_CONFIG_ES_NAMESPACE}
  releaseName: ${TP_ES_RELEASE_NAME}
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: true
    content: |
      domain: ${TP_DOMAIN}
      es:
        enabled: "${TP_DEPLOY_ES}"
        version: "${TP_CONFIG_ES_VERSION}"
        ingress:
          enabled: ${TP_DEPLOY_ES_INGRESS}
          ingressClassName: ${TP_INGRESS_CLASS}
          service: ${TP_ES_RELEASE_NAME}-es-http
        httpRoute:
          enabled: ${TP_DEPLOY_ES_HTTP_ROUTE}
          gatewayName: ${TP_GATEWAY_NAME}
          gatewayNamespace: "${TP_INGRESS_GATEWAY_NAMESPACE}"
          host: elastic
          service: ${TP_ES_RELEASE_NAME}-es-http
          annotations: {}
        storage:
          name: ${TP_STORAGE_CLASS}
        resources:
          requests:
            memory: ${TP_ES_MEMORY_REQUEST}
            cpu: ${TP_ES_CPU_REQUEST}
          limits:
            memory: ${TP_ES_MEMORY_LIMIT}
            cpu: ${TP_ES_CPU_LIMIT}
      kibana:
        enabled: "${TP_DEPLOY_KIBANA}"
        count: ${TP_CONFIG_ES_KIBANA_COUNT}
        version: "${TP_CONFIG_ES_VERSION}"
        ingress:
          enabled: ${TP_DEPLOY_KIBANA_INGRESS}
          ingressClassName: ${TP_INGRESS_CLASS}
          service: ${TP_ES_RELEASE_NAME}-kb-http
        httpRoute:
          enabled: ${TP_DEPLOY_KIBANA_HTTP_ROUTE}
          gatewayName: ${TP_GATEWAY_NAME}
          gatewayNamespace: "${TP_INGRESS_GATEWAY_NAMESPACE}"
          host: kibana
          service: ${TP_ES_RELEASE_NAME}-kb-http
          annotations: {}
        resources:
          requests:
            memory: ${TP_KIBANA_MEMORY_REQUEST}
            cpu: ${TP_KIBANA_CPU_REQUEST}
          limits:
            memory: ${TP_KIBANA_MEMORY_LIMIT}
            cpu: ${TP_KIBANA_CPU_LIMIT}
      apm:
        enabled: "${TP_DEPLOY_APM}"
        version: "${TP_CONFIG_ES_VERSION}"
        ingress:
          enabled: ${TP_DEPLOY_APM_INGRESS}
          ingressClassName: ${TP_INGRESS_CLASS}
          service: ${TP_ES_RELEASE_NAME}-apm-http
        httpRoute:
          enabled: ${TP_DEPLOY_APM_HTTP_ROUTE}
          gatewayName: ${TP_GATEWAY_NAME}
          gatewayNamespace: "${TP_INGRESS_GATEWAY_NAMESPACE}"
          host: apm
          service: ${TP_ES_RELEASE_NAME}-apm-http
          annotations: {}
        resources:
          requests:
            memory: ${TP_APM_MEMORY_REQUEST}
            cpu: ${TP_APM_CPU_REQUEST}
          limits:
            memory: ${TP_APM_MEMORY_LIMIT}
            cpu: ${TP_APM_CPU_LIMIT}
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  flags:
    wait: true
    timeout: 1h
    createNamespace: false
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        kubectl create ns ${TP_CONFIG_ES_NAMESPACE}
        kubectl label namespace ${TP_CONFIG_ES_NAMESPACE} networking.platform.tibco.com/non-dp-ns=enable
        kubectl label namespace ${TP_CONFIG_ES_NAMESPACE} networking.platform.tibco.com/non-cp-ns=enable
    postDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # elastic
        kubectl get secret ${TP_ES_RELEASE_NAME}-es-http-ca-internal -n ${TP_CONFIG_ES_NAMESPACE} -o jsonpath='{.data.tls\.crt}' | base64 -d > ca.crt
        kubectl get configmap es-ca-cert -n ${TP_CONFIG_ES_NAMESPACE} || kubectl create configmap es-ca-cert --from-file=ca.crt=ca.crt -n ${TP_CONFIG_ES_NAMESPACE}
        # kibana
        kubectl get secret ${TP_ES_RELEASE_NAME}-kb-http-ca-internal -n ${TP_CONFIG_ES_NAMESPACE} -o jsonpath='{.data.tls\.crt}' | base64 -d > ca.crt
        kubectl get configmap kb-ca-cert -n ${TP_CONFIG_ES_NAMESPACE} || kubectl create configmap kb-ca-cert --from-file=ca.crt=ca.crt -n ${TP_CONFIG_ES_NAMESPACE}
        # apm
        kubectl get secret ${TP_ES_RELEASE_NAME}-apm-http-ca-internal -n ${TP_CONFIG_ES_NAMESPACE} -o jsonpath='{.data.tls\.crt}' | base64 -d > ca.crt
        kubectl get configmap apm-ca-cert -n ${TP_CONFIG_ES_NAMESPACE} || kubectl create configmap apm-ca-cert --from-file=ca.crt=ca.crt -n ${TP_CONFIG_ES_NAMESPACE}
- name: kube-prometheus-stack
  version: "${TP_KUBE_PROMETHEUS_STACK_VERSION}"
  condition: ${TP_DEPLOY_PROMETHEUS_STACK}
  releaseName: kube-prometheus-stack
  namespace: ${TP_PROMETHEUS_NAMESPACE}
  repo:
    helm:
      url: https://prometheus-community.github.io/helm-charts
  values:
    keepPrevious: true
    content: |
      grafana:
        enabled: ${TP_KUBE_PROMETHEUS_STACK_ENABLE_GRAFANA}
        plugins:
          - grafana-piechart-panel
        ingress:
          enabled: ${TP_DEPLOY_GRAFANA_INGRESS}
          ingressClassName: ${TP_INGRESS_CLASS}
          hosts:
          - grafana.${TP_DOMAIN}
        adminPassword: ${TP_GRAFANA_ADMIN_PASSWORD}
      prometheus-node-exporter:
        hostRootFsMount: 
          enabled: false
      prometheus:
        prometheusSpec:
          enableRemoteWriteReceiver: true
          remoteWriteDashboards: true
          additionalScrapeConfigs:
          - job_name: otel-collector
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            - action: keep
              regex: "true"
              source_labels:
              - __meta_kubernetes_pod_label_prometheus_io_scrape
            - action: keep
              regex: "infra"
              source_labels:
              - __meta_kubernetes_pod_label_platform_tibco_com_workload_type
            - action: keepequal
              source_labels: [__meta_kubernetes_pod_container_port_number]
              target_label: __meta_kubernetes_pod_label_prometheus_io_port
            - action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              source_labels:
              - __address__
              - __meta_kubernetes_pod_label_prometheus_io_port
              target_label: __address__
            - source_labels: [__meta_kubernetes_pod_label_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
              replacement: /$1
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  flags:
    wait: true
    timeout: 1h
    createNamespace: false
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        kubectl create ns ${TP_PROMETHEUS_NAMESPACE}
        kubectl label namespace ${TP_PROMETHEUS_NAMESPACE} networking.platform.tibco.com/non-dp-ns=enable
        kubectl label namespace ${TP_PROMETHEUS_NAMESPACE} networking.platform.tibco.com/non-cp-ns=enable
        GRAFANA_ADMIN_PASSWORD=$(kubectl get secret -n ${TP_PROMETHEUS_NAMESPACE} kube-prometheus-stack-grafana -o=jsonpath='{.data.admin-password}' 2> /dev/null | base64 --decode)
        echo "Grafana admin password: $GRAFANA_ADMIN_PASSWORD"
    postDeploy:
      ignoreErrors: true
      base64Encoded: false
      skip: false
      content: |
        if [ "${TP_O11Y_INGRESS_GATEWAY_SELECTION}" = "gateway" ] && [ "${TP_KUBE_PROMETHEUS_STACK_ENABLE_GRAFANA}" = "true" ]; then
          kubectl apply -f - <<EOF
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: grafana
            namespace: ${TP_PROMETHEUS_NAMESPACE}
          spec:
            parentRefs:
            - name: ${TP_GATEWAY_NAME}
              namespace: ${TP_INGRESS_GATEWAY_NAMESPACE}
            hostnames:
            - "grafana.${TP_DOMAIN}"
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /
              backendRefs:
              - name: kube-prometheus-stack-grafana
                port: 80
        EOF
        fi
- name: dp-config-opensearch
  version: ${TP_CONFIG_OPENSEARCH_CHART_VERSION}
  condition: ${TP_DEPLOY_OPENSEARCH}
  namespace: ${TP_OPENSEARCH_NAMESPACE}
  releaseName: dp-config-opensearch
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: true
    content: |
      domain: ${TP_DOMAIN}
      opensearch:
        enabled: "true"
        replicas: ${TP_OPENSEARCH_REPLICAS}
        singleNode: ${TP_OPENSEARCH_SINGLE_NODE}
        opensearchJavaOpts: "-Xmx1g -Xms1g"
        extraEnvs:
          - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            value: "${TP_OPENSEARCH_ADMIN_PASSWORD}"
        persistence:
          enabled: "true"
          storageClass: ${TP_STORAGE_CLASS}
          size: ${TP_OPENSEARCH_STORAGE_SIZE}
        resources:
          requests:
            memory: ${TP_OPENSEARCH_MEMORY_REQUEST}
            cpu: ${TP_OPENSEARCH_CPU_REQUEST}
          limits:
            memory: ${TP_OPENSEARCH_MEMORY_LIMIT}
            cpu: ${TP_OPENSEARCH_CPU_LIMIT}
        config:
          opensearch.yml: |
            cluster.name: opensearch-cluster
            network.host: 0.0.0.0
        service:
          httpPortName: https
      opensearch-dashboards:
        enabled: "${TP_DEPLOY_OPENSEARCH}"
        opensearchHosts: "https://opensearch-cluster-master:9200"
        replicaCount: 1
        resources:
          requests:
            memory: ${TP_OPENSEARCH_DASHBOARDS_MEMORY_REQUEST}
            cpu: ${TP_OPENSEARCH_DASHBOARDS_CPU_REQUEST}
          limits:
            memory: ${TP_OPENSEARCH_DASHBOARDS_MEMORY_LIMIT}
            cpu: ${TP_OPENSEARCH_DASHBOARDS_CPU_LIMIT}
      opensearchIngress:
        ingress:
          enabled: ${TP_DEPLOY_OPENSEARCH_INGRESS}
          ingressClassName: ${TP_INGRESS_CLASS}
          host: opensearch
        httpRoute:
          enabled: ${TP_DEPLOY_OPENSEARCH_HTTP_ROUTE}
          gatewayName: ${TP_GATEWAY_NAME}
          gatewayNamespace: "${TP_INGRESS_GATEWAY_NAMESPACE}"
          host: opensearch
      dashboardsIngress:
        ingress:
          enabled: ${TP_DEPLOY_OPENSEARCH_INGRESS}
          ingressClassName: ${TP_INGRESS_CLASS}
          host: opensearch-dashboards
        httpRoute:
          enabled: ${TP_DEPLOY_OPENSEARCH_HTTP_ROUTE}
          gatewayName: ${TP_GATEWAY_NAME}
          gatewayNamespace: "${TP_INGRESS_GATEWAY_NAMESPACE}"
          host: opensearch-dashboards
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  flags:
    wait: true
    timeout: 1h
    createNamespace: false
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        kubectl create ns ${TP_OPENSEARCH_NAMESPACE}
        kubectl label namespace ${TP_OPENSEARCH_NAMESPACE} networking.platform.tibco.com/non-dp-ns=enable
        kubectl label namespace ${TP_OPENSEARCH_NAMESPACE} networking.platform.tibco.com/non-cp-ns=enable
    postDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        echo "Waiting for OpenSearch statefulsets to be ready..."
        kubectl rollout status statefulset -n ${TP_OPENSEARCH_NAMESPACE} -l app.kubernetes.io/name=opensearch --timeout=10m
        echo "OpenSearch statefulsets are ready"
