- name: generic-chart # keycloak external IdP for MCP Hub inbound-VS OAuth (test envs only)
  version: 1.6.0
  condition: ${CP_INSTALL_KEYCLOAK}
  namespace: ${CP_EXT_NAMESPACE}
  releaseName: keycloak
  repo:
    helm:
      url: https://test-server.github.yyzd.me
  cluster:
    names:
      - ${CP_CLUSTER_NAME}
  values:
    keepPrevious: true
    content: |
      deployment:
        enabled: true
        image:
          repository: quay.io/keycloak/keycloak
          tag: "26.1"
        # production mode backed by the existing CP PostgreSQL (postgresql.tibco-ext), so
        # realm/users/clients survive pod restarts (the DB is PVC-backed via its bitnami chart)
        args: ["start", "--import-realm"]
        env:
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: "admin"
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            value: "${CP_KEYCLOAK_ADMIN_PASSWORD}"
          - name: KC_HOSTNAME
            value: "https://${CP_KEYCLOAK_HOST}"
          - name: KC_HTTP_ENABLED
            value: "true"
          - name: KC_PROXY_HEADERS
            value: "xforwarded"
          - name: KC_HEALTH_ENABLED
            value: "true"
          # persistent datastore: shared CP PostgreSQL, dedicated keycloak database
          - name: KC_DB
            value: "postgres"
          - name: KC_DB_URL
            value: "jdbc:postgresql://${CP_DB_HOST}:${CP_DB_PORT}/keycloak"
          - name: KC_DB_USERNAME
            value: "postgres"
          - name: KC_DB_PASSWORD
            value: "${CP_KEYCLOAK_DB_PASSWORD}"
        ports:
          http:
            enabled: true
            protocol: TCP
            containerPort: 8080
        volumeMounts:
          - name: realm-import
            mountPath: /opt/keycloak/data/import
            readOnly: true
        volumes:
          - name: realm-import
            configMap:
              name: keycloak-realm-mcp-inbound
        podLabels:
          app: keycloak
      service:
        enabled: true
        name: keycloak
        ports:
          http:
            enabled: true
            protocol: TCP
            containerPort: 8080
            servicePort: 8080
      ingress:
        enabled: ${CP_BOOTSTRAP_INGRESS_ROUTER_INGRESS_ENABLED}
        labels:
          app.cloud.tibco.com/created-by: pipeline
        annotations:
          nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
        spec:
          ingressClassName: ${CP_INGRESS_CLASSNAME}
          tls:
          - hosts:
            - '*.${CP_DNS_DOMAIN}'
            secretName: ${TP_GENERATE_CERTIFICATE_NAME}
          rules:
            - host: '${CP_KEYCLOAK_HOST}'
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: keycloak
                        port:
                          number: 8080
      httpRoutes:
        keycloak:
          enabled: ${CP_BOOTSTRAP_INGRESS_ROUTER_GATEWAY_ENABLED}
          name: keycloak-generic-chart
          labels:
            app.cloud.tibco.com/created-by: pipeline
          spec:
            parentRefs:
            - name: ${TP_GATEWAY_NAME}
              namespace: ${CP_INGRESS_NAMESPACE}
            hostnames:
            - "${CP_KEYCLOAK_HOST}"
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /
              backendRefs:
              - name: keycloak
                port: 8080
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # Create the namespace (helm createNamespace runs after this hook) and the
        # realm import ConfigMap. Realm is defined inline here as the single source of
        # truth - the recipe runs containerized with no adjacent files at deploy time.
        kubectl create namespace ${CP_EXT_NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
        # Ensure the dedicated keycloak database exists in the shared CP PostgreSQL.
        # Keycloak (start mode) creates its tables but not its database, so create it here (idempotent).
        _pg_pod=$(kubectl get pod -n ${CP_EXT_NAMESPACE} -l app.kubernetes.io/name=postgresql -o jsonpath='{.items[0].metadata.name}')
        if [[ -n "${_pg_pod}" ]]; then
          kubectl exec -n ${CP_EXT_NAMESPACE} "${_pg_pod}" -- env PGPASSWORD="${CP_KEYCLOAK_DB_PASSWORD}" \
            psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='keycloak'" | grep -q 1 \
          || kubectl exec -n ${CP_EXT_NAMESPACE} "${_pg_pod}" -- env PGPASSWORD="${CP_KEYCLOAK_DB_PASSWORD}" \
            psql -U postgres -c "CREATE DATABASE keycloak"
        else
          echo "WARN: no postgresql pod found in ${CP_EXT_NAMESPACE}; expecting ${CP_DB_HOST} reachable with a 'keycloak' database"
        fi
        cat > mcp-inbound-realm.json <<'KCREALM'
        {
          "realm": "mcp-inbound",
          "enabled": true,
          "displayName": "MCP Inbound OAuth (test)",
          "sslRequired": "none",
          "loginWithEmailAllowed": true,
          "registrationAllowed": false,
          "clients": [
            {
              "clientId": "mcp-test-client",
              "name": "MCP Test Client",
              "description": "Static public client for MCP inbound-VS OAuth testing (auth-code + PKCE / direct grant)",
              "enabled": true,
              "protocol": "openid-connect",
              "publicClient": true,
              "standardFlowEnabled": true,
              "directAccessGrantsEnabled": true,
              "redirectUris": ["*"],
              "webOrigins": ["*"],
              "attributes": { "pkce.code.challenge.method": "S256" },
              "protocolMappers": [
                {
                  "name": "mcp-inbound-vs-audience",
                  "protocol": "openid-connect",
                  "protocolMapper": "oidc-audience-mapper",
                  "consentRequired": false,
                  "config": { "included.custom.audience": "mcp-inbound-vs", "id.token.claim": "false", "access.token.claim": "true" }
                }
              ]
            }
          ],
          "users": [
            { "username": "mcpuser", "email": "mcpuser@example.com", "emailVerified": true, "enabled": true, "firstName": "MCP", "lastName": "User", "credentials": [{ "type": "password", "value": "Tibco@123", "temporary": false }] },
            { "username": "alice", "email": "alice@example.com", "emailVerified": true, "enabled": true, "firstName": "Alice", "lastName": "Example", "credentials": [{ "type": "password", "value": "Tibco@123", "temporary": false }] },
            { "username": "bob", "email": "bob@example.com", "emailVerified": true, "enabled": true, "firstName": "Bob", "lastName": "Example", "credentials": [{ "type": "password", "value": "Tibco@123", "temporary": false }] },
            { "username": "carol", "email": "carol@example.com", "emailVerified": true, "enabled": true, "firstName": "Carol", "lastName": "Example", "credentials": [{ "type": "password", "value": "Tibco@123", "temporary": false }] }
          ]
        }
        KCREALM
        kubectl create configmap keycloak-realm-mcp-inbound -n ${CP_EXT_NAMESPACE} \
          --from-file=mcp-inbound-realm.json=mcp-inbound-realm.json \
          --dry-run=client -o yaml | kubectl apply -f -
    postDeploy:
      ignoreErrors: true # DCR enablement is a convenience; a hiccup here must not fail the CP deploy
      base64Encoded: false
      skip: false
      content: |
        # Open DCR (test envs only): remove ALL anonymous client-registration policies so MCP clients
        # (e.g. MCP Inspector / mcp-remote) can self-register WITH scopes. Keycloak 26.1 creates a set
        # of these per realm and the realm import cannot suppress them: deleting only "Trusted Hosts"
        # enables anonymous registration, but "Allowed Client Scopes" / "Allowed Protocol Mapper Types"
        # still reject *scoped* DCR (insufficient_scope), so a real browser auth-code/PKCE flow can't
        # start. We remove the whole anonymous set (idempotent). kubectl exec + in-pod kcadm.sh is used
        # because the pipeline runner is a host container outside the cluster pod-network.
        echo "waiting for keycloak pod to be ready..."
        kubectl wait --for=condition=ready pod -l app=keycloak -n ${CP_EXT_NAMESPACE} --timeout=300s || true
        _kcpod=$(kubectl get pod -n ${CP_EXT_NAMESPACE} -l app=keycloak -o jsonpath='{.items[0].metadata.name}')
        if [[ -z "${_kcpod}" ]]; then echo "ERROR: keycloak pod not found"; exit 1; fi
        kubectl exec -n ${CP_EXT_NAMESPACE} "${_kcpod}" -- env KC_PW="${CP_KEYCLOAK_ADMIN_PASSWORD}" sh -c \
          '/opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user admin --password "$KC_PW" >/dev/null 2>&1'
        # Re-fetch and delete until none remain (a single kcadm delete can transiently return non-zero,
        # which would otherwise leave a policy behind and keep rejecting scoped DCR).
        for _pass in 1 2 3; do
          _polids=$(kubectl exec -n ${CP_EXT_NAMESPACE} "${_kcpod}" -- /opt/keycloak/bin/kcadm.sh get components -r mcp-inbound 2>/dev/null \
            | yq -p=json '.[] | select(.providerType == "org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy" and .subType == "anonymous") | .id')
          [[ -z "${_polids}" ]] && break
          for _id in ${_polids}; do
            kubectl exec -n ${CP_EXT_NAMESPACE} "${_kcpod}" -- /opt/keycloak/bin/kcadm.sh delete components/${_id} -r mcp-inbound 2>/dev/null || true
            echo "open DCR: removed anonymous client-registration policy ${_id}"
          done
        done
        # Stamp aud=mcp-inbound-vs on EVERY token by adding the audience mapper to the built-in
        # "basic" client scope. Keycloak applies "basic" to all clients -- including DCR-registered
        # clients that send an explicit scope/grant config in the registration request, which do NOT
        # inherit the realm default client scopes (only "basic"). This covers static, bare-DCR, and
        # scoped-DCR clients alike. Idempotent. Test envs only.
        _basicid=$(kubectl exec -n ${CP_EXT_NAMESPACE} "${_kcpod}" -- /opt/keycloak/bin/kcadm.sh get client-scopes -r mcp-inbound --fields id,name --format csv --noquotes 2>/dev/null | awk -F, '$2=="basic"{print $1}')
        if [[ -z "${_basicid}" ]]; then
          echo "WARN: 'basic' client scope not found; clients may not receive aud=mcp-inbound-vs"
        elif kubectl exec -n ${CP_EXT_NAMESPACE} "${_kcpod}" -- /opt/keycloak/bin/kcadm.sh get client-scopes/${_basicid}/protocol-mappers/models -r mcp-inbound 2>/dev/null | grep -q mcp-inbound-vs-audience; then
          echo "open DCR: aud=mcp-inbound-vs mapper already present on the 'basic' client scope"
        else
          kubectl exec -n ${CP_EXT_NAMESPACE} "${_kcpod}" -- /opt/keycloak/bin/kcadm.sh create client-scopes/${_basicid}/protocol-mappers/models -r mcp-inbound \
            -s name=mcp-inbound-vs-audience -s protocol=openid-connect -s protocolMapper=oidc-audience-mapper \
            -s 'config."included.custom.audience"=mcp-inbound-vs' -s 'config."access.token.claim"=true' -s 'config."id.token.claim"=false' 2>/dev/null \
            && echo "open DCR: added aud=mcp-inbound-vs mapper to the 'basic' client scope (all clients incl. DCR get the audience)"
        fi
        echo "  anonymous (scoped) registration at: https://${CP_KEYCLOAK_HOST}/realms/mcp-inbound/clients-registrations/openid-connect"
  flags:
    createNamespace: true
    timeout: 1h
- name: tibco-cp-mcp-hub
  version: ${CP_PLATFORM_MCP_HUB_VERSION}
  condition: ${CP_INSTALL_PLATFORM_MCP_HUB}
  repo:
    helm:
      url: ${CP_CHART_REPO}
      username: "${CP_CHART_REPO_USER_NAME}"
      password: "${CP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: false
    content: |
      mcp-hub-recipes:
        enabled: true
      mcp-hub-webserver:
        enabled: true
        persistence:
          enabled: ${CP_MCP_HUB_PERSISTENCE}
          storageClassName: "${CP_STORAGE_CLASS}"
      global:
        external:
          dnsDomain: ${CP_SERVICE_DNS_DOMAIN}
          storage:
            pvcName: ${CP_STORAGE_PVC_NAME}
        tibco:
          enableResourceConstraints: ${CP_GLOBAL_ENABLE_RESOURCE_CONSTRAINTS}
          controlPlaneInstanceId: ${CP_INSTANCE_ID}
          serviceAccount: ${CP_INSTANCE_ID}-sa
          logging:
            fluentbit:
              enabled: ${CP_LOG_ENABLE}
          containerRegistry:
            url: ${CP_CONTAINER_REGISTRY}
            password: "${CP_CONTAINER_REGISTRY_PASSWORD}"
            username: "${CP_CONTAINER_REGISTRY_USERNAME}"
            repository: "${CP_CONTAINER_REGISTRY_REPOSITORY}"
          useSingleNamespace: true
          proxy:
            httpProxy: "${CP_PROXY_HTTP_PROXY}"
            httpsProxy: "${CP_PROXY_HTTPS_PROXY}"
            noProxy: "${CP_PROXY_NO_PROXY}"
  cluster:
    names:
      - ${CP_CLUSTER_NAME}
  releaseName: tibco-cp-mcp-hub
  namespace: ${CP_NAMESPACE}
  flags:
    wait: true
    timeout: 1h
    createNamespace: ${CP_CREATE_NAMESPACE}
