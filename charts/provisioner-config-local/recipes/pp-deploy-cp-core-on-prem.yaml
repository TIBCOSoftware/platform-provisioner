# Recipe for installing TIBCO Control Plane on-premises
apiVersion: v1
kind: helm-install
meta:
  guiEnv:
    note: "deploy-cp-on-prem"
    # github
    GUI_CP_CHART_REPO: "https://tibcosoftware.github.io/tp-helm-charts"
    GUI_CP_CHART_REPO_USER_NAME: "cp-test"
    GUI_CP_CHART_REPO_TOKEN: ""
    GUI_DP_CHART_REPO_HOST: "https://tibcosoftware.github.io"
    GUI_DP_CHART_REPO_PATH: "tp-helm-charts"
    GUI_DP_CHART_REPO_USER_NAME: "cp-test"
    GUI_DP_CHART_REPO_TOKEN: ""

    # image registry
    GUI_CP_CONTAINER_REGISTRY: csgprduswrepoedge.jfrog.io
    GUI_CP_CONTAINER_REGISTRY_REPOSITORY: tibco-platform-docker-prod
    GUI_CP_CONTAINER_REGISTRY_USERNAME: ""
    GUI_CP_CONTAINER_REGISTRY_PASSWORD: ""

    # proxy
    GUI_CP_PROXY_HTTP_PROXY: ""
    GUI_CP_PROXY_HTTPS_PROXY: ""
    GUI_CP_PROXY_NO_PROXY: ""

    # CP version see: https://docs.tibco.com/pub/platform-cp/latest/doc/html/Default.htm#Installation/helm-chart-version-matrix.htm
    GUI_CP_PLATFORM_TIBCO_CP_BASE_VERSION: 1.18.0
    GUI_CP_PLATFORM_INTEGRATION_BW_VERSION: 1.18.0
    GUI_CP_PLATFORM_INTEGRATION_FLOGO_VERSION: 1.18.0
    GUI_CP_PLATFORM_INTEGRATION_SB_VERSION: 1.16.0
    GUI_CP_PLATFORM_TIBCOHUB_VERSION: 1.18.0
    GUI_CP_PLATFORM_MESSAGING_VERSION: 1.15.31
    GUI_CP_PLATFORM_HAWK_VERSION: 1.18.12
    GUI_CP_PLATFORM_EVENTPROCESSING_VERSION: 1.17.0
    GUI_CP_PLATFORM_AI_AGENT_VERSION: "~1.16.0-0"
    GUI_CP_PLATFORM_MCP_HUB_VERSION: "~1.17.0-0"

    # CP env
    GUI_CP_INSTANCE_ID: "cp1"
    GUI_CP_NAMESPACE: "cp1-ns"
    GUI_CP_ADMIN_EMAIL: "cp-test@tibco.com"
    GUI_CP_ADMIN_PASSWORD: "Tibco@123" 
    GUI_CP_ENABLE_API_BASED_INITIALIZATION: false 
    GUI_CP_FROM_REPLY_TO_EMAIL: ""
    GUI_CP_EXTERNAL_ENVIRONMENT: "production"
    GUI_CP_RESOURCES_REQUEST_CPU: "50m" # for lightweight services only; heavy services (IDM, pengine, etc.) use hard-coded values
    GUI_CP_RESOURCES_REQUEST_MEMORY: "50Mi" # for lightweight services only; heavy services use hard-coded values
    GUI_CP_GLOBAL_ENABLE_RESOURCE_CONSTRAINTS: true
    GUI_CP_ENABLE_HYBRID_CONNECTIVITY: true

    # CP AI MCP servers
    GUI_TP_AI_ENABLE_CP_MCP_SERVER: true
    GUI_TP_AI_ENABLE_O11Y_MCP_SERVER: true
    GUI_TP_AI_ENABLE_BW_MCP_SERVER: true
    GUI_TP_AI_ENABLE_FLOGO_MCP_SERVER: true
    GUI_TP_AI_ENABLE_MCP_HUB: false
    GUI_CP_MCP_HUB_PERSISTENCE: true
    # CP AI Agent config (renders AI_AGENT_CONFIG on tp-cp-web-server via cpwebserver.aiAgent.enabled)
    GUI_CP_ENABLE_AI_AGENT_CONFIG: false

    # CP AI Agent env
    GUI_TP_AI_MCP_TRANSPORT: "streamable-http"
    GUI_TP_AI_LANGSMITH_TRACING: false
    GUI_TP_AI_LANGSMITH_ENDPOINT: ""
    GUI_TP_AI_LANGSMITH_API_KEY: ""
    GUI_TP_AI_LANGSMITH_PROJECT: ""
    GUI_TP_AI_LANGFUSE_ENABLED: false
    GUI_TP_AI_LANGFUSE_SECRET_KEY: ""
    GUI_TP_AI_LANGFUSE_PUBLIC_KEY: ""
    GUI_TP_AI_LANGFUSE_HOST: ""

    # network policy
    GUI_TP_CREATE_NETWORK_POLICIES: false

    # third party
    GUI_CP_EXT_NAMESPACE: "tibco-ext"

    # ingress
    GUI_CP_DNS_DOMAIN: "localhost.dataplanes.pro"
    GUI_TP_TLS_CERT: ""
    GUI_TP_TLS_KEY: ""
    GUI_CP_INGRESS_CLASSNAME: "traefik"
    GUI_CP_INGRESS_NAMESPACE: "ingress-system"
    GUI_TP_GATEWAY_NAME: "nginx-gateway"
    GUI_CP_BOOTSTRAP_INGRESS_ROUTER: true
    GUI_CP_BOOTSTRAP_INGRESS_HYBRID_PROXY: true
    GUI_TP_GENERATE_CERTIFICATES: false
    GUI_TP_TLS_SECRET_NAME_ROUTER: ""
    GUI_TP_TLS_CERT_ROUTER: ""
    GUI_TP_TLS_KEY_ROUTER: ""
    GUI_TP_TLS_SECRET_NAME_HYBRID_PROXY: ""
    GUI_TP_TLS_CERT_HYBRID_PROXY: ""
    GUI_TP_TLS_KEY_HYBRID_PROXY: ""

    # storage
    GUI_CP_STORAGE_CLASS: "hostpath" # user need to choose based on environment
    GUI_CP_STORAGE_CREATE_PV: false
    GUI_CP_STORAGE_PV_NAME: "" # control-plane-pv the name of PV for kind
    GUI_CP_STORAGE_PV_SIZE: "10Gi"
    GUI_CP_STORAGE_PVC_NAME: ""

    # logging
    GUI_CP_ES_NAMESPACE: "elastic-system"
    GUI_CP_LOG_ENABLE: true
    GUI_CP_LOG_ENDPOINT: ""
    GUI_CP_LOG_USERNAME: "" # optional logserver username, if using ELK stack
    GUI_CP_LOG_PASSWORD: "" # optional logserver password, if using ELK stack
    GUI_CP_LOG_INDEX: "tibco-cp-logs" # optional logserver index, default is tibco-cp-logs
    GUI_CP_AUDITSERVER_ENDPOINT: "" # optional auditserver endpoint, if you have ELK stack or other logging solution
    GUI_CP_AUDITSERVER_USERNAME: "" # optional auditserver username, if using ELK stack
    GUI_CP_AUDITSERVER_PASSWORD: "" # optional auditserver password, if using ELK stack
    GUI_CP_AUDITSERVER_INDEX: "audittrail" # optional auditserver index, default is audittrail

    # email
    GUI_CP_MAIL_SERVER_TYPE: "" # smtp, ses, sendgrid, graph (empty = no email server; requires adminInitialPassword for admin bootstrap)
    GUI_CP_MAIL_SERVER_SES_ARN: ""
    GUI_CP_MAIL_SERVER_SENDGRID_API_KEY: ""
    GUI_CP_MAIL_SERVER_ADDRESS: ""
    GUI_CP_MAIL_SERVER_PORT_NUMBER: "1025"
    GUI_CP_MAIL_SERVER_USERNAME: ""
    GUI_CP_MAIL_SERVER_PASSWORD: ""
    GUI_CP_MAIL_SERVER_GRAPH_CLIENT_DETAILS_SECRET_NAME: ""
    GUI_CP_MAIL_SERVER_GRAPH_SKIP_SENT_FOLDER: ""

    # DB the default value is for postgres pod.
    GUI_CP_DB_HOST: "postgresql.tibco-ext.svc.cluster.local"
    GUI_CP_DB_PORT: "5432"
    GUI_CP_DB_USER_NAME: "postgres"
    GUI_CP_DB_PASSWORD: "postgres"
    GUI_CP_DB_NAME: "postgres"
    GUI_CP_DB_SECRET_NAME: "provider-cp-database-credentials"
    GUI_CP_DB_SSL_MODE: "disable" # verify-full, disable
    GUI_CP_DB_SSL_ROOT_CERT: ""
    GUI_CP_DB_SSL_ROOT_CERT_SECRET_NAME: "db-ssl-root-cert"
    GUI_CP_DB_SSL_ROOT_CERT_FILENAME: "db_ssl_root.cert"
    GUI_CP_DB_DELETE_ON_UNINSTALL: false
    GUI_CP_MANAGE_DB_SCHEMA: true

    # Keycloak external IdP (optional; only used when GUI_CP_INSTALL_KEYCLOAK=true; test envs only)
    GUI_CP_KEYCLOAK_HOST: "" # public host for Keycloak; empty => keycloak.<CP_DNS_DOMAIN>
    GUI_CP_KEYCLOAK_ADMIN_PASSWORD: "Tibco@123" # Keycloak admin console/API password
    GUI_CP_KEYCLOAK_DB_PASSWORD: "" # empty => CP DB password (GUI_CP_DB_PASSWORD), else "postgres"; must match the real PostgreSQL password

    # flow control
    GUI_CP_VALIDATE_CLUSTER_RESOURCE: true
    GUI_CP_CREATE_NAMESPACE: true
    GUI_CP_CROSSPLANE_ENABLED: false
    GUI_CP_INSTALL_MAILDEV: true
    GUI_CP_INSTALL_MAILDEV_INGRESS: true
    GUI_CP_INSTALL_KEYCLOAK: false # optional external IdP for MCP Hub inbound-VS OAuth; default OFF (test envs only)
    GUI_CP_INSTALL_TIBCO_CP_BASE: true
    GUI_CP_INSTALL_PLATFORM_INTEGRATION_BW: true
    GUI_CP_INSTALL_PLATFORM_INTEGRATION_BWCE_UTILITIES: true
    GUI_CP_INSTALL_PLATFORM_INTEGRATION_BW5CE_UTILITIES: true
    GUI_CP_INSTALL_PLATFORM_INTEGRATION_FLOGO: true
    GUI_CP_INSTALL_PLATFORM_INTEGRATION_SB: false
    GUI_CP_INSTALL_PLATFORM_TIBCOHUB: true
    GUI_CP_INSTALL_PLATFORM_MESSAGING: true
    GUI_CP_INSTALL_PLATFORM_HAWK: true
    GUI_CP_INSTALL_PLATFORM_EVENTPROCESSING: true
    GUI_CP_INSTALL_PLATFORM_AI_AGENT: false
    GUI_CP_INSTALL_PLATFORM_MCP_HUB: false
  globalEnvVariable:
    REPLACE_RECIPE: true
    PIPELINE_LOG_DEBUG: false
    PIPELINE_CHECK_DOCKER_STATUS: false

    # GitHub credentials
    GITHUB_TOKEN: "${GUI_GITHUB_TOKEN}"
    CP_CHART_REPO: ${GUI_CP_CHART_REPO:-"https://tibcosoftware.github.io/tp-helm-charts"} # TIBCO Platform CP public repo
    CP_CHART_REPO_USER_NAME: ${GUI_CP_CHART_REPO_USER_NAME:-"cp-test"}
    CP_CHART_REPO_TOKEN: ${GUI_CP_CHART_REPO_TOKEN:-""}
    DP_CHART_REPO_HOST: ${GUI_DP_CHART_REPO_HOST:-"https://tibcosoftware.github.io"} # used in CP platform-base global.tibco.helm.url
    DP_CHART_REPO_PATH: ${GUI_DP_CHART_REPO_PATH:-"tp-helm-charts"}
    DP_CHART_REPO_USER_NAME: ${GUI_DP_CHART_REPO_USER_NAME:-"cp-test"}
    DP_CHART_REPO_TOKEN: ${GUI_DP_CHART_REPO_TOKEN:-""}

    # container registry
    CP_CONTAINER_REGISTRY: ${GUI_CP_CONTAINER_REGISTRY:-"csgprduswrepoedge.jfrog.io"}
    CP_CONTAINER_REGISTRY_REPOSITORY: ${GUI_CP_CONTAINER_REGISTRY_REPOSITORY:-"tibco-platform-docker-prod"}
    CP_CONTAINER_REGISTRY_USERNAME: "${GUI_CP_CONTAINER_REGISTRY_USERNAME}"
    CP_CONTAINER_REGISTRY_PASSWORD: "${GUI_CP_CONTAINER_REGISTRY_PASSWORD}"

    # CP proxy
    CP_PROXY_HTTP_PROXY: ${GUI_CP_PROXY_HTTP_PROXY:-""}
    CP_PROXY_HTTPS_PROXY: ${GUI_CP_PROXY_HTTPS_PROXY:-""}
    CP_PROXY_NO_PROXY: ${GUI_CP_PROXY_NO_PROXY:-""}

    # env
    CP_CLUSTER_NAME: ${GUI_CP_CLUSTER_NAME:-"cp-cluster"}
    CP_INSTANCE_ID: ${GUI_CP_INSTANCE_ID:-"cp1"}
    CP_NAMESPACE: ${GUI_CP_NAMESPACE:-"${CP_INSTANCE_ID}-ns"}
    CP_ADMIN_EMAIL: ${GUI_CP_ADMIN_EMAIL:-"cp-test@gmail.com"}
    CP_ADMIN_PASSWORD: ${GUI_CP_ADMIN_PASSWORD:-"Tibco@123"} # initial admin password (adminInitialPassword)
    CP_ENABLE_API_BASED_INITIALIZATION: ${GUI_CP_ENABLE_API_BASED_INITIALIZATION:-true}
    CP_FROM_REPLY_TO_EMAIL: ${GUI_CP_FROM_REPLY_TO_EMAIL:-""}
    CP_EXTERNAL_ENVIRONMENT: ${GUI_CP_EXTERNAL_ENVIRONMENT:-"production"}
    CP_RESOURCES_REQUEST_CPU: ${GUI_CP_RESOURCES_REQUEST_CPU:-"50m"} # light-tier request for lightweight services
    CP_RESOURCES_REQUEST_MEMORY: ${GUI_CP_RESOURCES_REQUEST_MEMORY:-"50Mi"} # light-tier request for lightweight services
    CP_GLOBAL_ENABLE_RESOURCE_CONSTRAINTS: ${GUI_CP_GLOBAL_ENABLE_RESOURCE_CONSTRAINTS:-true}
    CP_ENABLE_HYBRID_CONNECTIVITY: ${GUI_CP_ENABLE_HYBRID_CONNECTIVITY:-true}

    # domain
    CP_DNS_DOMAIN: ${GUI_CP_DNS_DOMAIN:-"localhost.dataplanes.pro"}
    CP_SERVICE_DNS_DOMAIN: ${CP_INSTANCE_ID}-my.${CP_DNS_DOMAIN}
    CP_TUNNEL_DNS_DOMAIN: ${CP_INSTANCE_ID}-tunnel.${CP_DNS_DOMAIN}

    # storage
    CP_STORAGE_CLASS: ${GUI_CP_STORAGE_CLASS:-"standard"} # standard, gp2, hostpath, efs-sc
    CP_STORAGE_PV_NAME: "${GUI_CP_STORAGE_PV_NAME}" # control-plane-pv the name of PV for kind, works with CP_STORAGE_CREATE_PV flag
    CP_STORAGE_PV_SIZE: "${GUI_CP_STORAGE_PV_SIZE:-10Gi}"
    CP_STORAGE_PVC_NAME: ${GUI_CP_STORAGE_PVC_NAME:-"control-plane-pvc"} # added in 1.7.0

    # CP logging
    CP_ES_NAMESPACE: ${GUI_CP_ES_NAMESPACE:-"elastic-system"}
    CP_LOG_ENABLE: ${GUI_CP_LOG_ENABLE:-false}
    CP_LOG_ENDPOINT: ${GUI_CP_LOG_ENDPOINT:-"https://dp-config-es-es-http.${CP_ES_NAMESPACE}.svc.cluster.local:9200"} # optional logserver endpoint
    CP_LOG_USERNAME: ${GUI_CP_LOG_USERNAME:-"elastic"} # optional logserver username
    CP_LOG_PASSWORD: ${GUI_CP_LOG_PASSWORD:-""} # optional logserver password
    CP_LOG_INDEX: ${GUI_CP_LOG_INDEX:-"tibco-cp-logs"} # optional logserver index, default is tibco-cp-logs
    CP_AUDITSERVER_ENDPOINT: ${GUI_CP_AUDITSERVER_ENDPOINT:-"https://dp-config-es-es-http.${CP_ES_NAMESPACE}.svc.cluster.local:9200"} # optional auditserver endpoint
    CP_AUDITSERVER_USERNAME: ${GUI_CP_AUDITSERVER_USERNAME:-"elastic"} # optional auditserver username
    CP_AUDITSERVER_PASSWORD: ${GUI_CP_AUDITSERVER_PASSWORD:-""} # optional auditserver password
    CP_AUDITSERVER_INDEX: ${GUI_CP_AUDITSERVER_INDEX:-"audittrail"} # optional auditserver index, default is audittrail

    # network policies
    TP_CREATE_NETWORK_POLICIES: ${GUI_TP_CREATE_NETWORK_POLICIES:-false}

    # node
    TP_CLUSTER_NODE_CIDR: ${GUI_TP_CLUSTER_NODE_CIDR:-"10.180.0.0/16"}
    TP_CLUSTER_POD_CIDR: ${GUI_TP_CLUSTER_POD_CIDR:-"10.180.0.0/16"} # for k3s: 10.42.0.0/16 for kind 10.244.0.0/16
    TP_CLUSTER_SERVICE_CIDR: ${GUI_TP_CLUSTER_SERVICE_CIDR:-"10.96.0.0/12"} # for k3s: 10.43.0.0/16 for kind 10.96.0.0/16

    # third party
    CP_EXT_NAMESPACE: ${GUI_CP_EXT_NAMESPACE:-"tibco-ext"}

    # CP DB setup env
    CP_DB_HOST: ${GUI_CP_DB_HOST:-"postgresql.tibco-ext.svc.cluster.local"} #
    CP_DB_PORT: ${GUI_CP_DB_PORT:-"5432"}
    CP_DB_USER_NAME: ${GUI_CP_DB_USER_NAME:-""} # CP_RDS_USERNAME in create-rds.sh
    CP_DB_PASSWORD: ${GUI_CP_DB_PASSWORD:-""} # CP_RDS_MASTER_PASSWORD in create-rds.sh
    CP_DB_NAME: ${GUI_CP_DB_NAME:-postgres}
    CP_DB_SECRET_NAME: ${GUI_CP_DB_SECRET_NAME:-provider-cp-database-credentials}
    CP_DB_SSL_MODE: ${GUI_CP_DB_SSL_MODE:-"disable"} # verify-full, disable
    CP_DB_SSL_ROOT_CERT: ${GUI_CP_DB_SSL_ROOT_CERT:-""}
    CP_DB_DELETE_ON_UNINSTALL: ${GUI_CP_DB_DELETE_ON_UNINSTALL:-"false"}
    CP_ENCRYPTION_SECRET_NAME: ${GUI_CP_ENCRYPTION_SECRET_NAME:-"cporch-encryption-secret"}
    CP_ENCRYPTION_SECRET_KEY: ${GUI_CP_ENCRYPTION_SECRET_KEY:-"CP_ENCRYPTION_SECRET"}
    CP_DB_SSL_ROOT_CERT_SECRET_NAME: ${GUI_CP_DB_SSL_ROOT_CERT_SECRET_NAME:-"db-ssl-root-cert"}
    CP_DB_SSL_ROOT_CERT_FILENAME: ${GUI_CP_DB_SSL_ROOT_CERT_FILENAME:-"db_ssl_root.cert"}
    CP_MANAGE_DB_SCHEMA: ${GUI_CP_MANAGE_DB_SCHEMA:-"true"}

    # CP mail server
    CP_MAIL_MAILDEV_SERVICE_NAME: ${GUI_CP_MAIL_MAILDEV_SERVICE_NAME:-"development-mailserver"}
    CP_MAIL_SERVER_TYPE: ${GUI_CP_MAIL_SERVER_TYPE:-""} # smtp, ses, sendgrid (empty = no email server)
    CP_MAIL_SERVER_SES_ARN: ${GUI_CP_MAIL_SERVER_SES_ARN:-""}
    CP_MAIL_SERVER_SENDGRID_API_KEY: ${GUI_CP_MAIL_SERVER_SENDGRID_API_KEY:-""}
    CP_MAIL_SERVER_ADDRESS: ${GUI_CP_MAIL_SERVER_ADDRESS:-"${CP_MAIL_MAILDEV_SERVICE_NAME}.${CP_EXT_NAMESPACE}.svc.cluster.local"}
    CP_MAIL_SERVER_PORT_NUMBER: ${GUI_CP_MAIL_SERVER_PORT_NUMBER:-"1025"}
    CP_MAIL_SERVER_USERNAME: ${GUI_CP_MAIL_SERVER_USERNAME:-""}
    CP_MAIL_SERVER_PASSWORD: ${GUI_CP_MAIL_SERVER_PASSWORD:-""}
    CP_MAIL_SERVER_GRAPH_CLIENT_DETAILS_SECRET_NAME: ${GUI_CP_MAIL_SERVER_GRAPH_CLIENT_DETAILS_SECRET_NAME:-""} # the secret name for graph client details
    CP_MAIL_SERVER_GRAPH_SKIP_SENT_FOLDER: ${GUI_CP_MAIL_SERVER_GRAPH_SKIP_SENT_FOLDER:-false}

    # CP ingress
    CP_INGRESS_CLASSNAME: ${GUI_CP_INGRESS_CLASSNAME:-"traefik"} # the ingress for CP
    CP_INGRESS_NAMESPACE: ${GUI_CP_INGRESS_NAMESPACE:-"ingress-system"}
    TP_INGRESS_OBJECT: ${GUI_TP_INGRESS_OBJECT:-"ingress"} # ingress|gateway, this will create ingress / httproute object for router
    TP_GATEWAY_NAME: ${GUI_TP_GATEWAY_NAME:-"nginx-gateway"}
    CP_BOOTSTRAP_INGRESS_ROUTER_INGRESS_ENABLED: $(if [[ "${TP_INGRESS_OBJECT}" == "ingress" ]]; then echo true; else echo false; fi)
    CP_BOOTSTRAP_INGRESS_ROUTER_GATEWAY_ENABLED: $(if [[ "${TP_INGRESS_OBJECT}" == "gateway" ]]; then echo true; else echo false; fi)
    CP_BOOTSTRAP_INGRESS_HYBRID_PROXY_INGRESS_ENABLED: $(if [[ "${TP_INGRESS_OBJECT}" == "ingress" ]]; then echo true; else echo false; fi)
    CP_BOOTSTRAP_INGRESS_HYBRID_PROXY_GATEWAY_ENABLED: $(if [[ "${TP_INGRESS_OBJECT}" == "gateway" ]]; then echo true; else echo false; fi)
    CP_ALB_CERTIFICATE_ARN: "" # AWS ACM certificate ARN for ALB
    CP_NLB_CERTIFICATE_ARN: "" # AWS ACM certificate ARN for NLB
    TP_TLS_CERT: ${GUI_TP_TLS_CERT:-""} # if provided; will create secret tp-certificate with tls.crt and tls.key and create ingress
    TP_TLS_KEY: ${GUI_TP_TLS_KEY:-""}
    TP_GENERATE_CERTIFICATES: ${GUI_TP_GENERATE_CERTIFICATES:-true} # if true, will create cluster issuer and certificate for tp-certificate using cert-manager. For local use set to false
    TP_GENERATE_CERTIFICATE_NAME: tp-certificate-${CP_INSTANCE_ID}
    TP_CERTIFICATE_CLUSTER_ISSUER: ${GUI_TP_CERTIFICATE_CLUSTER_ISSUER:-"tp-prod"} # the cluster issuer for tp-certificate
    TP_TLS_SECRET_NAME_ROUTER: ${GUI_TP_TLS_SECRET_NAME_ROUTER:-""} # the secret name for router ingress
    TP_TLS_CERT_ROUTER: ${GUI_TP_TLS_CERT_ROUTER:-""} # the tls.crt for router ingress
    TP_TLS_KEY_ROUTER: ${GUI_TP_TLS_KEY_ROUTER:-""} # the tls.key for router ingress
    TP_TLS_SECRET_NAME_HYBRID_PROXY: ${GUI_TP_TLS_SECRET_NAME_HYBRID_PROXY:-""} # the secret name for hybrid-proxy ingress
    TP_TLS_CERT_HYBRID_PROXY: ${GUI_TP_TLS_CERT_HYBRID_PROXY:-""} # the tls.crt for hybrid-proxy ingress
    TP_TLS_KEY_HYBRID_PROXY: ${GUI_TP_TLS_KEY_HYBRID_PROXY:-""} # the tls.key for hybrid-proxy ingress

    # CP version see: https://docs.tibco.com/pub/platform-cp/latest/doc/html/Default.htm#Installation/helm-chart-version-matrix.htm
    CP_PLATFORM_TIBCO_CP_BASE_VERSION: ${GUI_CP_PLATFORM_TIBCO_CP_BASE_VERSION:-1.18.0} # use ^1.0.0 for latest
    CP_PLATFORM_INTEGRATION_BW_VERSION: ${GUI_CP_PLATFORM_INTEGRATION_BW_VERSION:-1.18.0} # use ^1.0.0 for latest
    CP_PLATFORM_INTEGRATION_FLOGO_VERSION: ${GUI_CP_PLATFORM_INTEGRATION_FLOGO_VERSION:-1.18.0} # use ^1.0.0 for latest
    CP_PLATFORM_INTEGRATION_SB_VERSION: ${GUI_CP_PLATFORM_INTEGRATION_SB_VERSION:-1.16.0} # use ^1.0.0 for latest
    CP_PLATFORM_TIBCOHUB_VERSION: ${GUI_CP_PLATFORM_TIBCOHUB_VERSION:-1.18.0} # use ^1.0.0 for latest
    CP_PLATFORM_MESSAGING_VERSION: ${GUI_CP_PLATFORM_MESSAGING_VERSION:-1.15.31} # use ^1.0.0 for latest
    CP_PLATFORM_HAWK_VERSION: ${GUI_CP_PLATFORM_HAWK_VERSION:-1.18.12} # use ^1.0.0 for latest
    CP_PLATFORM_EVENTPROCESSING_VERSION: ${GUI_CP_PLATFORM_EVENTPROCESSING_VERSION:-1.17.0} # use ^1.0.0 for latest
    CP_PLATFORM_AI_AGENT_VERSION: ${GUI_CP_PLATFORM_AI_AGENT_VERSION:-"~1.16.0-0"} # use ~1.16.0-0 for latest alpha/stable
    CP_PLATFORM_MCP_HUB_VERSION: ${GUI_CP_PLATFORM_MCP_HUB_VERSION:-"~1.17.0-0"} # use ~1.17.0-0 for latest alpha/stable
    
    # CP AI MCP servers
    TP_AI_ENABLE_CP_MCP_SERVER: ${GUI_TP_AI_ENABLE_CP_MCP_SERVER:-false}
    TP_AI_ENABLE_O11Y_MCP_SERVER: ${GUI_TP_AI_ENABLE_O11Y_MCP_SERVER:-false}
    TP_AI_ENABLE_BW_MCP_SERVER: ${GUI_TP_AI_ENABLE_BW_MCP_SERVER:-false}
    TP_AI_ENABLE_FLOGO_MCP_SERVER: ${GUI_TP_AI_ENABLE_FLOGO_MCP_SERVER:-false}
    TP_AI_ENABLE_MCP_HUB: ${GUI_TP_AI_ENABLE_MCP_HUB:-false}
    CP_MCP_HUB_PERSISTENCE: ${GUI_CP_MCP_HUB_PERSISTENCE:-false}
    CP_ENABLE_AI_AGENT_CONFIG: ${GUI_CP_ENABLE_AI_AGENT_CONFIG:-false}

    # CP AI Agent env
    TP_AI_MCP_TRANSPORT: ${GUI_TP_AI_MCP_TRANSPORT:-"streamable-http"}
    TP_AI_LANGSMITH_TRACING: ${GUI_TP_AI_LANGSMITH_TRACING:-false}
    TP_AI_LANGSMITH_ENDPOINT: ${GUI_TP_AI_LANGSMITH_ENDPOINT:-""}
    TP_AI_LANGSMITH_API_KEY: ${GUI_TP_AI_LANGSMITH_API_KEY:-""}
    TP_AI_LANGSMITH_PROJECT: ${GUI_TP_AI_LANGSMITH_PROJECT:-""}
    TP_AI_LANGFUSE_ENABLED: ${GUI_TP_AI_LANGFUSE_ENABLED:-false}
    TP_AI_LANGFUSE_SECRET_KEY: ${GUI_TP_AI_LANGFUSE_SECRET_KEY:-""}
    TP_AI_LANGFUSE_PUBLIC_KEY: ${GUI_TP_AI_LANGFUSE_PUBLIC_KEY:-""}
    TP_AI_LANGFUSE_HOST: ${GUI_TP_AI_LANGFUSE_HOST:-""}

    # flow control
    CP_VALIDATE_CLUSTER_RESOURCE: ${GUI_CP_VALIDATE_CLUSTER_RESOURCE:-true}
    CP_CREATE_NAMESPACE: ${GUI_CP_CREATE_NAMESPACE:-true}
    CP_INSTALL_MAILDEV: ${GUI_CP_INSTALL_MAILDEV:-true}
    CP_INSTALL_MAILDEV_INGRESS: ${GUI_CP_INSTALL_MAILDEV_INGRESS:-true}
    # Keycloak external IdP (optional; for MCP Hub inbound-VS OAuth, test envs only)
    # Keycloak (optional; test-env IdP). Fixed values (realm mcp-inbound, admin user, DB name/user
    # keycloak/postgres, DCR voucher 10 uses / 30d) are inlined in the chart step below; only the
    # 4 knobs below are overridable.
    CP_INSTALL_KEYCLOAK: ${GUI_CP_INSTALL_KEYCLOAK:-false}
    CP_KEYCLOAK_HOST: ${GUI_CP_KEYCLOAK_HOST:-"keycloak.${CP_DNS_DOMAIN}"}
    CP_KEYCLOAK_ADMIN_PASSWORD: ${GUI_CP_KEYCLOAK_ADMIN_PASSWORD:-"Tibco@123"} # stable so postDeploy admin API works across restarts
    CP_KEYCLOAK_DB_PASSWORD: ${GUI_CP_KEYCLOAK_DB_PASSWORD:-${CP_DB_PASSWORD:-postgres}} # defaults to the CP DB password, else "postgres"
    CP_STORAGE_CREATE_PV: ${GUI_CP_STORAGE_CREATE_PV:-false} # create PV for control-plane-pv for Kind, MicroK8s and Azure use case
    CP_INSTALL_TIBCO_CP_BASE: ${GUI_CP_INSTALL_TIBCO_CP_BASE:-true}
    CP_INSTALL_PLATFORM_TIBCOHUB: ${GUI_CP_INSTALL_PLATFORM_TIBCOHUB:-true}
    CP_INSTALL_PLATFORM_MESSAGING: ${GUI_CP_INSTALL_PLATFORM_MESSAGING:-true}
    CP_INSTALL_PLATFORM_HAWK: ${GUI_CP_INSTALL_PLATFORM_HAWK:-true}
    CP_INSTALL_PLATFORM_INTEGRATION_BW: ${GUI_CP_INSTALL_PLATFORM_INTEGRATION_BW:-true} # Env added after 1.8.0
    CP_INSTALL_PLATFORM_INTEGRATION_FLOGO: ${GUI_CP_INSTALL_PLATFORM_INTEGRATION_FLOGO:-true}
    CP_INSTALL_PLATFORM_INTEGRATION_SB: ${GUI_CP_INSTALL_PLATFORM_INTEGRATION_SB:-false}
    CP_INSTALL_PLATFORM_INTEGRATION_BWCE_UTILITIES: ${GUI_CP_INSTALL_PLATFORM_INTEGRATION_BWCE_UTILITIES:-true}
    CP_INSTALL_PLATFORM_INTEGRATION_BW5CE_UTILITIES: ${GUI_CP_INSTALL_PLATFORM_INTEGRATION_BW5CE_UTILITIES:-true}
    CP_INSTALL_PLATFORM_EVENTPROCESSING: ${GUI_CP_INSTALL_PLATFORM_EVENTPROCESSING:-true}
    CP_INSTALL_PLATFORM_AI_AGENT: ${GUI_CP_INSTALL_PLATFORM_AI_AGENT:-false}
    CP_INSTALL_PLATFORM_MCP_HUB: ${GUI_CP_INSTALL_PLATFORM_MCP_HUB:-false}
  tools:
    yq: "4.40" # this also have the logic to create soft link of yq-4.40 --> yq
preTasks:
- condition: ${CP_VALIDATE_CLUSTER_RESOURCE}
  clusters:
    - name: ${CP_CLUSTER_NAME}
  script:
    ignoreErrors: false
    fileName: script.sh
    content: |
      _STORAGE_CLASS=${CP_STORAGE_CLASS}
      _INGRESS_CLASS=${CP_INGRESS_CLASSNAME}
      _GATEWAY_NAME=${TP_GATEWAY_NAME}
      _BOOTSTRAP_INGRESS_OBJECT=${TP_INGRESS_OBJECT}

      # Function to check if a given k8s object exists
      check_k8s_object_exists() {
          local object_name="$1"
          local target_object_name="$2"

          # Check if a k8s object name is provided. empty value means use default one
          if [[ -z "${target_object_name}" ]]; then
              return 0
          fi

          # Use kubectl to check for the k8s object
          if kubectl get "${object_name}" "${target_object_name}" >/dev/null 2>&1; then
              return 0
          else
              return 1
          fi
      }

      if  ! check_k8s_object_exists "storageclass" "${_STORAGE_CLASS}"; then
        echo "Storage class is set as: ${_STORAGE_CLASS} but not exist"
        exit 1
      fi

      if [[ "${_BOOTSTRAP_INGRESS_OBJECT}" == "gateway" ]]; then
        # Check for Gateway in ingress-system first, then istio-system
        if kubectl get gateway "${_GATEWAY_NAME}" -n "${CP_INGRESS_NAMESPACE}" >/dev/null 2>&1; then
          echo "Gateway ${_GATEWAY_NAME} found in namespace ${CP_INGRESS_NAMESPACE}"
        elif kubectl get gateway "${_GATEWAY_NAME}" -n "istio-system" >/dev/null 2>&1; then
          echo "Gateway ${_GATEWAY_NAME} found in namespace istio-system"
        else
          echo "Gateway is selected but Gateway ${_GATEWAY_NAME} does not exist in namespaces: ${CP_INGRESS_NAMESPACE} or istio-system"
          exit 1
        fi
      else
        if  ! check_k8s_object_exists "ingressclass" "${_INGRESS_CLASS}"; then
          echo "Ingress is selected but IngressClass is set as: ${_INGRESS_CLASS} and does not exist"
          exit 1
        fi
      fi
- condition: ${CP_CREATE_NAMESPACE}
  clusters:
    - name: ${CP_CLUSTER_NAME}
  script:
    ignoreErrors: false
    fileName: script.sh
    content: |
      # namespace
      kubectl apply -f - <<EOF
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ${CP_NAMESPACE}
        labels:
          app.cloud.tibco.com/content: tibco-core
          platform.tibco.com/controlplane-instance-id: ${CP_INSTANCE_ID}
      EOF

      # service account
      kubectl create -n ${CP_NAMESPACE} serviceaccount ${CP_INSTANCE_ID}-sa
      
      # create TP TLS secret if provided
      if [[ -n "${TP_TLS_CERT}" ]]; then
        kubectl apply -f - <<EOF
      apiVersion: v1
      kind: Secret
      metadata:
        name: ${TP_GENERATE_CERTIFICATE_NAME}
        namespace: ${CP_NAMESPACE}
      type: kubernetes.io/tls
      data:
        tls.crt: ${TP_TLS_CERT}
        tls.key: ${TP_TLS_KEY}
      EOF
      fi

      # create TP TLS secret for router if provided
      if [[ -n "${TP_TLS_CERT_ROUTER}" ]]; then
        kubectl apply -f - <<EOF
      apiVersion: v1
      kind: Secret
      metadata:
        name: ${TP_TLS_SECRET_NAME_ROUTER}
        namespace: ${CP_NAMESPACE}
      type: kubernetes.io/tls
      data:
        tls.crt: ${TP_TLS_CERT_ROUTER}
        tls.key: ${TP_TLS_KEY_ROUTER}
      EOF
      fi

      # create TP TLS secret for hybrid proxy if provided
      if [[ -n "${TP_TLS_CERT_HYBRID_PROXY}" ]]; then
        kubectl apply -f - <<EOF
      apiVersion: v1
      kind: Secret
      metadata:
        name: ${TP_TLS_SECRET_NAME_HYBRID_PROXY}
        namespace: ${CP_NAMESPACE}
      type: kubernetes.io/tls
      data:
        tls.crt: ${TP_TLS_CERT_HYBRID_PROXY}
        tls.key: ${TP_TLS_KEY_HYBRID_PROXY}
      EOF
      fi

      # add label to ext namespace
      kubectl apply -f - <<EOF
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ${CP_EXT_NAMESPACE}
        labels:
          networking.platform.tibco.com/non-cp-ns: enable
      EOF
      
      # create TP TLS secret if provided
      if [[ -n "${TP_TLS_CERT}" ]]; then
        kubectl apply -f - <<EOF
      apiVersion: v1
      kind: Secret
      metadata:
        name: ${TP_GENERATE_CERTIFICATE_NAME}
        namespace: ${CP_EXT_NAMESPACE}
      type: kubernetes.io/tls
      data:
        tls.crt: ${TP_TLS_CERT}
        tls.key: ${TP_TLS_KEY}
      EOF
      fi
helmCharts:
- name: generic-chart # CP certificate object helm chart
  version: 1.1.0
  condition: ${TP_GENERATE_CERTIFICATES}
  namespace: ${CP_NAMESPACE}
  releaseName: tp-certificate
  repo:
    helm:
      url: https://test-server.github.yyzd.me
  cluster:
    names:
      - ${CP_CLUSTER_NAME}
  values:
    keepPrevious: true
    content: |
      certificate:
        enabled: ${TP_GENERATE_CERTIFICATES}
        name: ${TP_GENERATE_CERTIFICATE_NAME}
        spec:
          secretName: ${TP_GENERATE_CERTIFICATE_NAME}
          issuerRef:
            name: ${TP_CERTIFICATE_CLUSTER_ISSUER}
            kind: ClusterIssuer
          dnsNames:
            - '*.${CP_SERVICE_DNS_DOMAIN}'
            - '*.${CP_TUNNEL_DNS_DOMAIN}'
  flags:
    createNamespace: ${CP_CREATE_NAMESPACE}
    timeout: 1h
- name: generic-chart # CP pv object helm chart
  version: 1.1.0
  condition: ${CP_STORAGE_CREATE_PV}
  namespace: ${CP_NAMESPACE}
  releaseName: cp-storage-pv
  repo:
    helm:
      url: https://test-server.github.yyzd.me
  cluster:
    names:
      - ${CP_CLUSTER_NAME}
  values:
    keepPrevious: true
    content: |
      pv:
        enabled: ${CP_STORAGE_CREATE_PV}
        name: ${CP_STORAGE_PV_NAME}
        spec:
          accessModes:
          - ReadWriteMany
          capacity:
            storage: ${CP_STORAGE_PV_SIZE}
          hostPath:
            path: /private/tibco/cp/${CP_STORAGE_PV_NAME}/k8s/volumes/core
            type: DirectoryOrCreate
          persistentVolumeReclaimPolicy: Retain
          volumeMode: Filesystem
          storageClassName: ${CP_STORAGE_CLASS}
  flags:
    createNamespace: ${CP_CREATE_NAMESPACE}
    timeout: 1h
- name: generic-chart # maildev helm chart
  version: 1.6.0
  condition: ${CP_INSTALL_MAILDEV}
  namespace: ${CP_EXT_NAMESPACE}
  releaseName: maildev
  repo:
    helm:
      url: https://test-server.github.yyzd.me
  cluster:
    names:
      - ${CP_CLUSTER_NAME}
  values:
    keepPrevious: true
    content: |
      deployment:
        enabled: true
        image:
          repository: maildev/maildev
          tag: latest
        args: ["-s", "1025", "-w", "1080"]
        ports:
          http:
            enabled: true
            protocol: TCP
            containerPort: 1080
        podLabels:
          app: maildev
      service:
        enabled: true
        name: ${CP_MAIL_MAILDEV_SERVICE_NAME}
        ports:
          http:
            enabled: true
            protocol: TCP
            containerPort: 1080
            servicePort: 1080
          smtp:
            enabled: true
            protocol: TCP
            containerPort: 1025
            servicePort: 1025
      ingress:
        enabled: ${CP_BOOTSTRAP_INGRESS_ROUTER_INGRESS_ENABLED}
        labels:
          app.cloud.tibco.com/created-by: pipeline
        annotations:
          nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
        spec:
          ingressClassName: ${CP_INGRESS_CLASSNAME}
          tls:
          - hosts:
            - '*.${CP_DNS_DOMAIN}'
            secretName: ${TP_GENERATE_CERTIFICATE_NAME}
          rules:
            - host: 'mail.${CP_DNS_DOMAIN}'
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${CP_MAIL_MAILDEV_SERVICE_NAME}
                        port:
                          number: 1080
      httpRoutes:
        mail:
          enabled: ${CP_BOOTSTRAP_INGRESS_ROUTER_GATEWAY_ENABLED}
          name: maildev-generic-chart
          labels:
            app.cloud.tibco.com/created-by: pipeline
          spec:
            parentRefs:
            - name: ${TP_GATEWAY_NAME}
              namespace: ${CP_INGRESS_NAMESPACE}
            hostnames:
            - "mail.${CP_DNS_DOMAIN}"
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /
              backendRefs:
              - name: ${CP_MAIL_MAILDEV_SERVICE_NAME}
                port: 1080
  flags:
    createNamespace: true
    timeout: 1h
- name: tibco-cp-base
  version: ${CP_PLATFORM_TIBCO_CP_BASE_VERSION}
  condition: ${CP_INSTALL_TIBCO_CP_BASE}
  repo:
    helm:
      url: ${CP_CHART_REPO}
      username: "${CP_CHART_REPO_USER_NAME}"
      password: "${CP_CHART_REPO_TOKEN}"
  values:
    keepPrevious: false
    content: |
      global:
        tibco:
          logging:
            fluentbit:
              enabled: ${CP_LOG_ENABLE} # set to true to enable fluentbit for CP
          containerRegistry:
            url: ${CP_CONTAINER_REGISTRY}
            password: "${CP_CONTAINER_REGISTRY_PASSWORD}"
            username: "${CP_CONTAINER_REGISTRY_USERNAME}"
            repository: "${CP_CONTAINER_REGISTRY_REPOSITORY}"
          controlPlaneInstanceId: ${CP_INSTANCE_ID}
          serviceAccount: ${CP_INSTANCE_ID}-sa
          createNetworkPolicy: ${TP_CREATE_NETWORK_POLICIES}
          enableResourceConstraints: ${CP_GLOBAL_ENABLE_RESOURCE_CONSTRAINTS}
          manageDbSchema: ${CP_MANAGE_DB_SCHEMA}
          db_ssl_root_cert_secretname: "${CP_DB_SSL_ROOT_CERT_SECRET_NAME}"
          db_ssl_root_cert_filename: "${CP_DB_SSL_ROOT_CERT_FILENAME}"
          # Enable or disable hybrid connectivity
          hybridConnectivity:
            enabled: ${CP_ENABLE_HYBRID_CONNECTIVITY}
          helm:
            url: "${DP_CHART_REPO_HOST}"
            repo: "${DP_CHART_REPO_PATH}"
            username: "${DP_CHART_REPO_USER_NAME}"
            password: "${DP_CHART_REPO_TOKEN}"
        cp:
          deleteDBOnUninstall: "${CP_DB_DELETE_ON_UNINSTALL}"
          enableResourceConstraints: ${CP_GLOBAL_ENABLE_RESOURCE_CONSTRAINTS}
        external:
          cpEncryptionSecretName: "${CP_ENCRYPTION_SECRET_NAME}"
          cpEncryptionSecretKey: "${CP_ENCRYPTION_SECRET_KEY}"
          clusterInfo:
            nodeCIDR: ${TP_CLUSTER_NODE_CIDR}
            podCIDR: ${TP_CLUSTER_POD_CIDR}
            serviceCIDR: ${TP_CLUSTER_SERVICE_CIDR}
          dnsDomain: ${CP_SERVICE_DNS_DOMAIN}
          dnsTunnelDomain: ${CP_TUNNEL_DNS_DOMAIN}
          storage:
            resources:
              requests:
                storage: ${CP_STORAGE_PV_SIZE}
            storageClassName: ${CP_STORAGE_CLASS}
          auditserver:
            endpoint: "${CP_AUDITSERVER_ENDPOINT}" # optional auditserver endpoint, if you have ELK stack or other logging solution
            username: "${CP_AUDITSERVER_USERNAME}" # optional auditserver username
            password: "${CP_AUDITSERVER_PASSWORD}" # optional auditserver password
            index: "${CP_AUDITSERVER_INDEX}" # optional auditserver index, default is audittrail
          logserver:
            endpoint: "${CP_LOG_ENDPOINT}" # optional logserver endpoint, if you have ELK stack or other logging solution
            username: "${CP_LOG_USERNAME}" # optional logserver username
            password: "${CP_LOG_PASSWORD}" # optional logserver password
            index: "${CP_LOG_INDEX}" # optional logserver index
          environment: ${CP_EXTERNAL_ENVIRONMENT}
          db_host: ${CP_DB_HOST}
          db_name: ${CP_DB_NAME}
          db_password: ${CP_DB_PASSWORD}
          db_port: "${CP_DB_PORT}"
          db_secret_name: ${CP_DB_SECRET_NAME}
          db_ssl_mode: ${CP_DB_SSL_MODE}
          db_username: ${CP_DB_USER_NAME}
          # start - email server configuration is removed from this chart since 1.18.0. 
          emailServerType: ${CP_MAIL_SERVER_TYPE}
          emailServer:
            ses:
              arn: "${CP_MAIL_SERVER_SES_ARN}"
            sendgrid:
              apiKey: "${CP_MAIL_SERVER_SENDGRID_API_KEY}"
            smtp:
              server: ${CP_MAIL_SERVER_ADDRESS}
              port: "${CP_MAIL_SERVER_PORT_NUMBER}"
              username: "${CP_MAIL_SERVER_USERNAME}"
              password: "${CP_MAIL_SERVER_PASSWORD}"
            graph:
              clientDetailsSecretName: ${CP_MAIL_SERVER_GRAPH_CLIENT_DETAILS_SECRET_NAME}
              skipSentFolder: ${CP_MAIL_SERVER_GRAPH_SKIP_SENT_FOLDER}
          fromAndReplyToEmailAddress: "${CP_FROM_REPLY_TO_EMAIL}"
          # end
          adminInitialPassword: "${CP_ADMIN_PASSWORD}"
          enable_api_based_initialization: ${CP_ENABLE_API_BASED_INITIALIZATION}
          admin:
            email: ${CP_ADMIN_EMAIL}
            firstname: "admin"
            lastname: "admin"
            customerID: "myCustomerID"
          enableLogging: false
          IDENTITY_MANAGEMENT_JWT_KEY_STORE_PASSWORD: "${CP_IDM_IDENTITY_MANAGEMENT_JWT_KEY_STORE_PASSWORD}"
      hybrid-proxy:
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ingress:
          enabled: ${CP_BOOTSTRAP_INGRESS_HYBRID_PROXY_INGRESS_ENABLED}
          annotations:
            external-dns.alpha.kubernetes.io/hostname: "*.${CP_TUNNEL_DNS_DOMAIN}"
            nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
          ingressClassName: ${CP_INGRESS_CLASSNAME}
          hosts:
            - host: '*.${CP_TUNNEL_DNS_DOMAIN}'
              paths:
                - path: /
                  pathType: Prefix
                  port: 105
        gatewayRoute:
          enabled: ${CP_BOOTSTRAP_INGRESS_HYBRID_PROXY_GATEWAY_ENABLED}
          parentRefs:
            - name: ${TP_GATEWAY_NAME}
              namespace: ${CP_INGRESS_NAMESPACE}
          hostnames:
            - '*.${CP_TUNNEL_DNS_DOMAIN}'
          annotations:
            external-dns.alpha.kubernetes.io/hostname: "*.${CP_TUNNEL_DNS_DOMAIN}"
      router-operator:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ingress:
          enabled: ${CP_BOOTSTRAP_INGRESS_ROUTER_INGRESS_ENABLED}
          annotations:
            external-dns.alpha.kubernetes.io/hostname: "*.${CP_SERVICE_DNS_DOMAIN}"
            nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
            nginx.ingress.kubernetes.io/proxy-body-size: 200m # set to 200m to allow large file upload PCP-7954
          ingressClassName: ${CP_INGRESS_CLASSNAME}
          hosts:
            - host: '*.${CP_SERVICE_DNS_DOMAIN}'
              paths:
                - path: /
                  pathType: Prefix
                  port: 100
        gatewayRoute:
          enabled: ${CP_BOOTSTRAP_INGRESS_ROUTER_GATEWAY_ENABLED}
          parentRefs:
            - name: ${TP_GATEWAY_NAME}
              namespace: ${CP_INGRESS_NAMESPACE}
          hostnames:
            - '*.${CP_SERVICE_DNS_DOMAIN}'
          annotations:
            external-dns.alpha.kubernetes.io/hostname: "*.${CP_SERVICE_DNS_DOMAIN}"
      resource-set-operator:
        resources:
          requests:
            cpu: ${CP_RESOURCES_REQUEST_CPU}
            memory: ${CP_RESOURCES_REQUEST_MEMORY}
          limits:
            cpu: 500m
            memory: 512Mi
      otel-collector:
        enabled: ${CP_LOG_ENABLE}
        autoscaling:
          maxReplicas: 1
      tp-cp-infra:
        resources:
          infra-compute-services:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      tp-cp-core:
        # --- light tier: stateless/lightweight services, use CP_RESOURCES_REQUEST_* variable ---
        cronjobs:
          replicaCount: 1
          cpcronjobservice:
            resources:
              requests:
                cpu: ${CP_RESOURCES_REQUEST_CPU}
                memory: ${CP_RESOURCES_REQUEST_MEMORY}
        identity-provider:
          replicaCount: 1
          tpcpidpservice:
            resources:
              requests:
                cpu: ${CP_RESOURCES_REQUEST_CPU}
                memory: ${CP_RESOURCES_REQUEST_MEMORY}
              limits:
                cpu: 200m
                memory: 256Mi
        # --- heavy tier: Java/core services with high baseline memory, hard-coded for stability ---
        identity-management:
          replicaCount: 1
          idm:
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                cpu: 500m
                memory: 1024Mi
        orchestrator:
          replicaCount: 1
          cporchservice:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 300m
                memory: 512Mi
        pengine:
          replicaCount: 1
          tpcppengineservice:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
        user-subscriptions:
          replicaCount: 1
          cpusersubservice:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 300m
                memory: 512Mi
        web-server:
          replicaCount: 1
          cpwebserver:
            aiAgent:
              enabled: ${CP_ENABLE_AI_AGENT_CONFIG}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 300m
                memory: 512Mi
          cpmcpserver:
            enabled: ${TP_AI_ENABLE_CP_MCP_SERVER}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 200m
                memory: 512Mi
          mcpHub:
            enabled: ${TP_AI_ENABLE_MCP_HUB}
      tp-cp-o11y:
        autoscaling:
          maxReplicas: 1
        o11ymcpserver:
          enabled: ${TP_AI_ENABLE_O11Y_MCP_SERVER}
      tp-cp-prometheus:
        server:
          retention: "3d"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
      tp-cp-auditsafe:
        autoscaling:
          maxReplicas: 1
        auditsafe:
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      tp-cp-integration-common:
        fileserver:
          hpa:
            maxReplicas: 1
      tp-cp-core-finops:
        monitoring-service:
          replicaCount: "1"
          monitoringservice:
            resources:
              requests:
                cpu: ${CP_RESOURCES_REQUEST_CPU}
                memory: ${CP_RESOURCES_REQUEST_MEMORY}
  cluster:
    names:
      - ${CP_CLUSTER_NAME}
  releaseName: platform-base
  namespace: ${CP_NAMESPACE}
  flags:
    wait: true
    timeout: 1h
    createNamespace: ${CP_CREATE_NAMESPACE}
    extra: "--values tls_values.yaml --values tls_router_values.yaml --values tls_hybrid_proxy_values.yaml --values volume_values.yaml --values log_values.yaml"
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        # optional chart values fields
        touch tls_values.yaml
        if [[ -n "${TP_TLS_CERT}" || "${TP_GENERATE_CERTIFICATES}" == "true" ]]; then
          export _star_service_dns="'*.${CP_SERVICE_DNS_DOMAIN}'"
          export _star_tunnel_dns="'*.${CP_TUNNEL_DNS_DOMAIN}'"
          export _tp_generate_certificate_name="${TP_GENERATE_CERTIFICATE_NAME}"
          yq eval '
            (.router-operator.ingress.tls[0].secretName = env(_tp_generate_certificate_name)) |
            (.router-operator.ingress.tls[0].hosts[0] = env(_star_service_dns)) |
            (.router-operator.ingress.tls[0].hosts[0] style="single") |
            (.hybrid-proxy.ingress.tls[0].secretName = env(_tp_generate_certificate_name)) |
            (.hybrid-proxy.ingress.tls[0].hosts[0] = env(_star_tunnel_dns)) |
            (.hybrid-proxy.ingress.tls[0].hosts[0] style="single")
            ' tls_values.yaml > tls_values.yaml
          
          echo "TLS values:"
          cat tls_values.yaml
        fi
        touch tls_router_values.yaml
        if [[ -n "${TP_TLS_SECRET_NAME_ROUTER}" ]]; then
          export _star_service_dns="'*.${CP_SERVICE_DNS_DOMAIN}'"
          export _tp_router_certificate_name="${TP_TLS_SECRET_NAME_ROUTER}"
          yq eval '
            (.router-operator.ingress.tls[0].secretName = env(_tp_router_certificate_name)) |
            (.router-operator.ingress.tls[0].hosts[0] = env(_star_service_dns)) |
            (.router-operator.ingress.tls[0].hosts[0] style="single")
            ' tls_router_values.yaml > tls_router_values.yaml
          
          echo "TLS Router values:"
          cat tls_router_values.yaml
        fi
        touch tls_hybrid_proxy_values.yaml
        if [[ -n "${TP_TLS_SECRET_NAME_HYBRID_PROXY}" ]]; then
          export _star_tunnel_dns="'*.${CP_TUNNEL_DNS_DOMAIN}'"
          export _tp_hybrid_proxy_certificate_name="${TP_TLS_SECRET_NAME_HYBRID_PROXY}"
          yq eval '
            (.hybrid-proxy.ingress.tls[0].secretName = env(_tp_hybrid_proxy_certificate_name)) |
            (.hybrid-proxy.ingress.tls[0].hosts[0] = env(_star_tunnel_dns)) |
            (.hybrid-proxy.ingress.tls[0].hosts[0] style="single")
            ' tls_hybrid_proxy_values.yaml > tls_hybrid_proxy_values.yaml
          
          echo "TLS Hybrid Proxy values:"
          cat tls_hybrid_proxy_values.yaml
        fi
        touch volume_values.yaml
        if [[ "${CP_STORAGE_PV_NAME}" != "" ]]; then
          yq eval '.global.external.storage.volumeName = env(CP_STORAGE_PV_NAME)' volume_values.yaml > volume_values.yaml
          echo "Volume values:"
          cat volume_values.yaml
        fi
        
        if [[ "${CP_STORAGE_PVC_NAME}" != "" ]]; then
          yq eval '.global.external.storage.pvcName = env(CP_STORAGE_PVC_NAME)' volume_values.yaml > volume_values.yaml
          echo "PVC values:"
          cat volume_values.yaml
        fi
        touch log_values.yaml
        if [[ "${CP_LOG_ENABLE}" == "true" && -z "${CP_LOG_PASSWORD}" ]]; then
          # update es logging password
          export HOOK_CP_LOG_PASSWORD=$(kubectl get secret -n ${CP_ES_NAMESPACE} dp-config-es-es-elastic-user -o=jsonpath='{.data.elastic}' 2>/dev/null | base64 --decode)
          if [[ -n "${HOOK_CP_LOG_PASSWORD}" ]]; then
            yq eval '.global.external.logserver.password = env(HOOK_CP_LOG_PASSWORD)' log_values.yaml > log_values.tmp.yaml
          else
            echo "Log server password not found, please set it in the recipe"
            echo "disable otel-collector"
            yq eval '.otel-collector.enabled = false' log_values.yaml > log_values.tmp.yaml
          fi
          mv log_values.tmp.yaml log_values.yaml
          echo "Log values:"
          cat log_values.yaml
        fi
        TSC_SESSION_KEY=$(kubectl get tibcoclusterenv ops.tsc.session.key -n $CP_NAMESPACE -o jsonpath='{.spec.value}')
        DOMAIN_SESSION_KEY=$(kubectl get tibcoclusterenv ops.domain.session.key -n $CP_NAMESPACE -o jsonpath='{.spec.value}')
        if [[ -n "${TSC_SESSION_KEY}" && -n "${DOMAIN_SESSION_KEY}" ]]; then
          if kubectl get secret -n $CP_NAMESPACE session-keys --ignore-not-found | grep -q session-keys; then
            echo "session-keys secret already exists, not creating a new one"
          else
            echo "Found session keys in tibcoclusterenv, creating session-keys secret using existing tibcoclusterenv values"
            kubectl create secret -n $CP_NAMESPACE generic session-keys --from-literal=TSC_SESSION_KEY=$TSC_SESSION_KEY --from-literal=DOMAIN_SESSION_KEY=$DOMAIN_SESSION_KEY
          fi
        else
          if kubectl get secret -n $CP_NAMESPACE session-keys --ignore-not-found | grep -q session-keys; then
            echo "session-keys secret already exists, not creating a new one"
          else
            echo "session-keys secret not found, creating a new one using random values"
            kubectl create secret -n $CP_NAMESPACE generic session-keys --from-literal=TSC_SESSION_KEY=$(openssl rand -base64 48 | tr -dc A-Za-z0-9 | head -c32) --from-literal=DOMAIN_SESSION_KEY=$(openssl rand -base64 48 | tr -dc A-Za-z0-9 | head -c32)
          fi
        fi
        if kubectl get secret -n $CP_NAMESPACE $CP_ENCRYPTION_SECRET_NAME --ignore-not-found | grep -q $CP_ENCRYPTION_SECRET_NAME; then
          echo "$CP_ENCRYPTION_SECRET_NAME secret already exists, not creating a new one"
          echo "Annotating the secret with helm.sh/resource-policy=keep so that it doesn't get deleted by helm upgrade"
          kubectl annotate secret $CP_ENCRYPTION_SECRET_NAME helm.sh/resource-policy=keep --overwrite -n $CP_NAMESPACE
        else
          echo "CP_ENCRYPTION_SECRET_NAME secret not found, Creating a new secret with random value"
          kubectl create secret -n $CP_NAMESPACE generic $CP_ENCRYPTION_SECRET_NAME --from-literal=$CP_ENCRYPTION_SECRET_KEY=$(openssl rand -base64 48 | tr -dc A-Za-z0-9 | head -c44)
        fi
