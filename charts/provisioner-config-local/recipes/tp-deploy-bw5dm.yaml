apiVersion: v1
kind: helm-install
meta:
  guiEnv:
    note: "deploy-bw5dm"

    # chart repo
    GUI_BW5_CHART_REPO: "https://csgprdusw2reposaas.jfrog.io/artifactory/api/helm/tibco-platform-helm-dev-github"
    GUI_BW5_CHART_REPO_USER_NAME: "tibco-platform-devops-read"
    GUI_BW5_CHART_REPO_TOKEN: ""

    # container registry
    GUI_BW5_CONTAINER_REGISTRY: "csgprdusw2reposaas.jfrog.io"
    GUI_BW5_CONTAINER_REGISTRY_REPOSITORY: "tibco-platform-docker-dev"
    GUI_BW5_CONTAINER_REGISTRY_USERNAME: ""
    GUI_BW5_CONTAINER_REGISTRY_PASSWORD: ""

    # env
    GUI_TP_CLUSTER_NAME: "on-prem"
    # TP activation license file
    GUI_TP_ACTIVATION_ZIP_FILE_BASE64: ""
    # ingress
    GUI_TP_INGRESS_OBJECT: "ingress"
    GUI_TP_INGRESS_CLASS: "traefik"
    GUI_TP_GATEWAY_NAME: "nginx-gateway"
    GUI_TP_INGRESS_GATEWAY_NAMESPACE: "ingress-system"
    GUI_TP_CP_DNS_DOMAIN: "localhost.dataplanes.pro"

    # BW5DM
    GUI_BW5_CHART_VERSION: "^1.2.0"
    GUI_TP_BWDM_NAMESPACE: "bw5dm"
    GUI_TP_BWDM_RELEASE_NAME: "bw5dm"
    GUI_TP_BW5_APP_NAME: "RestSample" # another embedded app is "SoapSample"
    GUI_TP_ENABLE_OTEL_TRACES: true
    GUI_TP_OTEL_TRACES_ENDPOINT: "http://otel-userapp-traces.k8s-auto-bmdp1ns.svc:4318/v1/traces"
    GUI_TP_ENABLE_OTEL_METRICS: true
    GUI_TP_OTEL_METRICS_ENDPOINT: "http://otel-userapp-metrics.k8s-auto-bmdp1ns.svc:4318/v1/metrics"
    GUI_TP_ENABLE_OTEL_LOGS: true
    GUI_TP_OTEL_LOGS_ENDPOINT: "http://otel-userapp-logs.k8s-auto-bmdp1ns.svc:4318/v1/logs"

    # image tag
    GUI_TP_BMDP_IMAGE_TAG_BW5EMSDM: ""
    GUI_TP_BMDP_IMAGE_TAG_BW5RVDM: ""
    GUI_TP_BMDP_IMAGE_TAG_HAWKCONSOLE: ""
    GUI_TP_BMDP_IMAGE_TAG_BW6DM: ""
    GUI_TP_BMDP_IMAGE_TAG_EMS: ""

    # flow control
    GUI_TP_DEPLOY_RVDM: true
    GUI_TP_DEPLOY_EMS_SERVER: true
    GUI_TP_DEPLOY_EMSDM: true
    GUI_TP_DEPLOY_HAWKCONSOLE: false
    GUI_TP_DEPLOY_BW6DM: true
    GUI_PIPELINE_LOG_DEBUG: false
  globalEnvVariable:
    REPLACE_RECIPE: true
    PIPELINE_LOG_DEBUG: ${GUI_PIPELINE_LOG_DEBUG:-false}
    PIPELINE_CHECK_DOCKER_STATUS: false

    # github
    TP_CHART_REPO: ${GUI_BW5_CHART_REPO:-"https://csgprdusw2reposaas.jfrog.io/artifactory/api/helm/tibco-platform-helm-dev-github"}
    TP_CHART_REPO_USER_NAME: ${GUI_BW5_CHART_REPO_USER_NAME}
    TP_CHART_REPO_TOKEN: ${GUI_BW5_CHART_REPO_TOKEN}

    # container registry
    TP_CONTAINER_REGISTRY: ${GUI_BW5_CONTAINER_REGISTRY:-"csgprduswrepoedge.jfrog.io"}
    TP_CONTAINER_REGISTRY_REPOSITORY: ${GUI_BW5_CONTAINER_REGISTRY_REPOSITORY:-"tibco-platform-docker-dev"}
    TP_CONTAINER_REGISTRY_USERNAME: "${GUI_BW5_CONTAINER_REGISTRY_USERNAME}"
    TP_CONTAINER_REGISTRY_PASSWORD: "${GUI_BW5_CONTAINER_REGISTRY_PASSWORD}"

    TP_CLUSTER_NAME: ${GUI_TP_CLUSTER_NAME:-"on-prem"}

    # ingress
    TP_INGRESS_OBJECT: ${GUI_TP_INGRESS_OBJECT:-"ingress"}
    TP_INGRESS_CLASS: ${GUI_TP_INGRESS_CLASS:-"traefik"}
    TP_GATEWAY_NAME: ${GUI_TP_GATEWAY_NAME:-"nginx-gateway"}
    TP_INGRESS_GATEWAY_NAMESPACE: ${GUI_TP_INGRESS_GATEWAY_NAMESPACE:-"ingress-system"}
    TP_DNS_DOMAIN: ${GUI_TP_CP_DNS_DOMAIN:-"localhost.dataplanes.pro"}

    # BW5DM
    BW5_CHART_VERSION: ${GUI_BW5_CHART_VERSION:-"^1.2.0"}
    TP_BWDM_NAMESPACE: ${GUI_TP_BWDM_NAMESPACE:-bw5dm}
    TP_BWDM_RELEASE_NAME: ${GUI_TP_BWDM_RELEASE_NAME:-bw5dm}
    TP_BW5_APP_NAME: ${GUI_TP_BW5_APP_NAME:-"RestSample"}
    TP_OTEL_TRACES_ENDPOINT: ${GUI_TP_OTEL_TRACES_ENDPOINT:-"http://otel-userapp-traces.k8s-auto-bmdp1ns.svc:4318/v1/traces"}
    TP_OTEL_METRICS_ENDPOINT: ${GUI_TP_OTEL_METRICS_ENDPOINT:-"http://otel-userapp-metrics.k8s-auto-bmdp1ns.svc:4318/v1/metrics"}
    TP_OTEL_LOGS_ENDPOINT: ${GUI_TP_OTEL_LOGS_ENDPOINT:-"http://otel-userapp-logs.k8s-auto-bmdp1ns.svc:4318/v1/logs"}

    # TP activation license file
    TP_ACTIVATION_ZIP_FILE_BASE64: ${GUI_TP_ACTIVATION_ZIP_FILE_BASE64:-""}

    # image tag
    TP_BMDP_IMAGE_TAG_BW5EMSDM: ${GUI_TP_BMDP_IMAGE_TAG_BW5EMSDM:-"emsdm-latest"}
    TP_BMDP_IMAGE_TAG_BW5RVDM: ${GUI_TP_BMDP_IMAGE_TAG_BW5RVDM:-"rvdm-latest"}
    TP_BMDP_IMAGE_TAG_BW6DM: ${GUI_TP_BMDP_IMAGE_TAG_BW6DM:-"bw6-latest"}
    TP_BMDP_IMAGE_TAG_EMS: ${GUI_TP_BMDP_IMAGE_TAG_EMS:-"ems-latest"}
    TP_BMDP_IMAGE_TAG_HAWKCONSOLE: ${GUI_TP_BMDP_IMAGE_TAG_HAWKCONSOLE:-"hawkconsole-latest"}

    # flow control
    TP_DEPLOY_RVDM: ${GUI_TP_DEPLOY_RVDM:-true}
    TP_DEPLOY_EMS_SERVER: ${GUI_TP_DEPLOY_EMS_SERVER:-true}
    TP_DEPLOY_EMSDM: ${GUI_TP_DEPLOY_EMSDM:-true}
    TP_DEPLOY_HAWKCONSOLE: ${GUI_TP_DEPLOY_HAWKCONSOLE:-true}
    TP_DEPLOY_BW6DM: ${GUI_TP_DEPLOY_BW6DM:-true}
    TP_ENABLE_OTEL_LOGS: ${GUI_TP_ENABLE_OTEL_LOGS:-true}
    TP_ENABLE_OTEL_METRICS: ${GUI_TP_ENABLE_OTEL_METRICS:-true}
    TP_ENABLE_OTEL_TRACES: ${GUI_TP_ENABLE_OTEL_TRACES:-true}
  tools:
    yq: "4.40"
helmCharts:
  - name: bw5-test
    condition: true
    version: ${BW5_CHART_VERSION}
    namespace: ${TP_BWDM_NAMESPACE}
    releaseName: ${TP_BWDM_RELEASE_NAME}
    repo:
      helm:
        url: ${TP_CHART_REPO}
        username: "${TP_CHART_REPO_USER_NAME}"
        password: "${TP_CHART_REPO_TOKEN}"
    values:
      keepPrevious: true
      content: |
        global:
          containerRegistry: "${TP_CONTAINER_REGISTRY}"
          containerRegistryUsername: "${TP_CONTAINER_REGISTRY_USERNAME}"
          containerRegistryPassword: "${TP_CONTAINER_REGISTRY_PASSWORD}"
          ingressClassName: ${TP_INGRESS_CLASS}
          ingressObject: ${TP_INGRESS_OBJECT}
          gatewayName: ${TP_GATEWAY_NAME}
          gatewayNamespace: ${TP_INGRESS_GATEWAY_NAMESPACE}
          tpDNSDomainName: ${TP_DNS_DOMAIN}
        secret:
          enabled: true
        ems-server:
          enabled: ${TP_DEPLOY_EMS_SERVER}
          deployment:
            image:
              repository: "${TP_CONTAINER_REGISTRY}/${TP_CONTAINER_REGISTRY_REPOSITORY}/bw5-test"
              tag: "${TP_BMDP_IMAGE_TAG_EMS}"
            volumeMounts:
              - name: license-secret
                mountPath: /opt/tibco/license-file.bin
                subPath: license-file.bin
                readOnly: true
            volumes:
              - name: license-secret
                secret:
                  secretName: activation-file-secret
                  optional: true
        bw5emsdm:
          enabled: ${TP_DEPLOY_EMSDM}
          deployment:
            image:
              repository: "${TP_CONTAINER_REGISTRY}/${TP_CONTAINER_REGISTRY_REPOSITORY}/bw5-test"
              tag: "${TP_BMDP_IMAGE_TAG_BW5EMSDM}"
            env:
              - name: ENABLE_OTEL_TRACES
                value: "${TP_ENABLE_OTEL_TRACES}"
              - name: OTEL_TRACES_ENDPOINT
                value: "${TP_OTEL_TRACES_ENDPOINT}"
              - name: ENABLE_OTEL_METRICS
                value: "${TP_ENABLE_OTEL_METRICS}"
              - name: OTEL_METRICS_ENDPOINT
                value: "${TP_OTEL_METRICS_ENDPOINT}"
              - name: ENABLE_OTEL_LOGS
                value: "${TP_ENABLE_OTEL_LOGS}"
              - name: OTEL_LOGS_ENDPOINT
                value: "${TP_OTEL_LOGS_ENDPOINT}"
              # Use the ems-server above by default, if you want to use a different one, set info below
              # - name: EMS_URL
              #   value: "tcp://newemsserver:7222"
              # - name: EMS_USER
              #   value: "admin"
              # - name: EMS_PASSWORD
              #   value: "abc"
            volumeMounts:
              - name: license-secret
                mountPath: /opt/tibco/license-file.bin
                subPath: license-file.bin
                readOnly: true
            volumes:
              - name: license-secret
                secret:
                  secretName: activation-file-secret
                  optional: true
          service:
            ports:
              restapp:
                enabled: true
                containerPort: 5678
                servicePort: 5678
                protocol: TCP
              soapapp:
                enabled: true
                containerPort: 7865
                servicePort: 7865
                protocol: TCP
        bw5rvdm:
          enabled: ${TP_DEPLOY_RVDM}
          deployment:
            image:
              repository: "${TP_CONTAINER_REGISTRY}/${TP_CONTAINER_REGISTRY_REPOSITORY}/bw5-test"
              tag: "${TP_BMDP_IMAGE_TAG_BW5RVDM}"
            env:
              - name: ENABLE_OTEL_TRACES
                value: "${TP_ENABLE_OTEL_TRACES}"
              - name: OTEL_TRACES_ENDPOINT
                value: "${TP_OTEL_TRACES_ENDPOINT}"
              - name: ENABLE_OTEL_METRICS
                value: "${TP_ENABLE_OTEL_METRICS}"
              - name: OTEL_METRICS_ENDPOINT
                value: "${TP_OTEL_METRICS_ENDPOINT}"
              - name: ENABLE_OTEL_LOGS
                value: "${TP_ENABLE_OTEL_LOGS}"
              - name: OTEL_LOGS_ENDPOINT
                value: "${TP_OTEL_LOGS_ENDPOINT}"
            volumeMounts:
                - name: license-secret
                  mountPath: /opt/tibco/license-file.bin
                  subPath: license-file.bin
                  readOnly: true
            volumes:
              - name: license-secret
                secret:
                  secretName: activation-file-secret
                  optional: true
          service:
            ports:
              restapp:
                enabled: true
                containerPort: 5678
                servicePort: 5678
                protocol: TCP
              soapapp:
                enabled: true
                containerPort: 7865
                servicePort: 7865
                protocol: TCP
        hawkconsole:
          enabled: ${TP_DEPLOY_HAWKCONSOLE}
          deployment:
            image:
              repository: "${TP_CONTAINER_REGISTRY}/${TP_CONTAINER_REGISTRY_REPOSITORY}/bw5-test"
              tag: "${TP_BMDP_IMAGE_TAG_HAWKCONSOLE}"
        bw6dm:
          enabled: ${TP_DEPLOY_BW6DM}
          deployment:
            image:
              repository: "${TP_CONTAINER_REGISTRY}/${TP_CONTAINER_REGISTRY_REPOSITORY}/bw5-test"
              tag: "${TP_BMDP_IMAGE_TAG_BW6DM}"
            volumeMounts:
              - name: license-secret
                mountPath: /opt/tibco/license-file.bin
                subPath: license-file.bin
                readOnly: true
            volumes:
              - name: license-secret
                secret:
                  secretName: activation-file-secret
                  optional: true
    cluster:
      names:
        - ${TP_CLUSTER_NAME}
    flags:
      wait: true
      timeout: 1h
      createNamespace: false
    hooks:
      preDeploy:
        ignoreErrors: false
        base64Encoded: false
        skip: false
        content: |
          kubectl create ns ${TP_BWDM_NAMESPACE}
          # add label for bmdp to connect to this namespace
          kubectl label namespace ${TP_BWDM_NAMESPACE} networking.platform.tibco.com/non-dp-ns=enable

          # create the secret for activation file
          create_secret_for_activation_file() {
            local namespace="${TP_BWDM_NAMESPACE}"
            local secret_name="activation-file-secret"

            echo "🔍 Checking if secret '$secret_name' exists in namespace '$namespace'..."
            if kubectl get secret "$secret_name" -n "$namespace" &> /dev/null; then
              echo "✅ Secret '$secret_name' already exists in namespace '$namespace'. Skipping creation."
              return 0
            fi

            echo "➕ Creating secret '$secret_name' in namespace '$namespace'..."
            # get the base64 encoded activation zip file from env first
            echo "$INPUT" > /tmp/activation-zip-base64.yaml
            ACTIVATION_ZIP_BASE64="$(
                yq e '.meta.guiEnv.GUI_TP_ACTIVATION_ZIP_FILE_BASE64' /tmp/activation-zip-base64.yaml
              )"
            if [ -z "$ACTIVATION_ZIP_BASE64" ]; then
              echo "❌ Activation zip file base64 content is empty. No license file will be created."
              return 0
            fi
            echo "$ACTIVATION_ZIP_BASE64" | base64 -d > /tmp/activation.zip
            unzip /tmp/activation.zip -d /tmp
            mv /tmp/*.bin /tmp/license-file.bin

            kubectl create secret generic "$secret_name" -n "$namespace" --from-file=/tmp/license-file.bin

            echo "✅ Secret '$secret_name' created successfully."
          }

          create_secret_for_activation_file
