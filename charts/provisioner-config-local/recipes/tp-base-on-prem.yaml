# Recipe for installing TIBCO Control Plane on-premises
# This recipe provides a basic thrird-party tools that needed for TIBCO Control Plane
# cert-manager
# metrics-server
# ingress-nginx
# postgresql
apiVersion: v1
kind: helm-install
meta:
  guiEnv:
    note: "deploy-tp-base-on-prem"
    GUI_TP_DNS_DOMAIN: localhost.dataplanes.pro
    GUI_TP_INSTALL_NGINX_INGRESS: true
    GUI_TP_INSTALL_TRAEFIK_INGRESS: false
    GUI_TP_INGRESS_SERVICE_TYPE: LoadBalancer

    # storage
    GUI_TP_STORAGE_CLASS: "hostpath"

    # nfs internal server
    GUI_TP_INSTALL_NFS_SERVER_PROVISIONER: false
    GUI_TP_STORAGE_CLASS_FOR_NFS_SERVER_PROVISIONER: ""
    GUI_TP_NFS_SERVER_PROVISIONER_SIZE: 50Gi
    GUI_TP_NFS_SERVER_PROVISIONER_STORAGE_CLASS_NAME: nfs

    # nfs external server
    GUI_TP_INSTALL_NFS_SUBDIR_EXTERNAL_PROVISIONER: false
    GUI_TP_STORAGE_NFS_SERVER_ADDRESS: ""
    GUI_TP_STORAGE_NFS_SUBDIR_EXTERNAL_PROVISIONER_STORAGE_CLASS: nfs-client

    # chart repo
    GUI_TP_CHART_REPO: "https://tibcosoftware.github.io/tp-helm-charts"
    GUI_TP_CHART_REPO_USER_NAME: "cp-test"
    GUI_TP_CHART_REPO_TOKEN: ""

    # container registry
    GUI_TP_CONTAINER_REGISTRY_URL: "csgprduswrepoedge.jfrog.io"
    GUI_TP_CONTAINER_REGISTRY_REPOSITORY: "tibco-platform-docker-prod"
    GUI_TP_CONTAINER_REGISTRY_USER: ""
    GUI_TP_CONTAINER_REGISTRY_PASSWORD: ""

    # third party
    GUI_TP_PROVISIONER_UI_INGRESS_CLASSNAME: nginx
    GUI_TP_PROVISIONER_UI_NAMESPACE: tekton-tasks
    GUI_TP_AUTOMATION_INSTALL: false
    GUI_TP_AUTOMATION_NAMESPACE: automation

    # third party tools version
    GUI_TP_THIRD_PARTY_VERSION_INGRESS_NGINX: 4.14.1
    GUI_TP_THIRD_PARTY_VERSION_TRAEFIK: 39.0.2

    # CNI
    GUI_TP_INSTALL_CALICO_CNI: false

    # DB setup env
    GUI_TP_INSTALL_POSTGRES: true
    GUI_TP_DB_USER_NAME: postgres
    GUI_TP_DB_PASSWORD: postgres
    GUI_TP_DB_NAME: postgres
    GUI_TP_DB_TLS_ENABLED: false

    # CP automation
    GUI_TP_AUTOMATION_DOCKER_IMAGE_REPO: "ghcr.io/tibcosoftware/platform-provisioner/platform-provisioner"
    GUI_TP_AUTOMATION_DOCKER_IMAGE_TAG: 1.7.15-auto-on-prem-jammy

    # langfuse
    GUI_TP_LANGFUSE_NAMESPACE: langfuse-system
    GUI_TP_LANGFUSE_ADMIN_EMAIL: cp-test@tibco.com
    GUI_TP_LANGFUSE_INIT_PROJECT_PUBLIC_KEY: lf_pk_default_public_key_1234567890
    GUI_TP_LANGFUSE_INIT_PROJECT_SECRET_KEY: lf_sk_default_secret_key_1234567890abcdef
    GUI_TP_LANGFUSE_INIT_USER_PASSWORD: Tibco@123

    # flow control
    GUI_TP_INSTALL_LANGFUSE: false
    GUI_TP_INSTALL_PROVISIONER_UI: false
    GUI_TP_INSTALL_CERT_MANAGER: true
    GUI_TP_INSTALL_METRICS_SERVER: true
    GUI_PIPELINE_LOG_DEBUG: false
  globalEnvVariable:
    REPLACE_RECIPE: true
    PIPELINE_LOG_DEBUG: ${GUI_PIPELINE_LOG_DEBUG:-false}
    PIPELINE_CHECK_DOCKER_STATUS: false

    # chart repo
    TP_CHART_REPO: ${GUI_TP_CHART_REPO:-"https://tibcosoftware.github.io/tp-helm-charts"}
    TP_CHART_REPO_USER_NAME: ${GUI_TP_CHART_REPO_USER_NAME:-"cp-test"}
    TP_CHART_REPO_TOKEN: ${GUI_TP_CHART_REPO_TOKEN}

    # container registry
    TP_CONTAINER_REGISTRY_URL: ${GUI_TP_CONTAINER_REGISTRY_URL:-"csgprduswrepoedge.jfrog.io"}
    TP_CONTAINER_REGISTRY_REPOSITORY: ${GUI_TP_CONTAINER_REGISTRY_REPOSITORY:-"tibco-platform-docker-prod"}
    TP_CONTAINER_REGISTRY_USER: ${GUI_TP_CONTAINER_REGISTRY_USER}
    TP_CONTAINER_REGISTRY_PASSWORD: ${GUI_TP_CONTAINER_REGISTRY_PASSWORD}

    # env
    TP_CLUSTER_NAME: ${GUI_TP_CLUSTER_NAME:-"on-prem"}

    # domain
    TP_INSTALL_NGINX_INGRESS: ${GUI_TP_INSTALL_NGINX_INGRESS:-"true"}
    TP_INSTALL_TRAEFIK_INGRESS: ${GUI_TP_INSTALL_TRAEFIK_INGRESS:-"false"}
    TP_INGRESS_NAMESPACE: ingress-system
    TP_DNS_DOMAIN: ${GUI_TP_DNS_DOMAIN:-"localhost.dataplanes.pro"}
    TP_INGRESS_SERVICE_TYPE: ${GUI_TP_INGRESS_SERVICE_TYPE:-"ClusterIP"} # LoadBalancer used for minikube with tunel, NodePort used for kind, ClusterIP used for kubectl port-forward
    TP_INGRESS_USE_HOSTPORT: false # true for kind
    # storage
    TP_STORAGE_CLASS: ${GUI_TP_STORAGE_CLASS:-"standard"} # hostpath for docker desktop, standard for minikube and kind, microk8s-hostpath for microk8s

    # nfs server, this is used for nfs server provisioner. (NFS server is installed in the same cluster)
    TP_STORAGE_CLASS_FOR_NFS_SERVER_PROVISIONER: ${GUI_TP_STORAGE_CLASS_FOR_NFS_SERVER_PROVISIONER:-""}
    TP_INSTALL_NFS_SERVER_PROVISIONER: ${GUI_TP_INSTALL_NFS_SERVER_PROVISIONER:-"false"}
    TP_NFS_SERVER_PROVISIONER_SIZE: ${GUI_TP_NFS_SERVER_PROVISIONER_SIZE:-"50Gi"}
    TP_NFS_SERVER_PROVISIONER_STORAGE_CLASS_NAME: ${GUI_TP_NFS_SERVER_PROVISIONER_STORAGE_CLASS_NAME:-"nfs"}

    # nfs subdir external provisioner. This is used for external storage provisioner. (NFS server is installed in the external server)
    TP_INSTALL_NFS_SUBDIR_EXTERNAL_PROVISIONER: ${GUI_TP_INSTALL_NFS_SUBDIR_EXTERNAL_PROVISIONER:-"false"}
    TP_STORAGE_NFS_SERVER_ADDRESS: ${GUI_TP_STORAGE_NFS_SERVER_ADDRESS:-""}
    TP_STORAGE_NFS_SERVER_PATH: ${GUI_TP_STORAGE_NFS_SERVER_PATH:-"/mnt/nfs_share"}
    TP_STORAGE_NFS_SUBDIR_EXTERNAL_PROVISIONER_STORAGE_CLASS: ${GUI_TP_STORAGE_NFS_SUBDIR_EXTERNAL_PROVISIONER_STORAGE_CLASS:-"nfs-client"}

    # third party
    TP_EXT_NAMESPACE: tibco-ext
    TP_INSTALL_PROVISIONER_UI: ${GUI_TP_INSTALL_PROVISIONER_UI:-"false"}
    TP_PROVISIONER_UI_NAMESPACE: ${GUI_TP_PROVISIONER_UI_NAMESPACE:-"tekton-tasks"}
    TP_PROVISIONER_UI_INGRESS_CLASSNAME: ${GUI_TP_PROVISIONER_UI_INGRESS_CLASSNAME:-"nginx"}
    TP_AUTOMATION_INSTALL: ${GUI_TP_AUTOMATION_INSTALL:-false}
    TP_AUTOMATION_NAMESPACE: ${GUI_TP_AUTOMATION_NAMESPACE:-"automation"}

    # third party tools version
    TP_THIRD_PARTY_VERSION_INGRESS_NGINX: ${GUI_TP_THIRD_PARTY_VERSION_INGRESS_NGINX:-"4.14.1"} # release: https://github.com/kubernetes/ingress-nginx/releases
    TP_THIRD_PARTY_VERSION_TRAEFIK: ${GUI_TP_THIRD_PARTY_VERSION_TRAEFIK:-"37.4.0"} # release: https://github.com/traefik/traefik-helm-chart/releases

    # CNI
    TP_INSTALL_CALICO_CNI: ${GUI_TP_INSTALL_CALICO_CNI:-"false"}
    TP_NAMESPACE_CALICO: ${GUI_TP_NAMESPACE_CALICO:-"kube-system"}

    # DB setup env
    TP_INSTALL_POSTGRES: ${GUI_TP_INSTALL_POSTGRES:-"true"}
    TP_DB_USER_NAME: ${GUI_TP_DB_USER_NAME:-"postgres"}
    TP_DB_PASSWORD: ${GUI_TP_DB_PASSWORD:-"postgres"}
    TP_DB_NAME: ${GUI_TP_DB_NAME:-"postgres"}
    TP_DB_TLS_ENABLED: ${GUI_TP_DB_TLS_ENABLED:-"false"}

    # CP automation
    TP_AUTOMATION_DOCKER_IMAGE_REPO: ${GUI_TP_AUTOMATION_DOCKER_IMAGE_REPO:-""}
    TP_AUTOMATION_DOCKER_IMAGE_TAG: ${GUI_TP_AUTOMATION_DOCKER_IMAGE_TAG:-""}

    # langfuse
    TP_INSTALL_LANGFUSE: ${GUI_TP_INSTALL_LANGFUSE:-false}
    TP_LANGFUSE_NAMESPACE: ${GUI_TP_LANGFUSE_NAMESPACE:-"langfuse"}

    # flow control
    TP_INSTALL_CERT_MANAGER: ${GUI_TP_INSTALL_CERT_MANAGER:-true}
    TP_INSTALL_METRICS_SERVER: ${GUI_TP_INSTALL_METRICS_SERVER:-true}
    
    # langfuse admin email
    TP_LANGFUSE_ADMIN_EMAIL: ${GUI_TP_LANGFUSE_ADMIN_EMAIL:-"cp-test@tibco.com"}
    
    # langfuse init configuration (with defaults)
    TP_LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${GUI_TP_LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-"lf_pk_default_public_key_1234567890"}
    TP_LANGFUSE_INIT_PROJECT_SECRET_KEY: ${GUI_TP_LANGFUSE_INIT_PROJECT_SECRET_KEY:-"lf_sk_default_secret_key_1234567890abcdef"}
    TP_LANGFUSE_INIT_USER_PASSWORD: ${GUI_TP_LANGFUSE_INIT_USER_PASSWORD:-"Tibco@123"}
helmCharts:
- condition: ${TP_INSTALL_CERT_MANAGER}
  name: cert-manager
  version: v1.19.2 # release: https://github.com/cert-manager/cert-manager/releases
  repo:
    helm:
      url: https://charts.jetstack.io
  values:
    keepPrevious: true
    content: |
      installCRDs: true
      serviceAccount:
        create: true
        name: cert-manager
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: cert-manager
  namespace: cert-manager
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
- condition: ${TP_INSTALL_METRICS_SERVER}
  name: metrics-server
  version: "3.13.0" # release: https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/Chart.yaml
  repo:
    helm:
      url: https://kubernetes-sigs.github.io/metrics-server/
  values:
    keepPrevious: true
    content: |
      clusterName: ${TP_CLUSTER_NAME}
      serviceAccount:
        create: true
        name: metrics-server
      args:
        - "--kubelet-insecure-tls" # https://github.com/docker/for-mac/issues/6274#issuecomment-1259624307
        - "--metric-resolution=90s"
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: metrics-server
  namespace: kube-system
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
- condition: ${TP_INSTALL_NGINX_INGRESS}
  name: ingress-nginx
  namespace: ${TP_INGRESS_NAMESPACE}
  version: ${TP_THIRD_PARTY_VERSION_INGRESS_NGINX} # release: https://github.com/kubernetes/ingress-nginx/releases
  repo:
    helm:
      url: https://kubernetes.github.io/ingress-nginx
  values:
    keepPrevious: true
    content: |
      # ingress-nginx doc: https://docs.nginx.com/nginx-ingress-controller/
      # ingress-nginx chart values: https://github.com/kubernetes/ingress-nginx/blob/main/charts/ingress-nginx/values.yaml
      controller:
        hostPort:
          enabled: ${TP_INGRESS_USE_HOSTPORT} # true for kind
        service:
          type: ${TP_INGRESS_SERVICE_TYPE} # NodePort for kind, LoadBalancer for others
        ingressClass:
          - nginx
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: ingress-nginx
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        kubectl create ns ${TP_INGRESS_NAMESPACE}
        # add label for tibtunnel to connect to the ingress controller
        kubectl label namespace ${TP_INGRESS_NAMESPACE} networking.platform.tibco.com/non-dp-ns=enable
        kubectl label namespace ${TP_INGRESS_NAMESPACE} networking.platform.tibco.com/non-cp-ns=enable
- condition: ${TP_INSTALL_TRAEFIK_INGRESS}
  name: traefik
  namespace: ${TP_INGRESS_NAMESPACE}
  version: ${TP_THIRD_PARTY_VERSION_TRAEFIK} # release: https://github.com/traefik/traefik-helm-chart/releases
  repo:
    helm:
      url: https://traefik.github.io/charts
  values:
    content: |
      # traefik doc: https://doc.traefik.io/traefik/
      # release: https://github.com/traefik/traefik-helm-chart/releases
      # chart values: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
      hub: # for hub
        enabled: false
      service:  # for external-dns
        type: ${TP_INGRESS_SERVICE_TYPE}
      ingressClass:
        name: traefik
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  releaseName: traefik
  flags:
    wait: true
    timeout: 1h
    createNamespace: true
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        kubectl create ns ${TP_INGRESS_NAMESPACE}
        # add label for tibtunnel to connect to the ingress controller
        kubectl label namespace ${TP_INGRESS_NAMESPACE} networking.platform.tibco.com/non-dp-ns=enable
        kubectl label namespace ${TP_INGRESS_NAMESPACE} networking.platform.tibco.com/non-cp-ns=enable
- name: nfs-server-provisioner
  version: 1.8.0 # release: https://github.com/kubernetes-sigs/nfs-ganesha-server-and-external-provisioner/releases
  namespace: kube-system
  releaseName: nfs-server-provisioner
  condition: ${TP_INSTALL_NFS_SERVER_PROVISIONER}
  repo:
    helm:
      url: https://kubernetes-sigs.github.io/nfs-ganesha-server-and-external-provisioner
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  values:
    keepPrevious: true
    content: |
      persistence:
        enabled: true
        storageClass: "${TP_STORAGE_CLASS_FOR_NFS_SERVER_PROVISIONER}"
        size: "${TP_NFS_SERVER_PROVISIONER_SIZE}"
      storageClass:
        name: "${TP_NFS_SERVER_PROVISIONER_STORAGE_CLASS_NAME}"
  flags:
    createNamespace: true
    timeout: 1h
- condition: ${TP_INSTALL_NFS_SUBDIR_EXTERNAL_PROVISIONER}
  name: nfs-subdir-external-provisioner
  namespace: nfs-system
  releaseName: nfs-subdir-external-provisioner
  version: "4.0.18" # release: https://github.com/kubernetes-sigs/nfs-subdir-external-provisioner/releases
  repo:
    helm:
      url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
  values:
    keepPrevious: true
    content: |
      nfs:
        server: ${TP_STORAGE_NFS_SERVER_ADDRESS}
        path: ${TP_STORAGE_NFS_SERVER_PATH}
      storageClass:
        name: "${TP_STORAGE_NFS_SUBDIR_EXTERNAL_PROVISIONER_STORAGE_CLASS}"
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  flags:
    createNamespace: true
    wait: true
    timeout: 1h
- name: on-premises-third-party
  version: ^1.0.0
  namespace: ${TP_EXT_NAMESPACE}
  releaseName: postgresql
  condition: ${TP_INSTALL_POSTGRES}
  repo:
    helm:
      url: ${TP_CHART_REPO}
      username: "${TP_CHART_REPO_USER_NAME}"
      password: "${TP_CHART_REPO_TOKEN}"
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  values:
    keepPrevious: true
    content: |
      global:
        tibco:
          containerRegistry:
            url: "${TP_CONTAINER_REGISTRY_URL}"
            username: "${TP_CONTAINER_REGISTRY_USER}"
            password: "${TP_CONTAINER_REGISTRY_PASSWORD}"
            repository: "${TP_CONTAINER_REGISTRY_REPOSITORY}"
        storageClass: ${TP_STORAGE_CLASS}
      postgresql:
        enabled: true
        auth:
          postgresPassword: ${TP_DB_PASSWORD}
          username: ${TP_DB_USER_NAME}
          password: ${TP_DB_PASSWORD}
          database: "${TP_DB_NAME}"
        global:
          imageRegistry: "${TP_CONTAINER_REGISTRY_URL}"
          imagePullSecrets:
          - tibco-container-registry-credentials
        image:
          repository: ${TP_CONTAINER_REGISTRY_REPOSITORY}/common-postgresql
          tag: 16.4.0-debian-12-r14
        primary:
          # resourcesPreset: "nano" # nano micro small
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
        tls:
          enabled: ${TP_DB_TLS_ENABLED}
          autoGenerated: true
  flags:
    createNamespace: true
    timeout: 1h
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        kubectl create ns ${TP_EXT_NAMESPACE}
        kubectl label namespace ${TP_EXT_NAMESPACE} networking.platform.tibco.com/non-dp-ns=enable
        kubectl label namespace ${TP_EXT_NAMESPACE} networking.platform.tibco.com/non-cp-ns=enable
- name: platform-provisioner-ui
  version: ^1.0.0
  namespace: ${TP_PROVISIONER_UI_NAMESPACE}
  releaseName: platform-provisioner-ui
  condition: ${TP_INSTALL_PROVISIONER_UI}
  repo:
    helm:
      url: https://tibcosoftware.github.io/platform-provisioner
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  values:
    keepPrevious: true
    content: |
      ingress:
        enabled: true
        className: ${TP_PROVISIONER_UI_INGRESS_CLASSNAME}
        hosts:
          - host: provisioner.${TP_DNS_DOMAIN}
            paths:
              - path: /
                pathType: ImplementationSpecific
  flags:
    createNamespace: true
    timeout: 1h
- name: generic-chart # TP automation UI
  version: 1.4.0
  condition: ${TP_AUTOMATION_INSTALL}
  namespace: ${TP_AUTOMATION_NAMESPACE}
  releaseName: automation
  repo:
    helm:
      url: https://test-server.github.yyzd.me
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  values:
    keepPrevious: true
    content: |
      deployment:
        enabled: true
        image:
          repository: ${TP_AUTOMATION_DOCKER_IMAGE_REPO}
          tag: ${TP_AUTOMATION_DOCKER_IMAGE_TAG}
        ports:
          http:
            enabled: true
            protocol: TCP
            containerPort: 3120
          mcp-tp:
            enabled: true
            protocol: TCP
            containerPort: 8090
            servicePort: 8090
        env:
        - name: TP_MCP_TRANSPORT
          value: "streamable-http" # "streamable-http" or "sse"
        - name: TP_MCP_HTTP_BEARER_TOKEN
          value: ""
        - name: TP_MCP_DEBUG
          value: "false"
        - name: TP_AUTO_TASK_FROM_LOCAL_SOURCE
          value: "false"
        others:
          dnsPolicy: ClusterFirstWithHostNet
          # hostNetwork: true
      service:
        enabled: true
        ports:
          http:
            enabled: true
            protocol: TCP
            containerPort: 3120
            servicePort: 3120
          mcp-tp:
            enabled: true
            protocol: TCP
            containerPort: 8090
            servicePort: 8090
      serviceAccount:
        enabled: true
        name: auto-sa
      clusterRoleBinding:
        enabled: true
        name: auto-sa
        roleRef:
          name: "cluster-admin"
      ingress:
        enabled: true
        spec:
          ingressClassName: ${TP_PROVISIONER_UI_INGRESS_CLASSNAME}
          rules:
            - host: 'automation.${TP_DNS_DOMAIN}'
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: automation-generic-chart
                        port:
                          number: 3120
            - host: 'mcp-infra-tp-automation.${TP_DNS_DOMAIN}'
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: automation-generic-chart
                        port:
                          number: 8090
  flags:
    createNamespace: true
    timeout: 1h
- condition: ${TP_INSTALL_CALICO_CNI}
  name: tigera-operator
  namespace: ${TP_NAMESPACE_CALICO}
  releaseName: calico
  version: "v3.31.3" # release: https://docs.tigera.io/calico/charts
  repo:
    helm:
      url: https://docs.tigera.io/calico/charts
  values:
    content: |
      # calico doc: https://docs.tigera.io/calico/
      # release: https://docs.tigera.io/archive
      # chart values: https://github.com/projectcalico/calico/blob/master/charts/tigera-operator/values.yaml
      installation:
        enabled: true # enable custom resource
        # calicoNetwork:
        #   ipPools:
        #   - cidr: 192.168.0.0/16
        # podCIDR in cluster. Generally, calico would get this from the cluster. kind and k3s are tested.
        # Typha, CSI, apiServer are not needed in single node clusters. No way to disable typha at this moment.
      apiServer:
        enabled: false
      kubeletVolumePluginPath: None # disable CSI
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  flags:
    wait: true
    timeout: 1h
- condition: ${TP_INSTALL_LANGFUSE}
  name: langfuse
  namespace: ${TP_LANGFUSE_NAMESPACE}
  releaseName: langfuse
  version: "1.5.18" # release: https://github.com/langfuse/langfuse-k8s
  repo:
    helm:
      url: https://langfuse.github.io/langfuse-k8s
  cluster:
    names:
      - ${TP_CLUSTER_NAME}
  values:
    keepPrevious: true
    content: |
      # langfuse doc: https://langfuse.com/self-hosting/deployment/kubernetes-helm
      # chart values: https://github.com/langfuse/langfuse-k8s
      langfuse:
        web:
          pod:
            additionalEnv:
              - name: CLICKHOUSE_TIMEOUT
                value: "120000"
          livenessProbe:
            initialDelaySeconds: 300
            periodSeconds: 60
            failureThreshold: 20
            timeoutSeconds: 30
          readinessProbe:
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 20
            timeoutSeconds: 30
        service:
          type: ClusterIP
        ingress:
          enabled: true
          className: ${TP_PROVISIONER_UI_INGRESS_CLASSNAME}
          hosts:
            - host: langfuse.${TP_DNS_DOMAIN}
              paths:
                - path: /
                  pathType: Prefix
        salt:
          secretKeyRef:
            name: langfuse-secrets
            key: salt
        nextauth:
          url: https://langfuse.${TP_DNS_DOMAIN}
          secret:
            secretKeyRef:
              name: langfuse-secrets
              key: nextauth-secret
      additionalEnv:
        - name: LANGFUSE_INIT_ORG_ID
          value: "tibco-platform"
        - name: LANGFUSE_INIT_ORG_NAME
          value: "Tibco Cloud"
        - name: LANGFUSE_INIT_PROJECT_ID
          value: "control-plane"
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: "Tibco Control Plane"
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          value: "${TP_LANGFUSE_INIT_PROJECT_PUBLIC_KEY}"
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          value: "${TP_LANGFUSE_INIT_PROJECT_SECRET_KEY}"
        - name: LANGFUSE_INIT_USER_EMAIL
          value: "${TP_LANGFUSE_ADMIN_EMAIL}"
        - name: LANGFUSE_INIT_USER_NAME
          value: "Langfuse Admin"
        - name: LANGFUSE_INIT_USER_PASSWORD
          value: "${TP_LANGFUSE_INIT_USER_PASSWORD}"
      postgresql:
        auth:
          username: langfuse
          existingSecret: langfuse-secrets
          secretKeys:
            userPasswordKey: postgres-password
      clickhouse:
        auth:
          existingSecret: langfuse-secrets
          existingSecretKey: clickhouse-password
      redis:
        auth:
          existingSecret: langfuse-secrets
          existingSecretPasswordKey: redis-password
      s3:
        auth:
          existingSecret: langfuse-secrets
          rootUserSecretKey: s3-root-user
          rootPasswordSecretKey: s3-root-password
  flags:
    createNamespace: true
    wait: true
    timeout: 1h
  hooks:
    preDeploy:
      ignoreErrors: false
      base64Encoded: false
      skip: false
      content: |
        kubectl create ns ${TP_LANGFUSE_NAMESPACE}
        kubectl label namespace ${TP_LANGFUSE_NAMESPACE} networking.platform.tibco.com/non-cp-ns=enable
        
        # Generate random secrets for langfuse
        SALT=$(openssl rand -hex 16)
        NEXTAUTH_SECRET=$(openssl rand -hex 32)
        POSTGRESQL_PASSWORD=$(openssl rand -hex 16)
        CLICKHOUSE_PASSWORD=$(openssl rand -hex 16)
        REDIS_PASSWORD=$(openssl rand -hex 16)
        S3_ROOT_USER="langfuse"
        S3_ROOT_PASSWORD=$(openssl rand -hex 16)
        
        # Secret for langfuse credentials (for local development)
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Secret
        metadata:
          name: langfuse-secrets
          namespace: ${TP_LANGFUSE_NAMESPACE}
        type: Opaque
        stringData:
          salt: "${SALT}"
          nextauth-secret: "${NEXTAUTH_SECRET}"
          postgres-password: "${POSTGRESQL_PASSWORD}"
          clickhouse-password: "${CLICKHOUSE_PASSWORD}"
          redis-password: "${REDIS_PASSWORD}"
          s3-root-user: "${S3_ROOT_USER}"
          s3-root-password: "${S3_ROOT_PASSWORD}"
        EOF
