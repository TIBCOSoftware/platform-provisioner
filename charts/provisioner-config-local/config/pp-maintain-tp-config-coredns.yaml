pipelineName: "Config CoreDNS"
description: |
  This pipeline configures CoreDNS for the TP cluster so that `*.localhost.dataplanes.pro`
  resolves in-cluster to the target ingress service, e.g.
  * `ingress-nginx-controller.ingress-system.svc.cluster.local` for nginx
  * `traefik.ingress-system.svc.cluster.local` for traefik

  The domain `*.localhost.dataplanes.pro` points to 127.0.0.1; in-cluster callers need it
  redirected to the target ingress service.

  The rewrite is applied in the most durable way available on the cluster. When the live CoreDNS
  Corefile imports `/etc/coredns/custom/*.override`, the rule is written into the UNMANAGED
  `coredns-custom` ConfigMap in `kube-system`; the coredns addon does not reconcile that
  ConfigMap, so the rule persists across CoreDNS restarts/reconciles (a rewrite added straight
  into the managed Corefile would be reverted on the next reconcile). On clusters whose Corefile
  does not import a custom directory, the rule is added to the managed `coredns` Corefile
  directly as a fallback.

  This pipeline is idempotent. The CoreDNS pod is restarted after the change.

  In order to avoid dealing with escape characters in the regex pattern, we use the base64 form
  of the regex pattern. Use this command to generate it:
  ```bash
  echo '(.*)\.localhost\.dataplanes\.pro' | base64
  ```
options:
- name: "The target service"
  type: string
  guiType: input
  reference: "meta.guiEnv.GUI_TARGET_SERVICE"
  required: true
  description: |
    The target service to rewrite the domain name to. For nginx: `ingress-nginx-controller.ingress-system.svc.cluster.local`
    For traefik: `traefik.ingress-system.svc.cluster.local`
- name: "The regex domain pattern in base64"
  type: string
  guiType: input
  reference: "meta.guiEnv.GUI_REGEX_PATTERN_BASE64"
  required: true
  description: |
    Base64 format of the regex pattern to match the domain name. The default value is: `(.*)\.localhost\.dataplanes\.pro`
recipe: |
  apiVersion: v1
  kind: generic-runner
  meta:
    guiEnv:
      note: "config-coredns"
      GUI_PIPELINE_LOG_DEBUG: false
      GUI_TARGET_SERVICE: "traefik.ingress-system.svc.cluster.local"
      GUI_REGEX_PATTERN_BASE64: "KC4qKVwubG9jYWxob3N0XC5kYXRhcGxhbmVzXC5wcm8K"
    globalEnvVariable:
      REPLACE_RECIPE: true
      PIPELINE_LOG_DEBUG: ${GUI_PIPELINE_LOG_DEBUG:-false}
      REGEX_PATTERN_BASE64: ${GUI_REGEX_PATTERN_BASE64:-"KC4qKVwubG9jYWxob3N0XC5kYXRhcGxhbmVzXC5wcm8K"}
      TARGET_SERVICE: ${GUI_TARGET_SERVICE:-"ingress-nginx-controller.ingress-system.svc.cluster.local"}
  tasks:
    - condition: true
      clusters:
        - name: ${TP_CLUSTER_NAME}
      script:
        ignoreErrors: false
        fileName: script.sh
        content: |
          #!/bin/bash
          set -euo pipefail
          REGEX_PATTERN=$(echo "$REGEX_PATTERN_BASE64" | base64 --decode | tr -d '\n')

          # Apply the *.localhost.dataplanes.pro -> ingress rewrite in the most durable way
          # available. When the live Corefile imports /etc/coredns/custom/*.override, write the
          # rule into the UNMANAGED coredns-custom ConfigMap (not reconciled by the coredns addon,
          # so it survives CoreDNS restarts/reconciles). Otherwise patch the managed Corefile
          # directly as a fallback (clusters whose Corefile does not import a custom directory).
          if kubectl -n kube-system get cm coredns -o jsonpath='{.data.Corefile}' | grep -q 'import /etc/coredns/custom'; then
            echo "CoreDNS imports a custom override dir; writing the unmanaged coredns-custom ConfigMap (durable)."
            kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: coredns-custom
            namespace: kube-system
          data:
            dataplanes.override: |
              rewrite name regex $REGEX_PATTERN $TARGET_SERVICE answer auto
          EOF
          else
            echo "CoreDNS has no custom override import; patching the managed Corefile directly (idempotent)."
            kubectl get configmap coredns -n kube-system -o json | jq --arg regex "$REGEX_PATTERN" --arg target "$TARGET_SERVICE" '
              .data.Corefile |=
              if (. | test("rewrite name regex \\Q" + $regex + "\\E " + $target + " answer auto")) then
                .
              else
                (split("\n") | map(
                  if test("^\\s*ready\\s*$") then
                    . + "\n    rewrite name regex " + $regex + " " + $target + " answer auto"
                  else
                    .
                  end
                ) | join("\n"))
              end
            ' > /tmp/coredns-updated.json
            kubectl apply -f /tmp/coredns-updated.json
          fi

          kubectl rollout restart deployment coredns -n kube-system
