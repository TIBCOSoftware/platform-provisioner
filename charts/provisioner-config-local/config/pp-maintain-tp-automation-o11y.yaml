pipelineName: "TP Automation"
description: |
  This pipeline will run an automation to create a new DP, register a DP and configure o11y service for a given DP.
  
  The input of this recipe is user name an password. 
  
  To use this pipeline you need to: 
  * Deploy a CP and create admin user
  * Create a subscription with give user which will be used for this pipeline
  * Deploy o11y stack. (Elastic, Prometheus)
  
  The automation will: 
  * Adjust user permission if necessary
  * Create a new DP
  * Register a DP
  * Config o11y service for a given DP
groups:
- title: "Automation Repository Configuration"
  index: 1
  description: |
    ## Automation repository configuration
    * The GitHub token for DP to access private helm chart repo
    * Matching CP version with automation version

    ---
- title: "Activation License File"
  index: 3
  description: |
    ## License file configuration
    * Upload your license file (activation.bin.zip) to enable application components

    ---
- title: "DP setup"
  index: 5
  description: |
    ## DP specific configurations
    * The automation will create a new DP
    * DP host prefix
    * Username and password of DP user

    ---
- title: "TP Automation Config"
  index: 6
  description: |
    ## Control the TP Automation flow
    * Select the workflow to be executed.
    
    ---
- title: "DNS and Port Forward"
  index: 7
  description: |
    ## DNS and Port Forward specific configurations
    * TP overwrite DNS
    * TP port forward

    ---
options:
# groupIndex: 1 Chart Repository Configuration
- name: "Automation GitHub repo name"
  groupIndex: 1
  type: string
  guiType: input
  reference: "meta.guiEnv.GUI_TP_AUTO_GITHUB_REPO_NAME"
  required: false
  description: |
    The automation GitHub location. Change to private repo if needed.
- name: "Automation GitHub repo path"
  groupIndex: 1
  type: string
  guiType: input
  reference: "meta.guiEnv.GUI_TP_AUTO_GITHUB_REPO_PATH"
  required: false
  description: |
    The automation source code GitHub path.
- name: "Automation GitHub repo branch"
  groupIndex: 1
  type: string
  guiType: input
  reference: "meta.guiEnv.GUI_TP_AUTO_GITHUB_REPO_BRANCH"
  required: false
  description: |
    The automation source code GitHub branch.
- name: "GitHub token"
  groupIndex: 1
  type: password
  guiType: input
  reference: "meta.guiEnv.GUI_GITHUB_TOKEN"
  description: |
    The GitHub token for DP to access private helm chart repo. If you deploy unreleased CP/DP; this GitHub token is a must.

# groupIndex: 3 Activation License File
- name: "Upload Activation License File (zip)"
  groupIndex: 3
  type: string
  accept: ".zip"
  fileSize: 100
  guiType: file
  reference: "meta.guiEnv.GUI_TP_ACTIVATION_ZIP_FILE_BASE64"
  description: |
    Upload the activation.bin.zip license file to enable application components.

# groupIndex: 5 DP setup
- name: "DP host prefix"
  groupIndex: 5
  type: string
  guiType: input
  reference: "meta.guiEnv.GUI_DP_HOST_PREFIX"
  required: true
  description: |
    The host prefix of DP
- name: "DP user email"
  groupIndex: 5
  type: string
  guiType: input
  reference: "meta.guiEnv.GUI_DP_USER_EMAIL"
  required: true
  description: |
    The user email of DP
- name: "DP user password"
  groupIndex: 5
  type: password
  guiType: input
  reference: "meta.guiEnv.GUI_DP_USER_PASSWORD"
  required: true
  description: |
    The password of DP user
# groupIndex: 6 TP Automation Config
- name: "USE CLI"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_USE_CLI"
  description: |
    Set to true to use CLI mode for DP operations instead of GUI (Playwright)
- name: "Active user"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ACTIVE_USER"
  description: |
    Set to true to activate admin and subscription user
- name: "Create BMDP"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_BMDP"
  description: |
    Set to true to create BMDP (Control Tower Data Plane)
- name: "Create DP"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_DP"
  description: |
    Set to true to create DP. For a Control Plane only run, untick the capability checkboxes below (Deploy Flogo, Deploy BWCE, ...) as well: a capability is provisioned inside a Data Plane, so leaving one ticked stops the pipeline with a configuration error naming it. Note that a Control Plane only run also skips Global observability configuration and licence activation, because in non-CLI mode those are performed by the same page_dp.py task the capability checkboxes schedule.
- name: "Configure DP O11Y"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_CONFIG_O11Y"
  description: |
    Set to true to configure DP O11Y
- name: "Setup Observability dashboards and cards"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_O11Y_WIDGET"
  description: |
    Set to true to set up Observability dashboards and cards: on newer CP, create per-capability dashboards (Default + logs + one per installed capability) and bulk-add cards; on older CP, add a few cards to the Default dashboard.
- name: "Deploy Flogo"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_FLOGO"
  description: |
    Set to true to deploy Flogo
- name: "Deploy BWCE"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_BWCE"
  description: |
    Set to true to deploy BWCE
- name: "Deploy MCP Hub"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AI_ENABLE_MCP_HUB"
  description: |
    Set to true to deploy MCP Hub (MCP Gateway + CP MCP Server + push to gateway)
- name: "Deploy Infra MCP Server"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_INFRA_MCP_SERVER"
  description: |
    Set to true to deploy Infra MCP Server capability
- name: "Deploy TIBCO Hub"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_TIBCOHUB"
  description: |
    Set to true to deploy TIBCO Hub
- name: "Deploy EMS"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_EMS"
  description: |
    Set to true to deploy EMS
- name: "Deploy ActiveSpaces"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_AS"
  description: |
    Set to true to deploy the TIBCO ActiveSpaces capability.
    Requires a control plane with tibco-cp-messaging 1.19.15 or later.
- name: "Enable hybrid connectivity"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_ENABLE_HYBRID_CONNECTIVITY"
  description: |
    Set to false when CP is deployed with hybrid connectivity disabled.
    When disabled, automation will fill the Reachable DP URL instead of waiting for tunnel connection.
- name: "Manage no-tibtunnel DP reachability"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_DP_MANAGE_REACHABILITY"
  description: |
    Only used when hybrid connectivity is disabled. When true (default), the automation makes the
    registered Reachable DP URL reachable after DP create — Option A: create a controller-adaptive
    cpdpproxy ingress; Option B: apply NetworkPolicy labels. Set false if reachability is provisioned
    externally.
- name: "Use private DP reachability (NetworkPolicy labels)"
  groupIndex: 6
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_AUTO_DP_APPLY_NETPOL_LABELS"
  description: |
    Only used when hybrid connectivity is disabled. false (default) = Option A: public cpdpproxy
    ingress at https://dp-<dpName>.<cpDnsDomain>. true = Option B: label cpdpproxy (cluster-ingress)
    and tp-dp-proxy (cluster-egress) and use the private http://cpdpproxy.<ns>.svc.cluster.local URL.

# groupIndex: 7 DNS and Port Forward
- name: "TP port forward"
  groupIndex: 7
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_PORT_FORWARD"
  description: |
    This will run kubectl port-forward command to forward the port of ingress controller. If you change the ingress controller name; you need to update the script.
- name: "TP overwrite DNS"
  groupIndex: 7
  type: boolean
  guiType: checkbox
  reference: "meta.guiEnv.GUI_TP_OVERWRITE_DNS"
  description: |
    If you see DNS issue; set this to ture. Or if you want to run the tester outside of current kubernetes cluster. For VDI use 10.178.2.10 as DNS server.
recipe: |
{{ tpl (.Files.Get "recipes/tp-automation-o11y.yaml") . | indent 2 }}
