#
# helm-unittest tests for secret-github.yaml
#
suite: Secret GitHub
templates:
  - secret-github.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should render a Secret with Opaque type
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque

  - it: should set metadata name from values
    asserts:
      - equal:
          path: metadata.name
          value: common-dependency-secret-github
      - equal:
          path: metadata.namespace
          value: tekton-tasks

  - it: should include standard labels
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: platform-provisioner
      - equal:
          path: metadata.labels["app.cloud.tibco.com/created-by"]
          value: generator-v2

  - it: should base64 encode githubToken
    set:
      githubToken: my-token
    asserts:
      - equal:
          path: data.GITHUB_TOKEN
          value: bXktdG9rZW4=

  - it: should base64 encode jfrogDevToken
    set:
      jfrogDevToken: jfrog-secret
    asserts:
      - equal:
          path: data.JFROG_DEV_TOKEN
          value: amZyb2ctc2VjcmV0
